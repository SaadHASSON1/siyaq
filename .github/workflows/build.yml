# Tests Siyaq, then builds it for Mac, Windows, Linux and Android on every push.
# Push a tag like v0.2.0 to also publish a (draft) GitHub release with the installers attached.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The end-to-end tests (tests/), in headless Chrome. Builds and releases wait for them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Arabic fonts for the right-to-left test book
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: npm ci
      - run: npm test

  # A tag's draft release, made once before the builds. (Left to each build, builds finishing together each made
  # their own draft, and the installers ended up split between them.)
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.make.outputs.id }}
    steps:
      - id: make
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          [ -n "$id" ] || id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" -f name="Siyaq $GITHUB_REF_NAME" -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, draft]
    # Every push builds; the draft job only runs for tags.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
            args: --target universal-apple-darwin
          - name: windows
            os: windows-latest
            args: ''
          - name: linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # One Mac build that runs on both Apple silicon and Intel.
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed copies only accept updates from this repository.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          # Tag pushes upload to their draft release; other pushes just build.
          releaseId: ${{ needs.draft.outputs.id }}
          # latest.json is written once by the release-notes job, after every build has uploaded.
          uploadUpdaterJson: false

      - uses: actions/upload-artifact@v5
        with:
          name: siyaq-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  # Android: one APK for phones and tablets (64- and 32-bit ARM), signed with the app's own key so each new version
  # installs over the last. The key comes from the repository's secrets (ANDROID_KEYSTORE, base64; and
  # ANDROID_KEYSTORE_PASSWORD); without them the APK is built but not signed, and not attached to the release.
  android:
    needs: [test, draft]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/siyaq.jks"
            printf 'storeFile=%s\npassword=%s\nkeyAlias=siyaq\n' "$RUNNER_TEMP/siyaq.jks" "$PASSWORD" > src-tauri/gen/android/app/keystore.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - run: npx tauri android build --apk --target aarch64 armv7
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk Siyaq-Android.apk
          gh release upload "$GITHUB_REF_NAME" Siyaq-Android.apk --clobber
      - uses: actions/upload-artifact@v5
        with:
          name: siyaq-android
          if-no-files-found: ignore
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  # Renames the installers to Siyaq-Mac.dmg and so on, then puts a download table at the top of the release page.
  release-notes:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/rename-assets.sh "$GITHUB_REF_NAME"
          sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/g; s/{{TAG}}/$GITHUB_REF_NAME/g" .github/release-notes.md > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
