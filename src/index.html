// ---------- Book language ----------
const STOPWORDS = {
  en: ['the', 'and', 'of', 'to', 'in', 'is', 'that', 'was', 'he', 'it', 'with', 'for', 'as', 'his', 'on', 'you', 'her', 'she', 'they', 'but', 'had', 'at', 'not'],
  tr: ['ve', 'bir', 'bu', 'da', 'de', 'için', 'ile', 'ne', 'çok', 'gibi', 'ama', 'daha', 'o', 'ben', 'sen', 'değil', 'olarak', 'kadar', 'şey', 'her'],
};

function detectLanguage(text) {
  const arabic = (text.match(/[؀-ۿ]/g) || []).length;
  const latin = (text.match(/\p{Script=Latin}/gu) || []).length;
  if (arabic + latin < 200) return null; // scanned pages, or too little text to tell
  if (arabic > latin) return 'ar';
  const words = text.toLocaleLowerCase('tr').match(/\p{L}+/gu) || [];
  const share = list => words.filter(w => list.includes(w)).length / words.length;
  const en = share(STOPWORDS.en), tr = share(STOPWORDS.tr);
  const turkishLetters = (text.match(/[ığşİĞŞ]/g) || []).length / latin; // letters English and most others never use
  if (en >= 0.08 && en > tr) return 'en';
  if (tr >= 0.03 && turkishLetters > 0.003) return 'tr';
  return 'other';
}

// Reads the first pages' text; covers, title pages and contents rarely have enough on their own.
async function detectBookLanguage(doc) {
  let text = '';
  for (let i = 1; i <= Math.min(doc.numPages, 15) && text.length < 6000; i++) {
    const content = await (await doc.getPage(i)).getTextContent();
    text += content.items.map(it => it.str).join(' ') + ' ';
  }
  return detectLanguage(text);
}

const showBookLang = () => { $('#bookLang').textContent = bookLang ? t('langs')[bookLang] : t('auto'); };

// ---------- Word picking ----------
const isWordChar = c => /[\p{L}\p{M}\p{N}'’-]/u.test(c);

function caretAt(x, y) {
  if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(x, y);
    return p && { node: p.offsetNode, offset: p.offset };
  }
  if (document.caretRangeFromPoint) {
    const r = document.caretRangeFromPoint(x, y);
    return r && { node: r.startContainer, offset: r.startOffset };
  }
}

// Joins the page's text spans and cuts out the sentence around the clicked spot.
function sentenceAround(span, offset) {
  let text = '', at = 0, lineStart = 0;
  for (const el of span.parentElement.children) {
    if (el.tagName === 'BR') {
      const line = text.slice(lineStart).trim();
      // "contin-" at a line end + "ue" on the next line → "continue"
      if (/\p{L}-$/u.test(text)) text = text.slice(0, -1);
      // A short line that doesn't carry on (a heading like "Down the Rabbit-Hole") ends a sentence.
      else if (line.length < 45 && !/[,;:\-–—]$/.test(line)) text += '\n';
      else text += ' ';
      lineStart = text.length;
      continue;
    }
    if (el === span) at = text.length + offset;
    text += el.textContent;
  }
  return cutSentence(text, at);
}

// The sentence around position `at`: back and forward to the nearest sentence end, at most 200 characters each way.
function cutSentence(text, at) {
  let start = at, end = at;
  while (start > 0 && !/[.!?؟\n]/.test(text[start - 1]) && at - start < 200) start--;
  while (end < text.length && !/[.!?؟\n]/.test(text[end]) && end - at < 200) end++;
  return text.slice(start, end + 1).replace(/\s+/g, ' ').trim();
}

// Characters from the start of a text span up to a point inside it (spans can hold <mark> children).
function offsetIn(span, node, offset) {
  const r = document.createRange();
  r.setStart(span, 0);
  r.setEnd(node, offset);
  return r.toString().length;
}

viewer.addEventListener('click', e => {
  const sel = window.getSelection();
  const selected = sel.toString().replace(/\s+/g, ' ').trim();
  const chapter = e.target.closest('.epub-chapter');
  if (chapter) { clickEpub(e, sel, selected); return; }
  if (selected) {
    const node = sel.anchorNode;
    const span = (node?.nodeType === 3 ? node.parentElement : node)?.closest('.textLayer > span');
    if (span && selected.split(' ').length <= 10) lookup(selected, sentenceAround(span, offsetIn(span, node, sel.anchorOffset)));
    return;
  }
  // A plain click on a link follows it; selecting the link's text still translates it (above).
  const pageDiv = e.target.closest('.page');
  const link = pageDiv && linkAt(pageDiv, e.clientX, e.clientY);
  if (link) { goToDest(link.dest); return; }
  const span = e.target.closest('.textLayer > span');
  if (!span) return;
  const pos = caretAt(e.clientX, e.clientY);
  if (!pos || pos.node.nodeType !== 3 || !span.contains(pos.node)) return;
  const text = span.textContent, at = offsetIn(span, pos.node, pos.offset);
  let s = at, en = at;
  while (s > 0 && isWordChar(text[s - 1])) s--;
  while (en < text.length && isWordChar(text[en])) en++;
  const word = text.slice(s, en).replace(/^['’-]+|['’-]+$/g, '');
  if (!word || !/\p{L}/u.test(word)) return;
  lookup(word, sentenceAround(span, s));
});

// ---------- AI ----------
// Reading a book in the same language you asked for: explain in simpler words instead of translating.
const sameLanguage = () => bookLang === settings.lang;

function buildPrompt(word, sentence) {
  const lang = LANGS[settings.lang].english;
  const same = sameLanguage();
  return `You help someone understand a word while they read a book.
Word or phrase: "${word}"
The sentence it appears in: "${sentence}"
Language of the book: ${LANGS[bookLang]?.english || 'detect it from the sentence'}
Answer in: ${lang}
${same ? `The reader reads ${lang} but doesn't know this word, so explain it in simpler ${lang} rather than translating it.\n` : ''}
Give the meaning of the word AS USED IN THIS SENTENCE, not just its most common meaning.
Reply with JSON only, no markdown fences, in exactly this shape:
{"translation": "${same ? `a simpler ${lang} word or short phrase that means the same here` : `short translation of the word as used in this sentence, in ${lang}`}",
 "explanation": "one or two sentences in ${lang} explaining what it means here and why",
 "base_form": "dictionary form of the word in its original language",
 "part_of_speech": "part of speech, in ${lang}",
 "other_meanings": ["up to 3 other common meanings, in ${lang}"],
 "sentence_translation": "${same ? `the sentence rephrased in simpler ${lang}` : `translation of the whole sentence into ${lang}`}"}`;
}

const BUSY = [429, 503, 529]; // rate limited, high demand, overloaded

// In the app, requests go through Rust so AI servers needn't allow browser (CORS) calls.
async function requestJson(method, url, headers, body) {
  if (tauri) {
    const r = await tauri.core.invoke('ai_request', { method, url, headers, body: body ?? null });
    return { ok: r.status >= 200 && r.status < 300, status: r.status, json: r.body };
  }
  const res = await fetch(url, { method, headers: { 'content-type': 'application/json', ...headers }, body: body && JSON.stringify(body) });
  return { ok: res.ok, status: res.status, json: await res.json() };
}

// One short retry for busy servers; anything longer defeats the point of a quick lookup.
async function postJson(url, headers, body) {
  let r = await requestJson('POST', url, headers, body);
  if (BUSY.includes(r.status)) {
    await new Promise(res => setTimeout(res, 800));
    r = await requestJson('POST', url, headers, body);
  }
  if (BUSY.includes(r.status)) throw new Error(t('busy'));
  return r;
}

// ----- Gemini: when one model is busy or retired, move straight on to another -----
const GEMINI = 'https://generativelanguage.googleapis.com/v1beta/';
let geminiModels = null; // Flash models this key can use, newest first
let geminiWorking = store.get('geminiWorking', null); // the Flash-Lite model that answered last, tried first

async function listGeminiModels() {
  if (geminiModels) return geminiModels;
  const r = await requestJson('GET', GEMINI + 'models?pageSize=1000', { 'x-goog-api-key': settings.apiKey });
  const version = n => parseFloat(n.match(/gemini-([\d.]+)/)[1]);
  geminiModels = (r.json?.models || [])
    .filter(m => m.supportedGenerationMethods?.includes('generateContent') && /^models\/gemini-[\d.]+-flash(-lite)?$/.test(m.name))
    .map(m => m.name.slice(7))
    .sort((a, b) => b.endsWith('-lite') - a.endsWith('-lite') || version(b) - version(a));
  return geminiModels;
}

async function geminiCall(model, prompt, noThinking) {
  const generationConfig = { responseMimeType: 'application/json', temperature: 0.2 };
  // A word lookup needs no step-by-step reasoning, and skipping it saves seconds.
  if (noThinking) generationConfig.thinkingConfig = /gemini-2\./.test(model) ? { thinkingBudget: 0 } : { thinkingLevel: 'minimal' };
  return requestJson('POST', `${GEMINI}models/${encodeURIComponent(model)}:generateContent`,
    { 'x-goog-api-key': settings.apiKey }, { contents: [{ parts: [{ text: prompt }] }], generationConfig });
}

// People type names like "Gemini Flash Lite": turn that into an id, or match it to a model the key has.
async function resolveGeminiModel(name) {
  const id = name.trim().toLowerCase().replace(/^models\//, '').replace(/\s+/g, '-');
  if (/^gemini-\d[\w.-]*$/.test(id)) return id;
  const words = id.split('-').filter(w => w && w !== 'gemini');
  return (await listGeminiModels()).find(m => words.every(w => m.split('-').includes(w))) || null;
}

async function askGemini(prompt) {
  const chosen = settings.model && await resolveGeminiModel(settings.model);
  const queue = [chosen, geminiWorking].filter(Boolean);
  const tried = new Set();
  let listed = false, lastError = t('busy');
  while (tried.size < 5) {
    const model = queue.find(m => !tried.has(m));
    if (!model) {
      if (listed) break;
      listed = true;
      queue.push(...await listGeminiModels());
      continue;
    }
    tried.add(model);
    let r = await geminiCall(model, prompt, true);
    if (r.status === 400 && /thinking/i.test(r.json?.error?.message || '')) r = await geminiCall(model, prompt, false);
    if (r.ok) {
      // Only remember Flash-Lite: a stand-in Flash model would burn its much smaller daily quota.
      if (model.endsWith('-lite') && geminiWorking !== model) store.set('geminiWorking', geminiWorking = model);
      return (r.json.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    }
    const msg = r.json?.error?.message || String(r.status);
    const suggested = msg.match(/\buse\s+models\/(gemini-[\w.-]*\w)/i)?.[1];
    if (suggested) queue.unshift(suggested);
    // A wrong key is worth stopping for; a model we can't use just means trying the next one.
    else if (!BUSY.includes(r.status) && r.status !== 404 && !/model/i.test(msg)) throw new Error(msg);
    lastError = BUSY.includes(r.status) ? t('busy') : msg;
  }
  throw new Error(lastError);
}

async function askAI(word, sentence) {
  const prompt = buildPrompt(word, sentence);
  const model = settings.model || DEFAULT_MODELS[settings.provider];
  let r, text;
  if (settings.provider === 'gemini') {
    text = await askGemini(prompt);
  } else if (settings.provider === 'anthropic') {
    r = await postJson('https://api.anthropic.com/v1/messages',
      { 'x-api-key': settings.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      { model, max_tokens: 800, messages: [{ role: 'user', content: prompt }] });
    if (!r.ok) throw new Error(r.json?.error?.message || r.status);
    text = (r.json.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  } else {
    const headers = settings.apiKey ? { authorization: 'Bearer ' + settings.apiKey } : {};
    r = await postJson(settings.baseUrl.replace(/\/+$/, '') + '/chat/completions', headers,
      { model, temperature: 0.2, messages: [{ role: 'user', content: prompt }] });
    if (!r.ok) throw new Error(r.json?.error?.message || r.status);
    text = r.json.choices?.[0]?.message?.content || '';
  }
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error(t('badReply'));
  return JSON.parse(m[0]);
}

// ---------- Lookup panel ----------
const canSpeak = 'speechSynthesis' in window;
const speakBtn = word => canSpeak ? `<button class="icon-btn speak" data-say="${esc(word)}" title="${t('speak')}" aria-label="${t('speak')}">${icon('volume')}</button>` : '';
const wordHead = (word, meta = '') => `<header class="result-head"><h2 class="word" dir="auto">${esc(word)}</h2>${speakBtn(word)}${meta}</header>`;
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const markWord = (sentence, word) => esc(sentence).replace(new RegExp(escRe(esc(word)), 'i'), m => `<mark>${m}</mark>`);
const section = (title, body) => `<section><h3 class="label">${title}</h3>${body}</section>`;
const stateCard = (iconName, text, action = '', cls = '') => `<div class="state ${cls}">${icon(iconName)}<p>${text}</p>${action}</div>`;

function sentenceBlock(word, sentence) {
  return section(t('sentence'), `<blockquote class="sentence" dir="auto">${markWord(sentence, word)}</blockquote>`);
}

async function lookup(word, sentence, fresh = false) {
  showTab('lookup');
  const pane = $('#lookup');
  if (!settings.apiKey && settings.provider !== 'openai') {
    lastLookup = { word, sentence };
    pane.innerHTML = wordHead(word) + stateCard('key', t('needKey'), `<button class="btn primary" id="keyBtn">${t('openSettings')}</button>`);
    $('#keyBtn').onclick = openSetup;
    openSetup();
    return;
  }
  const id = ++lookupId;
  lastLookup = { word, sentence };
  const key = settings.lang + '|' + word.toLowerCase() + '|' + sentence;
  // A word looked up before in another sentence: show what we know right away, spending nothing.
  const saved = !fresh && !cache.has(key) && !word.includes(' ') && vocab.find(v => v.word.toLowerCase() === word.toLowerCase());
  if (saved) { renderSaved(word, sentence, saved); return; }
  if (!cache.has(key)) {
    pane.innerHTML = `<article class="result">${wordHead(word)}<div class="skeleton"><span></span><span></span><span class="short"></span></div>${sentenceBlock(word, sentence)}</article>`;
  }
  try {
    const r = cache.get(key) || await askAI(word, sentence);
    cache.set(key, r);
    store.set('cache', [...cache].slice(-500));
    if (id !== lookupId) return;
    renderResult(word, sentence, r);
    saveWord(word, sentence, r);
  } catch (err) {
    if (id !== lookupId) return;
    pane.innerHTML = `<article class="result">${wordHead(word)}${stateCard('alert', esc(err.message), `<button class="btn" id="retryBtn">${t('retry')}</button>`, 'error')}${sentenceBlock(word, sentence)}</article>`;
    $('#retryBtn').onclick = () => lookup(word, sentence);
  }
}

function renderResult(word, sentence, r) {
  const d = `dir="${LANGS[settings.lang].dir}"`;
  const pos = r.part_of_speech ? `<span class="pos" ${d}>${esc(r.part_of_speech)}</span>` : '';
  const base = r.base_form && r.base_form.toLowerCase() !== word.toLowerCase() ? `<span dir="auto">${esc(r.base_form)}</span>` : '';
  const others = (r.other_meanings || []).map(m => `<span class="chip">${esc(m)}</span>`).join('');
  $('#lookup').innerHTML = `
    <article class="result">
      ${wordHead(word, pos || base ? `<div class="meta">${pos}${base}</div>` : '')}
      <p class="tr" ${d}>${esc(r.translation)}</p>
      <p class="explain" ${d}>${esc(r.explanation)}</p>
      ${sentenceBlock(word, sentence)}
      ${r.sentence_translation ? section(t(sameLanguage() ? 'sentenceSimple' : 'sentenceTr'), `<p ${d}>${esc(r.sentence_translation)}</p>`) : ''}
      ${others ? section(t('others'), `<div class="chips" ${d}>${others}</div>`) : ''}
    </article>`;
}

function renderSaved(word, sentence, v) {
  const d = `dir="${LANGS[settings.lang].dir}"`;
  $('#lookup').innerHTML = `
    <article class="result">
      ${wordHead(word)}
      <p class="tr" ${d}>${esc(v.translation)}</p>
      <p class="explain" ${d}>${esc(v.explanation || '')}</p>
      <p class="saved-note">${t('savedMeaning')}</p>
      <button class="btn" id="hereBtn">${t('explainHere')}</button>
      ${sentenceBlock(word, sentence)}
    </article>`;
  $('#hereBtn').onclick = () => lookup(word, sentence, true);
}

// ---------- Pronunciation ----------
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const lang = LANGS[bookLang] ? bookLang : /[\u0600-\u06FF]/.test(text) ? 'ar' : null;
  const voice = lang && speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith(lang));
  if (voice) u.voice = voice;
  if (lang) u.lang = voice?.lang || lang;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b) speak(b.dataset.say);
});

// ---------- Vocabulary ----------
function saveWord(word, sentence, r) {
  vocab = vocab.filter(v => !(v.word.toLowerCase() === word.toLowerCase() && v.sentence === sentence));
  vocab.unshift({ word, translation: r.translation, explanation: r.explanation, sentence, book: bookName, date: new Date().toISOString() });
  store.set('vocab', vocab);
  updateVocabCount();
  refreshKnown();
}

const updateVocabCount = () => { $('#vocabCount').textContent = vocab.length || ''; };

function renderVocab() {
  updateVocabCount();
  const pane = $('#vocab');
  if (!vocab.length) { pane.innerHTML = stateCard('bookmark', t('vocabEmpty')); return; }
  pane.innerHTML = `
    <div class="vocab-head"><span>${t('count')(vocab.length)}</span><span class="btns">
      <button class="btn small primary" id="reviewBtn">${icon('repeat')}${t('review')}<span class="badge">${dueWords().length || ''}</span></button>
      <button class="btn small" id="exportBtn" title="${t('export')}">${icon('download')}</button></span></div>
    <ul class="vocab-list">${vocab.map((v, i) => `
      <li>
        <div class="v-main"><span class="w" dir="auto">${esc(v.word)}</span><span class="v-tr" dir="auto">${esc(v.translation)}</span></div>
        <div class="v-book" dir="auto">${esc(v.book.replace(/\.pdf$/i, ''))}</div>
        <button class="icon-btn x" data-i="${i}" title="${t('remove')}" aria-label="${t('remove')}">${icon('x')}</button>
      </li>`).join('')}
    </ul>`;
  $('#exportBtn').onclick = exportCsv;
  $('#reviewBtn').onclick = startReview;
  pane.querySelectorAll('.x').forEach(b => b.onclick = () => { vocab.splice(+b.dataset.i, 1); store.set('vocab', vocab); renderVocab(); });
}

function exportCsv() {
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = vocab.map(v => [v.word, `${v.translation} — ${v.explanation}`, v.sentence, v.book].map(q).join(','));
  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'siyaq-vocab.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- EPUB ----------
// An EPUB is a zip of XHTML chapters. Each chapter becomes one long "page" of real text, and a small
// adapter makes the book look like a PDF.js document to the rest of the app (pages, text, outline).
const EPUB_BLOCKS = 'p,li,h1,h2,h3,h4,h5,h6,blockquote,td,th,dd,dt,figcaption,pre,div,section';
const IMAGE_TYPES = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' };
// Books are untrusted: only plain reading elements survive, never scripts, styles, forms or embeds.
const EPUB_ALLOWED = new Set(('p br hr h1 h2 h3 h4 h5 h6 blockquote ul ol li dl dt dd em i strong b u s sub sup small span a img '
  + 'figure figcaption table thead tbody tfoot tr td th pre code div section article aside header footer cite q abbr ruby rt rp').split(' '));
const EPUB_DROP = new Set(['script', 'style', 'iframe', 'object', 'embed', 'form', 'input', 'button', 'select', 'textarea', 'link',
  'meta', 'title', 'head', 'audio', 'video', 'canvas', 'math', 'template', 'noscript']);
let epubUrls = []; // picture URLs, freed when another book opens

// 'OEBPS/text/ch1.xhtml' + '../images/a.png' → 'OEBPS/images/a.png'
function resolvePath(base, rel) {
  const parts = base.split('/').slice(0, -1);
  for (const seg of rel.split('/')) {
    if (seg === '..') parts.pop();
    else if (seg && seg !== '.') parts.push(seg);
  }
  return parts.join('/');
}

const epubTarget = (base, href) => {
  const [path, frag] = href.split('#');
  return (path ? resolvePath(base, decodeURIComponent(path)) : base) + (frag ? '#' + frag : '');
};

function parseMarkup(text, type) {
  const doc = new DOMParser().parseFromString(text, type);
  // Some books ship slightly broken XHTML; the forgiving HTML parser still reads them.
  return doc.querySelector('parsererror') ? new DOMParser().parseFromString(text, 'text/html') : doc;
}

async function openEpub(data, name) {
  const files = fflate.unzipSync(data);
  const read = path => files[path] ? new TextDecoder().decode(files[path]) : '';
  const opfPath = parseMarkup(read('META-INF/container.xml'), 'application/xml').querySelector('rootfile').getAttribute('full-path');
  const opf = parseMarkup(read(opfPath), 'application/xml');
  const manifest = {};
  for (const item of opf.querySelectorAll('manifest > item')) {
    manifest[item.getAttribute('id')] = {
      href: resolvePath(opfPath, decodeURIComponent(item.getAttribute('href'))),
      type: item.getAttribute('media-type') || '',
      props: item.getAttribute('properties') || '',
    };
  }
  const spine = [...opf.querySelectorAll('spine > itemref')].map(r => manifest[r.getAttribute('idref')]).filter(m => m && /html/.test(m.type));

  epubUrls.forEach(URL.revokeObjectURL);
  epubUrls = [];
  const urls = {};
  const urlFor = path => {
    if (!urls[path] && files[path]) {
      const type = IMAGE_TYPES[path.split('.').pop().toLowerCase()] || 'application/octet-stream';
      epubUrls.push(urls[path] = URL.createObjectURL(new Blob([files[path]], { type })));
    }
    return urls[path] || '';
  };

  const chapters = spine.map((item, i) => {
    const doc = parseMarkup(read(item.href), item.type === 'text/html' ? 'text/html' : 'application/xhtml+xml');
    const section = document.createElement('section');
    section.className = 'page epub-chapter';
    section.dataset.page = i + 1;
    section.dataset.path = item.href;
    section.dir = 'auto';
    const lang = doc.documentElement.getAttribute('lang') || doc.documentElement.getAttribute('xml:lang');
    if (lang) section.lang = lang;
    cleanInto(doc.body || doc.documentElement, section, item.href, urlFor);
    return section;
  });

  const doc = {
    numPages: chapters.length,
    getPage: async n => ({ getTextContent: async () => ({ items: [{ str: chapters[n - 1].textContent }] }) }),
    getOutline: async () => epubOutline(read, manifest, opf),
  };
  pdfDoc = doc;
  bookType = 'epub';
  bookName = name;
  const title = opf.getElementsByTagNameNS('*', 'title')[0]?.textContent.trim();
  $('#bookTitle').textContent = title || name.replace(/\.epub$/i, '');
  $('#bookTitle').title = name;
  zoom = 1;
  viewer.style.setProperty('--epub-zoom', 1);
  viewer.replaceChildren(...chapters);
  chapters.forEach(markKnownInEpub);
  await finishOpening(doc, name);
}

// Copies only safe reading elements and attributes. Pictures become local blob URLs; links become
// in-book jumps (data-href) or web links (data-url) that the click handler decides what to do with.
function cleanInto(src, dest, base, urlFor) {
  for (const node of src.childNodes) {
    if (node.nodeType === Node.TEXT_NODE) { dest.append(node.textContent); continue; }
    if (node.nodeType !== Node.ELEMENT_NODE) continue;
    const tag = node.localName.toLowerCase();
    if (EPUB_DROP.has(tag)) continue;
    if (tag === 'svg') {
      // Covers are often an <image> inside an <svg>: keep just the picture.
      const image = node.querySelector('image');
      const href = image && (image.getAttribute('href') || image.getAttributeNS('http://www.w3.org/1999/xlink', 'href'));
      if (href && !/^[a-z]+:/i.test(href)) {
        const img = document.createElement('img');
        img.src = urlFor(resolvePath(base, decodeURIComponent(href)));
        dest.append(img);
      }
      continue;
    }
    if (!EPUB_ALLOWED.has(tag)) { cleanInto(node, dest, base, urlFor); continue; } // unknown wrapper: keep its text
    const el = document.createElement(tag);
    if (node.getAttribute('id')) el.id = 'e-' + node.getAttribute('id'); // prefixed so a book can't clash with the app's own ids
    for (const a of ['lang', 'dir', 'colspan', 'rowspan', 'alt', 'title']) {
      if (node.getAttribute(a)) el.setAttribute(a, node.getAttribute(a));
    }
    if (tag === 'img') {
      const imgSrc = node.getAttribute('src');
      if (!imgSrc || /^[a-z]+:/i.test(imgSrc)) continue; // nothing loads from the internet
      el.src = urlFor(resolvePath(base, decodeURIComponent(imgSrc)));
    }
    if (tag === 'a') {
      const href = node.getAttribute('href') || '';
      if (/^https?:\/\//i.test(href)) el.dataset.url = href;
      else if (href && !/^[a-z]+:/i.test(href)) el.dataset.href = epubTarget(base, href);
    }
    cleanInto(node, el, base, urlFor);
    dest.append(el);
  }
}

// The book's contents: the EPUB 3 navigation document, or the older EPUB 2 NCX file.
function epubOutline(read, manifest, opf) {
  const kids = (el, name) => [...el.children].filter(c => c.localName === name);
  const label = el => el.textContent.trim().replace(/\s+/g, ' ');
  const nav = Object.values(manifest).find(m => m.props.split(/\s+/).includes('nav'));
  if (nav) {
    const doc = parseMarkup(read(nav.href), 'application/xhtml+xml');
    const navs = [...doc.getElementsByTagName('nav')];
    const toc = navs.find(n => /toc/.test(n.getAttribute('epub:type') || n.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || '')) || navs[0];
    const walk = ol => kids(ol, 'li').map(li => {
      const a = kids(li, 'a')[0] || kids(li, 'span')[0];
      const href = a?.getAttribute('href');
      const sub = kids(li, 'ol')[0];
      return { title: a ? label(a) : '', dest: href ? { epub: epubTarget(nav.href, href) } : null, items: sub ? walk(sub) : [] };
    });
    const list = toc && kids(toc, 'ol')[0];
    if (list) return walk(list);
  }
  const ncxId = opf.querySelector('spine')?.getAttribute('toc');
  const ncx = (ncxId && manifest[ncxId]) || Object.values(manifest).find(m => m.type === 'application/x-dtbncx+xml');
  if (ncx) {
    const doc = parseMarkup(read(ncx.href), 'application/xml');
    const walk = parent => kids(parent, 'navPoint').map(np => {
      const src = kids(np, 'content')[0]?.getAttribute('src');
      return { title: label(kids(np, 'navLabel')[0] || np), dest: src ? { epub: epubTarget(ncx.href, src) } : null, items: walk(np) };
    });
    const map = doc.getElementsByTagName('navMap')[0];
    if (map) return walk(map);
  }
  return [];
}

function epubGoTo(target, remember = true) {
  const [path, frag] = target.split('#');
  const section = [...viewer.children].find(c => c.dataset.path === path);
  if (!section) return;
  const el = (frag && section.querySelector(`[id="e-${CSS.escape(frag)}"]`)) || section;
  if (remember) {
    backTo = viewer.scrollTop;
    $('#backBtn').hidden = false;
  }
  viewer.scrollTop += el.getBoundingClientRect().top - viewer.getBoundingClientRect().top - 24;
}

function zoomEpub(z) {
  const n = currentPage(), div = viewer.querySelector(`.page[data-page="${n}"]`);
  const frac = (viewer.scrollTop + 24 - div.offsetTop) / div.offsetHeight;
  zoom = z;
  viewer.style.setProperty('--epub-zoom', zoom);
  viewer.scrollTop = div.offsetTop - 24 + frac * div.offsetHeight; // stay at the same place in the chapter
  updateZoomLabel();
}

// Same rules as on PDF pages: links are followed, a selection is translated, a click translates the word.
function clickEpub(e, sel, selected) {
  if (selected) {
    const node = sel.anchorNode, block = (node?.nodeType === 3 ? node.parentElement : node)?.closest(EPUB_BLOCKS);
    if (block && selected.split(' ').length <= 10) lookup(selected, cutSentence(block.textContent, offsetIn(block, node, sel.anchorOffset)));
    return;
  }
  const a = e.target.closest('a[data-href], a[data-url]');
  if (a) {
    if (a.dataset.href) epubGoTo(a.dataset.href);
    else openLink(a.dataset.url);
    return;
  }
  const pos = caretAt(e.clientX, e.clientY);
  if (!pos || pos.node.nodeType !== 3) return;
  const block = pos.node.parentElement.closest(EPUB_BLOCKS);
  if (!block) return;
  const text = block.textContent, at = offsetIn(block, pos.node, pos.offset);
  let start = at, end = at;
  while (start > 0 && isWordChar(text[start - 1])) start--;
  while (end < text.length && isWordChar(text[end])) end++;
  const word = text.slice(start, end).replace(/^['’-]+|['’-]+$/g, '');
  if (word && /\p{L}/u.test(word)) lookup(word, cutSentence(text, start));
}

function markKnownInEpub(section) {
  for (const m of section.querySelectorAll('mark.known')) m.replaceWith(m.textContent);
  section.normalize();
  if (!knownRe) return;
  const walker = document.createTreeWalker(section, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.textContent, matches = [...text.matchAll(knownRe)];
    if (!matches.length) continue;
    const parts = [];
    let last = 0;
    for (const m of matches) {
      parts.push(text.slice(last, m.index));
      const mark = document.createElement('mark');
      mark.className = 'known';
      mark.textContent = m[0];
      parts.push(mark);
      last = m.index + m[0].length;
    }
    parts.push(text.slice(last));
    node.replaceWith(...parts);
  }
}

function highlightEpub(section) {
  for (const b of section.querySelectorAll('.hit')) b.classList.remove('hit');
  if (!search.query) return;
  for (const b of section.querySelectorAll('p,li,h1,h2,h3,h4,h5,h6,blockquote,td,dd,pre,figcaption')) {
    if (normText(b.textContent).includes(search.query)) b.classList.add('hit');
  }
}

// ---------- Reading position ----------
function restorePosition() {
  const p = store.get('positions', {})[bookKey];
  const div = p && viewer.querySelector(`.page[data-page="${p.page}"]`);
  if (!div || p.page < 2) return;
  viewer.scrollTop = div.offsetTop - 24 + p.frac * div.offsetHeight;
  showToast(t('resumed')(p.page));
}

let saveTimer;
function savePosition() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!pdfDoc) return;
    const n = currentPage(), div = viewer.querySelector(`.page[data-page="${n}"]`);
    const frac = div ? (viewer.scrollTop + 24 - div.offsetTop) / div.offsetHeight : 0;
    const all = store.get('positions', {});
    all[bookKey] = { page: n, frac: Math.min(1, Math.max(0, frac)), at: Date.now() };
    const recent = Object.keys(all).sort((a, b) => all[b].at - all[a].at).slice(0, 100); // the last 100 books
    store.set('positions', Object.fromEntries(recent.map(k => [k, all[k]])));
  }, 600);
}

// ---------- Contents ----------
async function loadToc(doc) {
  const pane = $('#toc');
  const outline = await doc.getOutline();
  if (pdfDoc !== doc) return;
  if (!outline?.length) { pane.innerHTML = stateCard('list', t('noToc')); return; }
  const items = [];
  const build = (list, depth) => `<ul${depth ? '' : ' class="toc"'}>${list.map(it => {
    items.push(it);
    return `<li><button data-toc="${items.length - 1}" dir="auto">${esc(it.title)}</button>${it.items?.length && depth < 3 ? build(it.items, depth + 1) : ''}</li>`;
  }).join('')}</ul>`;
  pane.innerHTML = build(outline, 0);
  pane.onclick = e => {
    const b = e.target.closest('[data-toc]');
    if (b && items[+b.dataset.toc].dest) goToDest(items[+b.dataset.toc].dest, false);
  };
}

// ---------- Search ----------
const search = { query: '', pages: [], shown: 0, token: 0 };
const pageTexts = new Map(); // page number → lower-cased text
const normText = s => s.toLocaleLowerCase().replace(/\s+/g, ' ');

async function pageText(doc, n) {
  if (!pageTexts.has(n)) {
    const ocr = ocrCache.get(n);
    const text = ocr ? ocr.flat().map(w => w.text).join(' ')
      : (await (await doc.getPage(n)).getTextContent()).items.map(it => it.str).join(' ');
    pageTexts.set(n, normText(text));
  }
  return pageTexts.get(n);
}

function openSearch() {
  $('#searchBar').hidden = false;
  $('#searchInput').focus();
  $('#searchInput').select();
}

function closeSearch() {
  $('#searchBar').hidden = true;
  $('#searchInput').value = '';
  search.token++;
  search.query = '';
  search.pages = [];
  viewer.querySelectorAll('.page').forEach(highlightSearch);
  $('#searchCount').textContent = '';
}

// Searches every page, starting from the one on screen; the first hit is shown as soon as it's found.
async function runSearch(q) {
  const token = ++search.token, doc = pdfDoc;
  search.query = normText(q.trim());
  search.pages = [];
  search.shown = 0;
  viewer.querySelectorAll('.page').forEach(highlightSearch);
  if (!search.query || !doc) { updateSearchCount(false); return; }
  updateSearchCount(true);
  const start = currentPage();
  for (let i = 0; i < doc.numPages; i++) {
    const n = (start - 1 + i) % doc.numPages + 1;
    const text = await pageText(doc, n);
    if (token !== search.token) return;
    if (!text.includes(search.query)) continue;
    search.pages.splice(search.pages.findIndex(p => p > n) >>> 0, 0, n); // keep in page order
    if (!search.shown) showSearchResult(n);
    updateSearchCount(true);
  }
  updateSearchCount(false);
}

function showSearchResult(n) {
  search.shown = n;
  goToPage(n);
  viewer.querySelectorAll('.page').forEach(highlightSearch);
  // A chapter is long: bring the first matching paragraph into view.
  const hit = bookType === 'epub' && viewer.querySelector(`.page[data-page="${n}"] .hit`);
  if (hit) viewer.scrollTop += hit.getBoundingClientRect().top - viewer.getBoundingClientRect().top - 80;
}

function stepSearch(dir) {
  if (!search.pages.length) return;
  const i = search.pages.indexOf(search.shown);
  showSearchResult(search.pages[(i + dir + search.pages.length) % search.pages.length]);
  updateSearchCount(false);
}

function updateSearchCount(busy) {
  const n = search.pages.length;
  $('#searchCount').textContent = !search.query ? '' : n ? `${search.pages.indexOf(search.shown) + 1} / ${n}${busy ? '…' : ''}` : busy ? t('searching') : t('searchNone');
}

function highlightSearch(div) {
  if (div.classList.contains('epub-chapter')) { highlightEpub(div); return; }
  for (const span of div.querySelectorAll('.textLayer > span')) {
    span.classList.toggle('hit', !!search.query && normText(span.textContent).includes(search.query));
  }
}

let searchTimer;
$('#searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(e.target.value), 300);
});
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); stepSearch(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') closeSearch();
});
$('#searchBtn').onclick = openSearch;
$('#searchPrev').onclick = () => stepSearch(-1);
$('#searchNext').onclick = () => stepSearch(1);
$('#searchClose').onclick = closeSearch;

// ---------- Words looked up before, underlined in the book ----------
let knownRe = null;
function refreshKnown() {
  const words = [...new Set(vocab.map(v => v.word.toLowerCase()).filter(w => /^[\p{L}\p{M}'’-]+$/u.test(w)))];
  knownRe = words.length
    ? new RegExp(`(?<![\\p{L}\\p{M}])(?:${words.sort((a, b) => b.length - a.length).map(escRe).join('|')})(?![\\p{L}\\p{M}])`, 'giu')
    : null;
  viewer.querySelectorAll('.textLayer').forEach(markKnownWords);
  viewer.querySelectorAll('.epub-chapter').forEach(markKnownInEpub);
}

function markKnownWords(layer) {
  for (const span of layer.querySelectorAll(':scope > span')) {
    if (span.querySelector('mark')) span.textContent = span.textContent; // back to plain text first
    if (!knownRe) continue;
    const text = span.textContent, matches = [...text.matchAll(knownRe)];
    if (!matches.length) continue;
    const parts = [];
    let last = 0;
    for (const m of matches) {
      parts.push(text.slice(last, m.index));
      const mark = document.createElement('mark');
      mark.className = 'known';
      mark.textContent = m[0];
      parts.push(mark);
      last = m.index + m[0].length;
    }
    parts.push(text.slice(last));
    span.replaceChildren(...parts);
  }
}

// ---------- Flashcards ----------
// Spaced repetition: each time you know a word it comes back later (1, 3, 7, 16, then 35 days).
const DAY = 864e5, INTERVALS = [0, 1, 3, 7, 16, 35];
const dueWords = () => vocab.filter(v => (v.due || 0) <= Date.now());
let reviewQueue = null;

function startReview() {
  reviewQueue = dueWords().sort((a, b) => (a.due || 0) - (b.due || 0));
  showCard(false);
}

function showCard(revealed) {
  const pane = $('#vocab');
  if (!reviewQueue.length) {
    pane.innerHTML = stateCard('check', t(vocab.some(v => v.box) ? 'reviewDone' : 'nothingDue'), `<button class="btn" id="listBtn">${t('backToList')}</button>`);
    $('#listBtn').onclick = endReview;
    return;
  }
  const v = reviewQueue[0], d = `dir="${LANGS[settings.lang].dir}"`;
  pane.innerHTML = `
    <div class="review">
      <div class="review-top"><span>${t('left')(reviewQueue.length)}</span><button class="btn small" id="listBtn">${t('backToList')}</button></div>
      <div class="card">
        ${wordHead(v.word)}
        ${v.sentence ? `<blockquote class="sentence" dir="auto">${markWord(v.sentence, v.word)}</blockquote>` : ''}
        ${revealed ? `<div class="answer"><p class="tr" ${d}>${esc(v.translation)}</p><p class="explain" ${d}>${esc(v.explanation || '')}</p></div>` : ''}
      </div>
      ${revealed
        ? `<div class="review-actions"><button class="btn again" id="againBtn">${t('again')}</button><button class="btn primary" id="goodBtn">${t('good')}</button></div>`
        : `<button class="btn primary lg" id="revealBtn">${t('reveal')}</button>`}
    </div>`;
  $('#listBtn').onclick = endReview;
  if (revealed) {
    $('#againBtn').onclick = () => grade(false);
    $('#goodBtn').onclick = () => grade(true);
  } else {
    $('#revealBtn').onclick = () => showCard(true);
  }
}

function grade(knew) {
  const v = reviewQueue.shift();
  v.box = knew ? Math.min((v.box || 0) + 1, INTERVALS.length - 1) : 0;
  v.due = Date.now() + INTERVALS[v.box] * DAY;
  if (!knew) reviewQueue.push(v); // comes back later in this session
  store.set('vocab', vocab);
  showCard(false);
}

function endReview() {
  reviewQueue = null;
  renderVocab();
}

// ---------- Scanned pages (OCR) ----------
const ocrCache = new Map(); // page number → lines of words, positioned in page units (scale 1)
let ocrWorker = null, ocrChain = Promise.resolve();

function ocrWorkerReady() {
  ocrWorker ??= Tesseract.createWorker(['eng', 'ara', 'tur'], 1, {
    workerPath: 'vendor/tesseract/worker.min.js',
    corePath: 'vendor/tesseract/core',
    langPath: 'vendor/tesseract/lang',
    gzip: true,
    cacheMethod: 'none',
    workerBlobURL: false,
  });
  return ocrWorker;
}

async function imageCoverage(page) {
  const vp = page.getViewport({ scale: 1 });
  const area = (await imageBoxes(page, vp, 1)).reduce((sum, [, , w, h]) => sum + w * h, 0);
  return area / (vp.width * vp.height);
}

// Pages are read one at a time, in the order they come into view.
function queueOcr(div, canvas, layer) {
  const n = +div.dataset.page;
  if (ocrCache.has(n)) { buildOcrLayer(layer, ocrCache.get(n), scale); return; }
  const badge = document.createElement('div');
  badge.className = 'ocr-badge';
  badge.textContent = t('ocrRunning');
  div.appendChild(badge);
  ocrChain = ocrChain.then(async () => {
    try {
      if (!canvas.isConnected) return; // zoomed or scrolled away: read again when it's drawn again
      const worker = await ocrWorkerReady();
      const { data } = await worker.recognize(canvas, {}, { blocks: true, text: true });
      const k = canvas.width / +div.dataset.w; // canvas pixels per page unit
      const lines = [];
      for (const block of data.blocks || []) for (const para of block.paragraphs) for (const line of para.lines) {
        const words = line.words
          // Unsure guesses are usually bits of pictures; the engine also adds invisible direction marks.
          .filter(w => w.confidence > 55)
          .map(w => ({ ...w, text: w.text.replace(/[\u200e\u200f\u202a-\u202e]/g, '').trim() }))
          .filter(w => /[\p{L}\p{N}]/u.test(w.text))
          .map(w => ({ text: w.text, x: w.bbox.x0 / k, y: w.bbox.y0 / k, w: (w.bbox.x1 - w.bbox.x0) / k, h: (w.bbox.y1 - w.bbox.y0) / k }));
        // Reading order: right to left for Arabic lines.
        const rtl = /[؀-ۿ]/.test(words.map(w => w.text).join(''));
        words.sort((a, b) => rtl ? b.x - a.x : a.x - b.x);
        if (words.length) lines.push(words);
      }
      ocrCache.set(n, lines);
      pageTexts.delete(n);
      if (!bookLang) {
        bookLang = detectLanguage(lines.flat().map(w => w.text).join(' '));
        showBookLang();
      }
      if (layer.isConnected) buildOcrLayer(layer, lines, scale);
    } catch (err) {
      console.error('OCR failed', err);
    } finally {
      badge.remove();
    }
  });
}

// Invisible, clickable words placed over the picture, like the text layer of a normal page.
function buildOcrLayer(layer, lines, s) {
  layer.replaceChildren();
  const placed = [];
  for (const words of lines) {
    words.forEach((w, i) => {
      const span = document.createElement('span');
      span.textContent = w.text + (i < words.length - 1 ? ' ' : '');
      Object.assign(span.style, { left: w.x * s + 'px', top: w.y * s + 'px', fontSize: w.h * s * 0.9 + 'px', fontFamily: 'sans-serif' });
      layer.appendChild(span);
      placed.push([span, w.w * s]);
    });
    layer.appendChild(document.createElement('br'));
  }
  for (const [span, width] of placed) {
    const natural = span.getBoundingClientRect().width;
    if (natural) span.style.transform = `scaleX(${width / natural})`;
  }
  markKnownWords(layer);
  highlightSearch(layer.parentElement);
}

// ---------- Toast ----------
function showToast(text, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(text)}</span>`
    + (action ? `<button class="btn small primary" id="toastBtn">${esc(action.label)}</button>` : '')
    + `<button class="icon-btn" id="toastClose" aria-label="${t('close')}">${icon('x')}</button>`;
  el.hidden = false;
  if (action) $('#toastBtn').onclick = action.run;
  $('#toastClose').onclick = () => { el.hidden = true; };
  clearTimeout(showToast.timer);
  if (!action) showToast.timer = setTimeout(() => { el.hidden = true; }, 4000);
}

// ---------- First-run setup ----------
const AI_STUDIO = 'https://aistudio.google.com/apikey';

function openSetup() {
  $('#setupKey').value = settings.apiKey || '';
  $('#setupMsg').className = 'msg';
  $('#setupMsg').textContent = '';
  if (!$('#setup').open) $('#setup').showModal();
}

async function openLink(url) {
  if (tauri) await tauri.core.invoke('open_link', { url });
  else window.open(url, '_blank', 'noopener');
}

$('#setupOpen').onclick = () => openLink(AI_STUDIO);
$('#setupLater').onclick = () => { store.set('setupSkipped', true); $('#setup').close(); };
$('#setupOther').onclick = () => { $('#setup').close(); openSettings(); };
$('#setupKey').addEventListener('keydown', e => { if (e.key === 'Enter') $('#setupSave').click(); });
$('#setupSave').onclick = async () => {
  const key = $('#setupKey').value.trim(), msg = $('#setupMsg');
  if (!key) { $('#setupKey').focus(); return; }
  msg.className = 'msg';
  msg.textContent = t('setupChecking');
  try {
    const r = await requestJson('GET', GEMINI + 'models?pageSize=1', { 'x-goog-api-key': key });
    if (!r.ok) throw new Error(r.json?.error?.message || r.status);
    Object.assign(settings, { provider: 'gemini', apiKey: key });
    store.set('settings', settings);
    geminiModels = null;
    msg.className = 'msg ok';
    msg.textContent = t('setupOk');
    setTimeout(() => {
      $('#setup').close();
      if (lastLookup) lookup(lastLookup.word, lastLookup.sentence);
    }, 900);
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = t('setupBad') + err.message;
  }
};

// ---------- Updates (installed app only) ----------
if (tauri) setTimeout(async () => {
  try {
    const version = await tauri.core.invoke('check_update');
    if (!version) return;
    showToast(t('updateAvail')(version), {
      label: t('updateNow'),
      run: async () => {
        showToast(t('updating'));
        try { await tauri.core.invoke('install_update'); } catch (err) { showToast(t('updateFailed') + err); }
      },
    });
  } catch {} // offline, or no releases yet
}, 3000);

// ---------- UI ----------
function showTab(name) {
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $('#lookup').hidden = name !== 'lookup';
  $('#vocab').hidden = name !== 'vocab';
  $('#toc').hidden = name !== 'toc';
  if (name === 'vocab' && !reviewQueue) renderVocab();
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

const form = $('#settingsForm');
function syncProviderFields() {
  form.querySelector('[data-for="openai"]').hidden = form.provider.value !== 'openai';
  form.querySelector('[data-for="gemini"]').hidden = form.provider.value !== 'gemini';
  form.model.placeholder = DEFAULT_MODELS[form.provider.value] || t('autoModel');
}
function openSettings() {
  for (const k of ['uiLang', 'theme', 'provider', 'baseUrl', 'apiKey', 'model']) form[k].value = settings[k] || '';
  syncProviderFields();
  $('#settings').showModal();
}
form.provider.onchange = () => { form.model.value = ''; syncProviderFields(); };
$('#settings').addEventListener('close', () => {
  if ($('#settings').returnValue !== 'save') return;
  const uiChanged = form.uiLang.value !== settings.uiLang;
  for (const k of ['uiLang', 'theme', 'provider', 'baseUrl', 'apiKey', 'model']) settings[k] = form[k].value.trim();
  store.set('settings', settings);
  applyTheme();
  if (uiChanged) {
    applyUiLanguage();
    if (lastLookup) lookup(lastLookup.word, lastLookup.sentence); // redraw the open word's labels
  }
});
$('#settingsBtn').onclick = openSettings;
$('#setupFromSettings').onclick = () => { $('#settings').close('cancel'); openSetup(); };

// ---------- Appearance ----------
const systemDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => settings.theme === 'dark' || (settings.theme === 'system' && systemDark.matches);

let pagesDark = null; // the theme the open book's pages were drawn in
function applyTheme() {
  if (settings.theme === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = settings.theme;
  $('#themeBtn').innerHTML = icon(isDark() ? 'sun' : 'moon');
  if (pagesDark !== null && pagesDark !== isDark()) setZoom(zoom, true); // redraw pages in the new colours
  pagesDark = isDark();
}
// The quick toggle picks the opposite of what's on screen and keeps it, whatever the system does later.
$('#themeBtn').onclick = () => {
  settings.theme = isDark() ? 'light' : 'dark';
  store.set('settings', settings);
  applyTheme();
};
systemDark.addEventListener('change', applyTheme);

function applyUiLanguage() {
  document.documentElement.lang = settings.uiLang;
  document.documentElement.dir = LANGS[settings.uiLang].dir;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);
    el.setAttribute('aria-label', el.title);
  });
  showBookLang();
  if (!$('#vocab').hidden && !reviewQueue) renderVocab();
  if (!pdfDoc) $('#toc').innerHTML = stateCard('list', t('noBook'));
  $('#searchInput').placeholder = t('searchPh');
}

const target = $('#target');
target.value = settings.lang;
target.onchange = () => {
  settings.lang = target.value;
  store.set('settings', settings);
  if (lastLookup) lookup(lastLookup.word, lastLookup.sentence); // show the open word in the new language
};
applyTheme();
applyUiLanguage();
updateVocabCount();
refreshKnown();
if (!settings.apiKey && settings.provider === 'gemini' && !store.get('setupSkipped', false)) openSetup();
