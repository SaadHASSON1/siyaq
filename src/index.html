<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سياق</title>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/tesseract/tesseract.min.js"></script>
<script src="vendor/fflate.min.js"></script>
<style>
  :root {
    --canvas: #e9e7e2;      /* behind the pages */
    --surface: #ffffff;     /* bars and panel */
    --surface-2: #f5f4f0;   /* inset areas */
    --text: #1c1b19;
    --muted: #77726a;
    --border: #e3dfd7;
    --accent: #1a7a55;
    --accent-hover: #156646;
    --accent-soft: #e3f0e9;
    --accent-text: #14613f;
    --mark: rgba(242, 201, 76, .45);
    --danger: #b3412f;
    --shadow-page: 0 1px 2px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
    --shadow-pop: 0 10px 40px rgba(0,0,0,.18);
    --radius: 10px;
    --page-bg: #ffffff;
    --logo: #475559; --logo-accent: #127a52;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #121211; --surface: #1c1c1a; --surface-2: #252523; --text: #ecebe7; --muted: #9b968d;
      --border: #2f2e2b; --accent: #3fbf85; --accent-hover: #5ccd98; --accent-soft: #153325; --accent-text: #7fd8ac;
      --mark: rgba(242, 201, 76, .3); --danger: #e58a76;
      --shadow-page: 0 1px 2px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.4);
      --page-bg: #1b1b1a; --logo: #e3e8ea; --logo-accent: #2fb57a;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #121211; --surface: #1c1c1a; --surface-2: #252523; --text: #ecebe7; --muted: #9b968d;
    --border: #2f2e2b; --accent: #3fbf85; --accent-hover: #5ccd98; --accent-soft: #153325; --accent-text: #7fd8ac;
    --mark: rgba(242, 201, 76, .3); --danger: #e58a76;
    --shadow-page: 0 1px 2px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.4);
    --page-bg: #1b1b1a; --logo: #e3e8ea; --logo-accent: #2fb57a;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--canvas); color: var(--text);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  .i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.lg { height: 44px; padding: 0 22px; font-size: 15px; font-weight: 600; border-radius: 10px; }
  .btn.small { height: 30px; padding: 0 10px; font-size: 13px; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px;
    border: 0; background: none; color: var(--muted); cursor: pointer; transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Top bar ---------- */
  .bar {
    display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px 0 16px;
    background: var(--surface); border-bottom: 1px solid var(--border); flex: none;
  }
  [dir="rtl"] .bar { padding: 0 16px 0 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; padding: 4px 6px; margin: -4px -6px; border: 0; border-radius: 8px; background: none; color: inherit; font-family: inherit; cursor: pointer; }
  .brand:hover { background: var(--surface-2); }
  .logo { width: 36px; height: 28px; display: block; }
  .book-title {
    flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding-inline-start: 12px; border-inline-start: 1px solid var(--border);
  }
  .tools { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); }
  .tools .icon-btn { width: 28px; height: 28px; }
  .ask-btn { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px 0 8px; border: 0; border-radius: 7px; background: none; color: var(--accent-text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  [dir="rtl"] .ask-btn { padding: 0 8px 0 10px; }
  .ask-btn svg { width: 15px; height: 15px; }
  .ask-btn:hover, body.ask-mode .ask-btn { background: var(--accent-soft); }
  body.ask-mode .textLayer span, body.ask-mode .epub-chapter { cursor: text; }
  .link-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 0; border: 0; background: none; color: var(--accent-text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .link-btn svg { width: 14px; height: 14px; }
  .link-btn:hover { text-decoration: underline; }
  .tools .readout { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .tools .divider { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
  .page-jump { display: flex; align-items: center; gap: 4px; padding: 0 6px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .page-jump input {
    width: 44px; height: 26px; text-align: center; border: 1px solid transparent; border-radius: 6px;
    background: var(--surface); color: var(--text); font-variant-numeric: tabular-nums;
  }
  .page-jump input:focus { border-color: var(--accent); outline: none; }
  .langpair {
    display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px 0 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  }
  [dir="rtl"] .langpair { padding: 0 12px 0 4px; }
  .langpair .from { color: var(--muted); white-space: nowrap; }
  .langpair .i { width: 14px; height: 14px; color: var(--muted); }
  .langpair select {
    border: 0; background: var(--accent-soft); color: var(--accent-text); font-weight: 600;
    height: 26px; border-radius: 6px; padding: 0 8px; cursor: pointer;
  }
  .actions { display: flex; align-items: center; gap: 2px; }

  /* ---------- Layout ---------- */
  main { flex: 1; display: flex; min-height: 0; position: relative; }
  .back { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5; box-shadow: var(--shadow-pop); border-radius: 999px; }
  .flip-back { transform: scaleX(-1); }
  [dir="rtl"] .flip-back { transform: none; }
  #viewer { flex: 1; overflow: auto; padding: 24px; position: relative; direction: ltr; }

  /* ---------- Welcome ---------- */
  .welcome { min-height: 100%; display: grid; place-items: center; direction: inherit; }
  [dir="rtl"] .welcome { direction: rtl; }
  .welcome-card {
    width: min(460px, 100%); text-align: center; padding: 40px 32px 28px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    transition: border-color .15s, background .15s;
  }
  .welcome.drag .welcome-card { border-color: var(--accent); background: var(--accent-soft); }
  .recent { grid-row: 3; width: min(460px, 100%); margin-top: 18px; }
  .recent h3 { margin: 0 4px 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .recent ul, .open-menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .book-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: start; }
  .book-item:hover { border-color: var(--accent); }
  .book-item > svg { width: 18px; height: 18px; flex: none; color: var(--accent-text); }
  .book-item .b-body { flex: 1; min-width: 0; }
  .book-item .b-name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-item .b-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 11.5px; color: var(--muted); }
  .book-item .b-bar { flex: 1; max-width: 120px; height: 4px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .book-item .b-bar span { display: block; height: 100%; background: var(--accent); }
  .book-item .x { width: 26px; height: 26px; flex: none; opacity: 0; }
  .book-item:hover .x, .book-item .x:focus-visible { opacity: 1; }
  .book-item .x .i { width: 14px; height: 14px; }
  .open-menu { position: fixed; z-index: 40; width: 340px; max-height: 70vh; overflow: auto; padding: 10px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-pop); }
  .open-menu h3 { margin: 2px 4px 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .open-menu .btn { width: 100%; margin-top: 8px; justify-content: center; }
  .open-menu .book-item.now { border-color: var(--accent); background: var(--accent-soft); cursor: default; }
  .mcp-box.usage small a { color: var(--accent-text); }
  .welcome-icon { display: block; width: 92px; height: 72px; margin: 0 auto 16px; }
  .welcome h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.01em; }
  .welcome p { margin: 0 auto; color: var(--muted); max-width: 340px; }
  .welcome .btn.lg { margin: 24px 0 10px; }
  .welcome .drop-hint { font-size: 13px; }
  .welcome { grid-template-rows: 1fr auto auto auto auto 1fr; }
  .welcome-card { grid-row: 2; }
  .welcome > .lang-pick { grid-row: 4; justify-self: center; margin-top: 18px; }
  .welcome-ver { grid-row: 5; justify-self: center; margin: 12px 0 0; font-size: 12px; color: var(--muted); opacity: .8; }
  /* App language, offered where a new user first looks: each name is written in its own language. */
  .lang-pick { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 13px; }
  .lang-pick svg { width: 15px; height: 15px; margin-inline: 8px 4px; }
  .lang-pick button { border: 0; background: none; color: inherit; font: inherit; padding: 4px 11px; border-radius: 999px; cursor: pointer; }
  .lang-pick button:hover { color: var(--text); }
  .lang-pick button.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .setup-head .lang-pick { margin-top: 14px; }
  .privacy {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 28px !important; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; max-width: none !important;
  }
  .privacy .i { width: 14px; height: 14px; }

  /* ---------- Pages ---------- */
  .page { zoom: var(--live-zoom, 1); position: relative; margin: 0 auto 20px; background: var(--page-bg); box-shadow: var(--shadow-page); border-radius: 2px; }
  .page canvas { display: block; border-radius: 2px; }
  .page.loading::after { content: ''; position: absolute; top: 40px; left: 50%; width: 26px; height: 26px; margin-left: -13px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Highlights: colour boxes over the page (PDF) or marks in the text (EPUB) */
  :root { --hl-yellow: rgba(250, 204, 21, .38); --hl-green: rgba(34, 197, 94, .3); --hl-blue: rgba(59, 130, 246, .28); --hl-pink: rgba(236, 72, 153, .26); }
  .hl-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .hl-layer .hl-box { position: absolute; border-radius: 2px; mix-blend-mode: multiply; }
  .hl-yellow { background: var(--hl-yellow); } .hl-green { background: var(--hl-green); } .hl-blue { background: var(--hl-blue); } .hl-pink { background: var(--hl-pink); }
  mark.hl { color: inherit; border-radius: 2px; }
  .hl-pin { position: absolute; z-index: 3; width: 18px; height: 18px; margin: -9px 0 0 -9px; padding: 0; border: 2px solid var(--surface); border-radius: 50%; cursor: pointer; pointer-events: auto; box-shadow: 0 1px 3px rgba(0,0,0,.25); display: grid; place-items: center; }
  .hl-pin svg { width: 10px; height: 10px; color: #fff; }
  .hl-pin.c-yellow { background: #e0b000; } .hl-pin.c-green { background: #16a34a; } .hl-pin.c-blue { background: #2563eb; } .hl-pin.c-pink { background: #db2777; }
  .epub-chapter .hl-pin { position: relative; display: inline-grid; vertical-align: middle; margin: 0 2px; top: -1px; }
  .sel-bar { position: fixed; z-index: 45; display: flex; align-items: center; gap: 2px; padding: 4px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-pop); }
  .sel-bar button:not(.dot) { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  .sel-bar button:not(.dot):hover { background: var(--surface-2); }
  .sel-bar button svg { width: 15px; height: 15px; color: var(--accent-text); }
  .sel-bar .sep { width: 1px; height: 20px; margin: 0 4px; background: var(--border); }
  .dot { width: 20px; height: 20px; margin: 0 3px; padding: 0; border: 2px solid var(--surface); border-radius: 50%; cursor: pointer; box-shadow: 0 0 0 1px var(--border); }
  .dot.on { box-shadow: 0 0 0 2px var(--accent); }
  .dot.c-yellow { background: #facc15; } .dot.c-green { background: #4ade80; } .dot.c-blue { background: #60a5fa; } .dot.c-pink { background: #f472b6; }
  .hl-pop { position: fixed; z-index: 46; width: 320px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-pop); }
  .hl-pop .sentence { margin: 0 0 10px; max-height: 96px; overflow: auto; font-size: 13px; }
  .hl-colors { display: flex; margin-bottom: 10px; }
  .hl-pop textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 13.5px; resize: vertical; }
  .hl-pop textarea:focus { outline: none; border-color: var(--accent); }
  .hl-pop .row { display: flex; gap: 8px; margin-top: 10px; }
  .note-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .note-item { position: relative; padding: 10px 12px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); cursor: pointer; }
  .note-item:hover { border-color: var(--accent); }
  .note-item .q { padding-inline-start: 10px; border-inline-start: 3px solid; font-size: 13px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .note-item .q.c-yellow { border-color: #facc15; } .note-item .q.c-green { border-color: #4ade80; } .note-item .q.c-blue { border-color: #60a5fa; } .note-item .q.c-pink { border-color: #f472b6; }
  .note-item .n { margin-top: 8px; font-size: 13.5px; white-space: pre-wrap; }
  .note-item .m { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
  .page-error { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 32px; text-align: center; color: var(--muted); }
  .page-error > svg { width: 28px; height: 28px; color: var(--danger); }
  .page-error p { margin: 0; color: var(--text); font-weight: 600; }
  .page-error code { max-width: 90%; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 12px; overflow-wrap: anywhere; }
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; z-index: 2; }
  .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: pointer; transform-origin: 0% 0%; }
  .textLayer ::selection { background: rgba(47, 111, 94, .3); }

  /* ---------- EPUB chapters: flowing text in the reader's own colours ---------- */
  .page.epub-chapter {
    max-width: 760px; padding: 56px 64px; color: var(--text); text-align: start;
    font: calc(19px * var(--epub-zoom, 1)) / 1.75 Georgia, "Times New Roman", "Geeza Pro", "Noto Naskh Arabic", serif;
    overflow-wrap: break-word;
  }
  .epub-chapter img { display: block; max-width: 100%; height: auto; margin: 1em auto; }
  .epub-chapter p { margin: 0 0 .8em; }
  .epub-chapter h1, .epub-chapter h2, .epub-chapter h3 { line-height: 1.3; }
  .epub-chapter a[data-href], .epub-chapter a[data-url] { color: var(--accent-text); cursor: pointer; }
  .epub-chapter table { border-collapse: collapse; max-width: 100%; }
  .epub-chapter td, .epub-chapter th { border: 1px solid var(--border); padding: 4px 8px; }
  .epub-chapter pre { white-space: pre-wrap; }
  .epub-chapter .hit { background: rgba(242, 201, 76, .35); border-radius: 3px; }
  .epub-chapter mark.known { background: none; color: inherit; border-bottom: 2px solid var(--accent); }
  .epub-chapter ::selection { background: rgba(47, 111, 94, .3); }

  /* ---------- Side panel ---------- */
  .panel { width: 380px; flex: none; background: var(--surface); border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .seg { display: flex; gap: 2px; margin: 12px 12px 4px; padding: 3px; border-radius: 10px; background: var(--surface-2); }
  .seg button {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; font-weight: 500;
  }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-text); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
  .badge:empty { display: none; }
  .pane { flex: 1; overflow: auto; padding: 16px 20px 24px; }

  .state { text-align: center; color: var(--muted); padding: 28px 8px; }
  .state .i { width: 28px; height: 28px; color: var(--muted); opacity: .8; margin-bottom: 10px; }
  .state h3 { margin: 0 0 6px; color: var(--text); font-size: 15px; }
  .state p { margin: 0 auto 14px; max-width: 280px; }
  .state.error .i { color: var(--danger); opacity: 1; }
  .state.error p { color: var(--danger); }

  .result-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 2px; }
  .word { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; text-align: start; }
  .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .pos { padding: 1px 8px; border-radius: 6px; background: var(--surface-2); }
  .tr { margin: 6px 0 6px; font-size: 22px; font-weight: 700; color: var(--accent-text); }
  .explain { margin: 0 0 4px; font-size: 15px; line-height: 1.65; }
  .result section { margin-top: 20px; }
  .label { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .result section p { margin: 0; }
  .sentence {
    margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-2);
    border-inline-start: 3px solid var(--accent); font-size: 14px; line-height: 1.6; text-align: start;
  }
  .sentence mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ask-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .ask-quick .chip { cursor: pointer; color: var(--text); font: inherit; font-size: 13px; }
  .ask-quick .chip:hover { border-color: var(--accent); color: var(--accent-text); }
  .ask-form { margin-top: 12px; display: grid; gap: 8px; }
  .ask-form textarea {
    width: 100%; resize: vertical; min-height: 56px; padding: 9px 11px; font: inherit; font-size: 14px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text);
  }
  .ask-form textarea:focus { outline: none; border-color: var(--accent); }
  .btn.ask-send { height: auto; padding: 8px 14px; flex-direction: column; gap: 2px; }
  .ask-label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .ask-cost { font-size: 11.5px; font-weight: 400; opacity: .85; }
  .passage { max-height: 180px; overflow: auto; font-size: 13.5px; }
  .ask-turn { margin-top: 22px; }
  .ask-turn .explain + .explain { margin-top: 10px; }
  .chip { padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; }

  .skeleton { display: grid; gap: 10px; margin: 14px 0 6px; }
  .skeleton span { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  .skeleton span:first-child { height: 22px; width: 45%; }
  .skeleton span.short { width: 70%; }
  @keyframes shimmer { to { background-position: -200% 0; } }

const systemLang = ['ar', 'tr', 'en'].find(l => (navigator.language || '').toLowerCase().startsWith(l)) || 'en';
let settings = Object.assign({ provider: 'gemini', apiKey: '', model: '', baseUrl: 'http://localhost:11434/v1', lang: systemLang, theme: 'system' }, store.get('settings', {}));
if (!LANGS[settings.lang]) settings.lang = 'ar'; // earlier versions stored free text here, always Arabic
// lang: what words are translated into. uiLang: the app's own language. Before they were split, one drove both.
if (!LANGS[settings.uiLang]) settings.uiLang = store.get('settings', null) ? settings.lang : systemLang;
const t = key => STRINGS[settings.uiLang][key] ?? STRINGS.en[key];
// Earlier versions saved these as the model; they have tiny free quotas, so go back to automatic.
if (/^gemini-(2\.5|3\.8)-flash$/.test(settings.model)) { settings.model = ''; store.set('settings', settings); }
let vocab = store.get('vocab', []);
let pdfDoc = null, scale = 1, bookName = ''; // pdfDoc: the open book (a PDF.js document, or an EPUB that looks like one)
let bookType = 'pdf';
let fitScale = 1, zoom = 1, pageSize = null; // scale = fitScale × zoom; pageSize is page 1 at scale 1
let bookLang = null; // 'ar' | 'en' | 'tr' | 'other', or null when unknown
let lastLookup = null;
let bookKey = ''; // name + page count: identifies a book for its saved reading position
const cache = new Map(store.get('cache', [])); // lang|word|sentence → answer, kept between sessions
let lookupId = 0;

// ---------- PDF ----------
const viewer = $('#viewer');
const observer = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) renderPage(e.target);
}, { root: viewer, rootMargin: '600px 0px' });

const isZip = data => data[0] === 0x50 && data[1] === 0x4b; // EPUB files are zip archives

async function openBook(data, name) {
  try {
    return await (isZip(data) ? openEpub(data, name) : openPdf(data, name));
  } catch (err) {
    console.error(err);
    showToast(t('openFailed') + (err?.message || err), { label: t('fbBug'), run: () => reportProblem(`${t('openFailed')}${err?.message || err}`) });
  }
}

function canvasIsBlank(canvas) {
  const probe = document.createElement('canvas');
  probe.width = probe.height = 48;
  const ctx = probe.getContext('2d');
  ctx.drawImage(canvas, 0, 0, 48, 48);
  const px = ctx.getImageData(0, 0, 48, 48).data;
  for (let i = 0; i < px.length; i += 4) if (px[i] < 235 || px[i + 1] < 235 || px[i + 2] < 235) return false;
  return true;
}

function showPageError(div, err) {
  console.error(err);
  const box = document.createElement('div');
  box.className = 'page-error';
  box.innerHTML = `${icon('alert')}<p>${t('pageError')}</p><code dir="ltr">${esc(String(err?.message || err))}</code><button class="btn small">${icon('alert')}${t('fbBug')}</button>`;
  box.querySelector('button').onclick = () => reportProblem(`${t('pageError')}\n${err?.message || err}`);
  div.appendChild(box);
}

async function openPdf(data, name) {
  const doc = await pdfjsLib.getDocument({ data, cMapUrl: 'vendor/cmaps/', cMapPacked: true, standardFontDataUrl: 'vendor/standard_fonts/' }).promise;
  pdfDoc = doc;
  bookType = 'pdf';
  viewer.style.removeProperty('--epub-zoom');
  bookName = name;
  $('#bookTitle').textContent = name.replace(/\.pdf$/i, '');
  $('#bookTitle').title = name;
  viewer.replaceChildren();
  const base = (await doc.getPage(1)).getViewport({ scale: 1 });
  pageSize = { w: base.width, h: base.height };
  fitScale = fitWidthScale();
  zoom = 1;
  scale = fitScale;
  for (let i = 1; i <= doc.numPages; i++) {
    const div = document.createElement('div');
    div.className = 'page';
    div.dataset.page = i;
    div.style.width = pageSize.w * scale + 'px';
    div.style.height = pageSize.h * scale + 'px';
    viewer.appendChild(div);
    observer.observe(div);
  }
  await finishOpening(doc, name);
}

// Everything that's the same for PDFs and EPUBs once the pages are in place.
async function finishOpening(doc, name) {
  viewer.scrollTop = 0;
  bookKey = name + '|' + doc.numPages;
  rememberBook(doc);
  ocrCache.clear();
  pageTexts.clear();
  closeSearch();
  loadToc(doc);
  queueBookShare();
  $('#notesCount').textContent = bookHighlights().length || '';
  if (bookType === 'epub') setTimeout(drawHighlights);
  restorePosition();
  backTo = null;
  $('#backBtn').hidden = true;
  $('#tools').hidden = false;
  $('#pageTotal').textContent = doc.numPages;
  updatePageLabel();
  updateZoomLabel();
  bookLang = null;
  showBookLang();
  const lang = await detectBookLanguage(doc);
  if (pdfDoc === doc) { bookLang = lang; showBookLang(); }
}

const fitWidthScale = () => Math.max(Math.min((viewer.clientWidth - 48) / pageSize.w, 1.8), 0.4);

async function renderPage(div) {
  if (div.dataset.rendered) return;
  div.dataset.rendered = '1';
  const s = scale, doc = pdfDoc;
  const page = await doc.getPage(+div.dataset.page);
  if (s !== scale || doc !== pdfDoc) return; // zoomed or switched book meanwhile
  const vp = page.getViewport({ scale: s });
  const dpr = window.devicePixelRatio || 1;
  div.dataset.w = vp.width / s;
  div.dataset.h = vp.height / s;
  div.style.width = vp.width + 'px';
  div.style.height = vp.height + 'px';

  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(vp.width * dpr);
  canvas.height = Math.floor(vp.height * dpr);
  canvas.style.width = vp.width + 'px';
  canvas.style.height = vp.height + 'px';
  div.appendChild(canvas);
  div.classList.add('loading'); // heavy pages (scans) can take a while on older computers
  try {
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
  } catch (err) {
    // Say so on the page instead of leaving it blank, with the reason, so it can be reported.
    div.classList.remove('loading');
    showPageError(div, err);
    return;
  }
  div.classList.remove('loading');
  if (s !== scale || !canvas.isConnected) return;
  if (isDark()) await darkenPage(canvas, page, vp, dpr);

  const layer = document.createElement('div');
  layer.className = 'textLayer';
  layer.style.setProperty('--scale-factor', s);
  div.appendChild(layer);
  const textContent = await page.getTextContent();
  await pdfjsLib.renderTextLayer({ textContentSource: textContent, container: layer, viewport: vp, textDivs: [] }).promise;
  if (s !== scale || !layer.isConnected) return;
  markKnownWords(layer);
  highlightSearch(div);
  drawPageHighlights(div);
  // Scanned pages are pictures of text: almost no text, and an image covering most of the page.
  const chars = textContent.items.reduce((n, it) => n + it.str.replace(/\s/g, '').length, 0);
  // A page with plenty of text that drew nothing at all means the drawing failed quietly.
  if (chars > 80 && !isDark() && canvasIsBlank(canvas)) showPageError(div, new Error(`blank page with ${chars} characters of text · ${navigator.userAgent}`));
  if (chars < 20 && (await imageCoverage(page)) > 0.5) queueOcr(div, canvas, layer);

  // Links inside the book (table of contents, footnotes), in page pixels.
  div._links = (await page.getAnnotations())
    .filter(a => a.subtype === 'Link' && a.dest)
    .map(a => {
      const [x1, y1, x2, y2] = vp.convertToViewportRectangle(a.rect);
      return { x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1), dest: a.dest };
    });
}

function linkAt(pageDiv, clientX, clientY) {
  const r = pageDiv.getBoundingClientRect(), x = clientX - r.left, y = clientY - r.top;
  return (pageDiv._links || []).find(l => x >= l.x && x <= l.x + l.w && y >= l.y && y <= l.y + l.h);
}

let backTo = null; // where to return after following a link
async function goToDest(dest, remember = true) {
  if (dest?.epub) { epubGoTo(dest.epub, remember); return; }
  const explicit = typeof dest === 'string' ? await pdfDoc.getDestination(dest) : dest;
  if (!Array.isArray(explicit)) return;
  const index = typeof explicit[0] === 'object' ? await pdfDoc.getPageIndex(explicit[0]) : explicit[0];
  const div = viewer.querySelector(`.page[data-page="${index + 1}"]`);
  if (!div) return;
  if (remember) {
    backTo = viewer.scrollTop;
    $('#backBtn').hidden = false;
  }
  const top = explicit[1]?.name === 'XYZ' ? explicit[3] : null; // PDF units, measured from the page bottom
  const h = +div.dataset.h || pageSize.h;
  viewer.scrollTop = div.offsetTop + (top != null ? Math.max(0, (h - top) * scale - 16) : -24);
}

// ---------- Dark pages ----------
// Dark mode inverts the page so text is light on dark, then paints the pictures back in their real colours.
async function darkenPage(canvas, page, vp, dpr) {
  const boxes = await imageBoxes(page, vp, dpr);
  const original = document.createElement('canvas');
  original.width = canvas.width;
  original.height = canvas.height;
  original.getContext('2d').drawImage(canvas, 0, 0);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // Done by hand: canvas filters don't work in every web engine (Safari's, which the Mac app uses).
  // Flipping lightness but not hue: white → near-black, black → near-white, blue links stay blue.
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const shift = 255 - Math.max(r, g, b) - Math.min(r, g, b);
    d[i] = 27 + (r + shift) * 0.79;
    d[i + 1] = 27 + (g + shift) * 0.79;
    d[i + 2] = 27 + (b + shift) * 0.79;
  }
  ctx.putImageData(img, 0, 0);
  for (const [x, y, w, h] of boxes) ctx.drawImage(original, x, y, w, h, x, y, w, h);
}

// Where (in canvas pixels) the page paints pictures. Walks the drawing commands, tracking the transform.
async function imageBoxes(page, vp, dpr) {
  const { OPS, Util } = pdfjsLib;
  const IMAGE_OPS = [OPS.paintImageXObject, OPS.paintInlineImageXObject, OPS.paintImageXObjectRepeat];
  const ops = await page.getOperatorList();
  let ctm = Util.transform([dpr, 0, 0, dpr, 0, 0], vp.transform);
  const stack = [], boxes = [];
  ops.fnArray.forEach((fn, i) => {
    const args = ops.argsArray[i];
    if (fn === OPS.save) stack.push(ctm);
    else if (fn === OPS.restore) ctm = stack.pop() || ctm;
    else if (fn === OPS.transform) ctm = Util.transform(ctm, args);
    else if (fn === OPS.paintFormXObjectBegin) { stack.push(ctm); if (args[0]) ctm = Util.transform(ctm, args[0]); }
    else if (fn === OPS.paintFormXObjectEnd) ctm = stack.pop() || ctm;
    else if (IMAGE_OPS.includes(fn)) {
      // Images are drawn into the unit square of the current transform.
      const pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(p => Util.applyTransform(p, ctm));
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const x = Math.floor(Math.min(...xs)), y = Math.floor(Math.min(...ys));
      boxes.push([x, y, Math.ceil(Math.max(...xs)) - x, Math.ceil(Math.max(...ys)) - y]);
    }
  });
  return boxes;
}

// ---------- Page number and zoom ----------
function currentPage() {
  const line = viewer.scrollTop + viewer.clientHeight / 3;
  let n = 1;
  for (const p of viewer.children) {
    if (p.offsetTop > line) break;
    n = +p.dataset.page || n;
  }
  return n;
}

function updatePageLabel() {
  const input = $('#pageInput');
  if (pdfDoc && document.activeElement !== input) input.value = currentPage();
  markTocCurrent();
  queueShare();
}

function goToPage(n) {
  const page = viewer.querySelector(`.page[data-page="${Math.min(Math.max(1, n | 0), pdfDoc.numPages)}"]`);
  if (page) viewer.scrollTop = page.offsetTop - 24;
}

let scrollQueued = false;
viewer.addEventListener('scroll', () => {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => { scrollQueued = false; updatePageLabel(); savePosition(); });
}, { passive: true });

$('#pageInput').addEventListener('change', e => { goToPage(+e.target.value); e.target.blur(); });
$('#pageInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#pageInput').addEventListener('blur', updatePageLabel);

$('#backBtn').onclick = () => {
  if (backTo != null) viewer.scrollTop = backTo;
  backTo = null;
  $('#backBtn').hidden = true;
};

const ZOOM_STEPS = [0.5, 0.67, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
const zoomStep = dir => setZoom(dir > 0 ? ZOOM_STEPS.find(z => z > zoom + 0.001) ?? zoom : [...ZOOM_STEPS].reverse().find(z => z < zoom - 0.001) ?? zoom);

function setZoom(z, keepFit = false) {
  if (!pdfDoc) return;
  if (bookType === 'epub') { zoomEpub(z); return; }
  const page = currentPage();
  if (!keepFit) zoom = z;
  scale = fitScale * zoom;
  for (const div of viewer.children) {
    div.replaceChildren();
    delete div.dataset.rendered;
    div.style.width = (+div.dataset.w || pageSize.w) * scale + 'px';
    div.style.height = (+div.dataset.h || pageSize.h) * scale + 'px';
    observer.unobserve(div);
    observer.observe(div); // re-observing re-renders the pages in view
  }
  goToPage(page);
  updateZoomLabel();
}

const updateZoomLabel = () => { $('#zoomLabel').textContent = Math.round(zoom * 100) + '%'; };
$('#zoomIn').onclick = () => zoomStep(1);
$('#zoomOut').onclick = () => zoomStep(-1);
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey)) return;
  if (e.key === '=' || e.key === '+') { e.preventDefault(); zoomStep(1); }
  else if (e.key === '-') { e.preventDefault(); zoomStep(-1); }
  else if (e.key === '0') { e.preventDefault(); setZoom(1); }
  else if (e.key.toLowerCase() === 'f' && pdfDoc) { e.preventDefault(); openSearch(); }
});

// Keep "100%" meaning "fits the width" when the window is resized. While it is being resized, the pages
// already drawn are stretched (CSS zoom, no redrawing) so they follow the window at once; once it stops
// they are redrawn sharp at the new size.
let resizeTimer, resizeFrame = 0;
const keepScrollPlace = change => {
  const at = viewer.scrollTop / Math.max(viewer.scrollHeight, 1);
  change();
  viewer.scrollTop = at * viewer.scrollHeight;
};
// One CSS variable for every page, at most once a frame: touching each page of a long book on every resize
// event kept the main thread too busy for the window to redraw while it was being dragged.
window.addEventListener('resize', () => {
  if (!pdfDoc || bookType === 'epub') return; // EPUB text reflows by itself
  if (!resizeFrame) resizeFrame = requestAnimationFrame(() => {
    resizeFrame = 0;
    const ratio = fitWidthScale() / fitScale;
    keepScrollPlace(() => viewer.style.setProperty('--live-zoom', Math.abs(ratio - 1) > 0.01 ? ratio : 1));
  });
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const fit = fitWidthScale();
    keepScrollPlace(() => viewer.style.removeProperty('--live-zoom'));
    if (Math.abs(fit - fitScale) > 0.01) { fitScale = fit; setZoom(zoom, true); }
  }, 200);
});

// ---------- Book language ----------
const STOPWORDS = {
  en: ['the', 'and', 'of', 'to', 'in', 'is', 'that', 'was', 'he', 'it', 'with', 'for', 'as', 'his', 'on', 'you', 'her', 'she', 'they', 'but', 'had', 'at', 'not'],
  tr: ['ve', 'bir', 'bu', 'da', 'de', 'için', 'ile', 'ne', 'çok', 'gibi', 'ama', 'daha', 'o', 'ben', 'sen', 'değil', 'olarak', 'kadar', 'şey', 'her'],
};

function detectLanguage(text) {
  const arabic = (text.match(/[؀-ۿ]/g) || []).length;
  const latin = (text.match(/\p{Script=Latin}/gu) || []).length;
  if (arabic + latin < 200) return null; // scanned pages, or too little text to tell
  if (arabic > latin) return 'ar';
  const words = text.toLocaleLowerCase('tr').match(/\p{L}+/gu) || [];
  const share = list => words.filter(w => list.includes(w)).length / words.length;
  const en = share(STOPWORDS.en), tr = share(STOPWORDS.tr);
  const turkishLetters = (text.match(/[ığşİĞŞ]/g) || []).length / latin; // letters English and most others never use
  if (en >= 0.08 && en > tr) return 'en';
  if (tr >= 0.03 && turkishLetters > 0.003) return 'tr';
  return 'other';
}

// Reads the first pages' text; covers, title pages and contents rarely have enough on their own.
async function detectBookLanguage(doc) {
  let text = '';
  for (let i = 1; i <= Math.min(doc.numPages, 15) && text.length < 6000; i++) {
    const content = await (await doc.getPage(i)).getTextContent();
    text += content.items.map(it => it.str).join(' ') + ' ';
  }
  return detectLanguage(text);
}

const showBookLang = () => { $('#bookLang').textContent = bookLang ? t('langs')[bookLang] : t('auto'); };

// ---------- Word picking ----------
const isWordChar = c => /[\p{L}\p{M}\p{N}'’-]/u.test(c);

function caretAt(x, y) {
  if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(x, y);
    return p && { node: p.offsetNode, offset: p.offset };
  }
  if (document.caretRangeFromPoint) {
    const r = document.caretRangeFromPoint(x, y);
    return r && { node: r.startContainer, offset: r.startOffset };
  }
}

// Joins the page's text spans and cuts out the sentence around the clicked spot.
// ---------- Reading order ----------
// PDF text comes piece by piece in the order it sits on the page, left to right. Arabic (and Hebrew) lines read
// right to left, with English and numbers inside them still left to right: put each line's pieces in reading order.
const RTL = '\\u0590-\\u08FF\\uFB1D-\\uFDFF\\uFE70-\\uFEFF', LTR = 'A-Za-z0-9\\u00C0-\\u024F';
const isRtl = t => new RegExp(`[${RTL}]`).test(t), isLtr = t => new RegExp(`[${LTR}]`).test(t);
const countOf = (texts, chars) => texts.reduce((n, t) => n + (t.match(new RegExp(`[${chars}]`, 'g')) || []).length, 0);
function readingOrder(texts) {
  const types = texts.map(t => isRtl(t) ? 'R' : isLtr(t) ? 'L' : 'N');
  const order = texts.map((_, i) => i);
  if (!types.includes('R')) return order;
  // Turn every run of `kind` pieces (and the spaces between them) around.
  const flipRuns = (list, kind) => {
    for (let i = 0; i < list.length; i++) {
      if (types[list[i]] !== kind) continue;
      let end = i, j = i;
      for (; j < list.length && types[list[j]] !== (kind === 'R' ? 'L' : 'R'); j++) if (types[list[j]] === kind) end = j;
      // English at the end of a right-to-left line keeps its trailing punctuation with it ("Hello world!";).
      if (kind === 'L' && j === list.length) end = list.length - 1;
      list.splice(i, end - i + 1, ...list.slice(i, end + 1).reverse());
      i = end;
    }
    return list;
  };
  return countOf(texts, RTL) >= countOf(texts, LTR) ? flipRuns(order.reverse(), 'L') : flipRuns(order, 'R');
}

// A text layer as lines: each with its pieces in reading order, the line's text, and where each piece starts in it.
function textLines(layer) {
  const lines = [];
  let raw = [];
  const finish = () => {
    if (!raw.length) return;
    const spans = readingOrder(raw.map(el => el.textContent)).map(i => raw[i]);
    const starts = new Map();
    let text = '';
    for (const el of spans) { starts.set(el, text.length); text += el.textContent; }
    lines.push({ spans, starts, text });
    raw = [];
  };
  for (const el of layer.children) {
    if (el.tagName === 'BR') finish();
    else if (el.tagName === 'SPAN') raw.push(el);
  }
  finish();
  return lines;
}

// The same for PDF.js text items (for the text shared with AI apps).
function itemsToText(items) {
  const out = [];
  let line = [];
  const finish = () => { if (line.length) out.push(readingOrder(line).map(i => line[i]).join('')); line = []; };
  for (const it of items) { line.push(it.str); if (it.hasEOL) finish(); }
  finish();
  return out.join('\n');
}

// Where a point in a piece falls in its line (in reading order): the line and the position.
function lineAt(span, offset) {
  const line = textLines(span.parentElement).find(l => l.starts.has(span));
  return line ? { line, at: line.starts.get(span) + offset } : null;
}

// The whole word around a point, read across pieces (some PDFs give every Arabic letter its own piece).
function wordAt(span, offset) {
  const hit = lineAt(span, offset);
  if (!hit) return '';
  const text = hit.line.text;
  let s = hit.at, e = hit.at;
  while (s > 0 && isWordChar(text[s - 1])) s--;
  while (e < text.length && isWordChar(text[e])) e++;
  return text.slice(s, e).replace(/^['’-]+|['’-]+$/g, '');
}

// Selected text in reading order. Only needed when it has right-to-left text; otherwise the browser's is right.
function selectedText(sel) {
  const plain = sel.toString().replace(/\s+/g, ' ').trim();
  if (!isRtl(plain) || !sel.rangeCount) return plain;
  const range = sel.getRangeAt(0), parts = [];
  for (const layer of viewer.querySelectorAll('.textLayer')) {
    if (!range.intersectsNode(layer)) continue;
    for (const line of textLines(layer)) {
      const hit = line.spans.filter(sp => range.intersectsNode(sp));
      if (hit.length) parts.push(hit.map(sp => sp.textContent).join(''));
    }
  }
  return parts.join(' ').replace(/\s+/g, ' ').trim() || plain;
}

function sentenceAround(span, offset) {
  const lines = textLines(span.parentElement);
  // "Short" is relative to this page: in large print every line is short, and only headings are much shorter.
  const lengths = lines.map(l => l.text.length).filter(Boolean).sort((a, b) => a - b);
  const typical = lengths[Math.floor(lengths.length / 2)] || 60;
  const short = Math.min(45, typical * 0.6);
  let text = '', at = 0;
  lines.forEach((l, i) => {
    if (i) {
      const prev = lines[i - 1].text.trim();
      // "contin-" at a line end + "ue" on the next line → "continue"
      if (/\p{L}-$/u.test(text)) text = text.slice(0, -1);
      // A short line that doesn't carry on (a heading like "Down the Rabbit-Hole") ends a sentence.
      else if (prev.length < short && !/[,;:\-–—،]$/.test(prev)) text += '\n';
      else text += ' ';
    }
    if (l.starts.has(span)) at = text.length + l.starts.get(span) + offset;
    text += l.text;
  });
  return cutSentence(text, at);
}

// The sentence around position `at`: back and forward to the nearest sentence end, at most 200 characters each way.
function cutSentence(text, at) {
  let start = at, end = at;
  while (start > 0 && !/[.!?؟\n]/.test(text[start - 1]) && at - start < 200) start--;
  while (end < text.length && !/[.!?؟\n]/.test(text[end]) && end - at < 200) end++;
  // A very long sentence is cut at the limit: make that cut fall between words, not inside one.
  if (start > 0 && !/[.!?؟\n]/.test(text[start - 1])) { const sp = text.indexOf(' ', start); if (sp > 0 && sp < at) start = sp + 1; }
  if (end < text.length && !/[.!?؟\n]/.test(text[end])) { const sp = text.lastIndexOf(' ', end); if (sp > at) end = sp - 1; }
  return text.slice(start, end + 1).replace(/\s+/g, ' ').trim();
}

// Characters from the start of a text span up to a point inside it (spans can hold <mark> children).
function offsetIn(span, node, offset) {
  const r = document.createRange();
  r.setStart(span, 0);
  r.setEnd(node, offset);
  return r.toString().length;
}

let clickPage = null; // the page of the last word clicked, saved with it
viewer.addEventListener('click', e => {
  clickPage = +e.target.closest('.page')?.dataset.page || null;
  const sel = window.getSelection();
  const chapter = e.target.closest('.epub-chapter');
  const selected = chapter ? sel.toString().replace(/\s+/g, ' ').trim() : selectedText(sel);
  if (chapter) { clickEpub(e, sel, selected); return; }
  if (selected) {
    const node = sel.anchorNode;
    const span = (node?.nodeType === 3 ? node.parentElement : node)?.closest('.textLayer > span');
    if (span && askMode) openAsk(selected);
    return; // the selection bar offers meaning, ask, highlight and note
  }
  // A plain click on a link follows it; selecting the link's text still translates it (above).
  const pageDiv = e.target.closest('.page');
  const link = pageDiv && linkAt(pageDiv, e.clientX, e.clientY);
  if (link) { goToDest(link.dest); return; }
  const span = e.target.closest('.textLayer > span');
  if (!span) return;
  const pos = caretAt(e.clientX, e.clientY);
  if (!pos || pos.node.nodeType !== 3 || !span.contains(pos.node)) return;
  const at = offsetIn(span, pos.node, pos.offset);
  const word = wordAt(span, at);
  if (!word || !/\p{L}/u.test(word)) return;
  const sentence = sentenceAround(span, at);
  if (askMode) openAsk(sentence); else lookup(word, sentence);
});

// ---------- AI ----------
// Reading a book in the same language you asked for: explain in simpler words instead of translating.
const sameLanguage = () => bookLang === settings.lang;

function buildPrompt(word, sentence) {
  const lang = LANGS[settings.lang].english;
  const same = sameLanguage();
  return `You help someone understand a word while they read a book.
Word or phrase: "${word}"
The sentence it appears in: "${sentence}"
Language of the book: ${LANGS[bookLang]?.english || 'detect it from the sentence'}
Answer in: ${lang}
${same ? `The reader reads ${lang} but doesn't know this word, so explain it in simpler ${lang} rather than translating it.\n` : ''}
Give the meaning of the word AS USED IN THIS SENTENCE, not just its most common meaning.
Reply with JSON only, no markdown fences, in exactly this shape:
{"translation": "${same ? `a simpler ${lang} word or short phrase that means the same here` : `short translation of the word as used in this sentence, in ${lang}`}",
 "explanation": "one or two sentences in ${lang} explaining what it means here and why",
 "base_form": "dictionary form of the word in its original language",
 "part_of_speech": "part of speech, in ${lang}",
 "other_meanings": ["up to 3 other common meanings, in ${lang}"],
 "sentence_translation": "${same ? `the sentence rephrased in simpler ${lang}` : `translation of the whole sentence into ${lang}`}"}`;
}

const BUSY = [429, 503, 529]; // rate limited, high demand, overloaded

// Turns "out of quota" and "out of credit" replies into a plain sentence saying what to do.
// The reader's provider by name, for messages: Gemini, Claude, or the server they set (Ollama and others).
function providerName() {
  if (settings.provider === 'gemini') return 'Gemini';
  if (settings.provider === 'anthropic') return 'Claude';
  try { const host = new URL(settings.baseUrl).hostname; return /^(localhost|127\.0\.0\.1)$/.test(host) ? t('yourProvider') : host; }
  catch { return t('yourProvider'); }
}

function quotaMessage(status, json) {
  const e = json?.error || {}, text = `${e.message || ''} ${e.status || ''} ${e.type || ''} ${e.code || ''}`;
  if (/credit balance|insufficient_quota|billing/i.test(text)) return t('noCredit')(providerName());
  if (status === 429 && /quota|RESOURCE_EXHAUSTED/i.test(text)) {
    return /PerDay|per day|daily/i.test(JSON.stringify(e.details || '') + text) ? t('quotaDay')(providerName()) : t('quotaMinute');
  }
  return null;
}

// In the app, requests go through Rust so AI servers needn't allow browser (CORS) calls.
async function requestJson(method, url, headers, body) {
  if (tauri) {
    const r = await tauri.core.invoke('ai_request', { method, url, headers, body: body ?? null });
    return { ok: r.status >= 200 && r.status < 300, status: r.status, json: r.body };
  }
  const res = await fetch(url, { method, headers: { 'content-type': 'application/json', ...headers }, body: body && JSON.stringify(body) });
  return { ok: res.ok, status: res.status, json: await res.json() };
}

// One short retry for busy servers; anything longer defeats the point of a quick lookup.
async function postJson(url, headers, body) {
  let r = await requestJson('POST', url, headers, body);
  if (BUSY.includes(r.status)) {
    await new Promise(res => setTimeout(res, 800));
    r = await requestJson('POST', url, headers, body);
  }
  if (BUSY.includes(r.status)) throw new Error(quotaMessage(r.status, r.json) || t('busy'));
  return r;
}

// ----- Gemini: when one model is busy or retired, move straight on to another -----
const GEMINI = 'https://generativelanguage.googleapis.com/v1beta/';
let geminiModels = null; // Flash models this key can use, newest first
let geminiWorking = store.get('geminiWorking', null); // the Flash-Lite model that answered last, tried first

async function listGeminiModels() {
  if (geminiModels) return geminiModels;
  const r = await requestJson('GET', GEMINI + 'models?pageSize=1000', { 'x-goog-api-key': settings.apiKey });
  const version = n => parseFloat(n.match(/gemini-([\d.]+)/)[1]);
  geminiModels = (r.json?.models || [])
    .filter(m => m.supportedGenerationMethods?.includes('generateContent') && /^models\/gemini-[\d.]+-flash(-lite)?$/.test(m.name))
    .map(m => m.name.slice(7))
    .sort((a, b) => b.endsWith('-lite') - a.endsWith('-lite') || version(b) - version(a));
  return geminiModels;
}

async function geminiCall(model, prompt, noThinking) {
  const generationConfig = { responseMimeType: 'application/json', temperature: 0.2 };
  // A word lookup needs no step-by-step reasoning, and skipping it saves seconds.
  if (noThinking) generationConfig.thinkingConfig = /gemini-2\./.test(model) ? { thinkingBudget: 0 } : { thinkingLevel: 'minimal' };
  return requestJson('POST', `${GEMINI}models/${encodeURIComponent(model)}:generateContent`,
    { 'x-goog-api-key': settings.apiKey }, { contents: [{ parts: [{ text: prompt }] }], generationConfig });
}

// People type names like "Gemini Flash Lite": turn that into an id, or match it to a model the key has.
async function resolveGeminiModel(name) {
  const id = name.trim().toLowerCase().replace(/^models\//, '').replace(/\s+/g, '-');
  if (/^gemini-\d[\w.-]*$/.test(id)) return id;
  const words = id.split('-').filter(w => w && w !== 'gemini');
  return (await listGeminiModels()).find(m => words.every(w => m.split('-').includes(w))) || null;
}

async function askGemini(prompt) {
  const chosen = settings.model && await resolveGeminiModel(settings.model);
  const queue = [chosen, geminiWorking].filter(Boolean);
  const tried = new Set();
  let listed = false, lastError = t('busy');
  while (tried.size < 5) {
    const model = queue.find(m => !tried.has(m));
    if (!model) {
      if (listed) break;
      listed = true;
      queue.push(...await listGeminiModels());
      continue;
    }
    tried.add(model);
    let r = await geminiCall(model, prompt, true);
    if (r.status === 400 && /thinking/i.test(r.json?.error?.message || '')) r = await geminiCall(model, prompt, false);
    if (r.ok) {
      // Only remember Flash-Lite: a stand-in Flash model would burn its much smaller daily quota.
      if (model.endsWith('-lite') && geminiWorking !== model) store.set('geminiWorking', geminiWorking = model);
      return (r.json.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    }
    const msg = r.json?.error?.message || String(r.status);
    const suggested = msg.match(/\buse\s+models\/(gemini-[\w.-]*\w)/i)?.[1];
    if (suggested) queue.unshift(suggested);
    // A wrong key is worth stopping for; a model we can't use just means trying the next one.
    else if (!BUSY.includes(r.status) && r.status !== 404 && !/model/i.test(msg)) throw new Error(msg);
    lastError = quotaMessage(r.status, r.json) || (BUSY.includes(r.status) ? t('busy') : msg);
  }
  throw new Error(lastError);
}

async function askAI(word, sentence) {
  return askModel(buildPrompt(word, sentence));
}

// Sends a prompt that asks for JSON to the chosen provider and returns the parsed reply.
async function askModel(prompt, maxTokens = 800) {
  const model = settings.model || DEFAULT_MODELS[settings.provider];
  let r, text;
  if (settings.provider === 'gemini') {
    text = await askGemini(prompt);
  } else if (settings.provider === 'anthropic') {
    r = await postJson('https://api.anthropic.com/v1/messages',
      { 'x-api-key': settings.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      { model, max_tokens: maxTokens, messages: [{ role: 'user', content: prompt }] });
    if (!r.ok) throw new Error(quotaMessage(r.status, r.json) || r.json?.error?.message || r.status);
    text = (r.json.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  } else {
    const headers = settings.apiKey ? { authorization: 'Bearer ' + settings.apiKey } : {};
    r = await postJson(settings.baseUrl.replace(/\/+$/, '') + '/chat/completions', headers,
      { model, temperature: 0.2, messages: [{ role: 'user', content: prompt }] });
    if (!r.ok) throw new Error(quotaMessage(r.status, r.json) || r.json?.error?.message || r.status);
    text = r.json.choices?.[0]?.message?.content || '';
  }
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error(t('badReply'));
  return JSON.parse(m[0]);
}

// ---------- Ask about a passage ----------
// Selecting more than a phrase offers a question about it. It costs more of the reader's own
// AI quota than a word does (the whole passage is sent), so the button says so.
const ASK_LIMIT = 4000; // characters of the passage sent with a question
let askPassage = '', askId = 0;

function buildAskPrompt(passage, question) {
  const lang = LANGS[settings.lang].english;
  return `You help someone understand a passage from the book they are reading.
Passage: \"\"\"${passage.slice(0, ASK_LIMIT)}\"\"\"
Language of the book: ${LANGS[bookLang]?.english || 'detect it from the passage'}
The reader asks: "${question}"
Answer in ${lang}, clearly and briefly (under 150 words unless they ask for more). Plain text, no markdown; separate paragraphs with a blank line.
Reply with JSON only, no markdown fences, in exactly this shape: {"answer": "..."}`;
}

const askForm = () => `
  <div class="ask-quick">${['askExplain', 'askSummary', 'askTranslate', 'askGrammar'].map(k => `<button class="chip" type="button" data-q="${k}">${t(k)}</button>`).join('')}</div>
  <form class="ask-form" id="askForm">
    <textarea id="askInput" rows="2" dir="auto" placeholder="${t('askPh')}"></textarea>
    <button class="btn primary ask-send" type="submit">
      <span class="ask-label">${icon('sparkle')}${t('askSend')}</span>
      <small class="ask-cost">${t('askCost')}</small>
    </button>
  </form>`;

// The Ask button: with text already selected it asks about it; otherwise the next selection
// (or a click on a sentence) does. Long selections open Ask on their own too.
let askMode = false, askHeld = '';
function setAskMode(on) {
  askMode = on;
  document.body.classList.toggle('ask-mode', on);
  if (on) showToast(t('askPick'), { label: t('cancel'), run: () => { setAskMode(false); $('#toast').hidden = true; } });
  else if ($('#toast').textContent.includes(t('askPick'))) $('#toast').hidden = true;
}
// Read the selection before the click on the button can clear it.
$('#askBtn').addEventListener('mousedown', () => { askHeld = window.getSelection().toString().replace(/\s+/g, ' ').trim(); });
$('#askBtn').onclick = () => {
  if (askHeld) { openAsk(askHeld); askHeld = ''; return; }
  setAskMode(!askMode);
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && askMode) setAskMode(false); });
document.addEventListener('click', e => { if (e.target.closest('[data-ask-sentence]') && lastLookup) openAsk(lastLookup.sentence); });

function openAsk(passage) {
  if (askMode) setAskMode(false);
  showTab('lookup');
  askPassage = passage;
  lastLookup = null;
  ++lookupId; // a word answer still on its way shouldn't replace this
  $('#lookup').innerHTML = `<article class="result ask">
    <header class="result-head"><h2 class="word">${t('askTitle')}</h2></header>
    <blockquote class="sentence passage" dir="auto">${esc(passage.length > 600 ? passage.slice(0, 600) + '…' : passage)}</blockquote>
    ${askForm()}
    <div id="askAnswers"></div>
  </article>`;
  wireAsk();
  $('#askInput').focus();
}

function wireAsk() {
  $('#askForm').onsubmit = e => { e.preventDefault(); ask($('#askInput').value.trim()); };
  $('#askInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#askForm').requestSubmit(); } });
  document.querySelectorAll('.ask-quick [data-q]').forEach(b => b.onclick = () => ask(t(b.dataset.q)));
}

async function ask(question) {
  if (!question) { $('#askInput').focus(); return; }
  if (!settings.apiKey && settings.provider !== 'openai') { openSetup(); return; }
  const id = ++askId, box = document.createElement('section');
  box.className = 'ask-turn';
  box.innerHTML = `<h3 class="label" dir="auto">${esc(question)}</h3><div class="skeleton"><span></span><span></span><span class="short"></span></div>`;
  $('#askAnswers').prepend(box);
  $('#askInput').value = '';
  try {
    const r = await askModel(buildAskPrompt(askPassage, question), 1500);
    countUse('asks');
    if (id !== askId && !box.isConnected) return;
    const d = `dir="${LANGS[settings.lang].dir}"`;
    box.querySelector('.skeleton').outerHTML = String(r.answer || '').split(/\n\s*\n/).map(p => `<p class="explain" ${d}>${esc(p.trim())}</p>`).join('');
  } catch (err) {
    box.querySelector('.skeleton').outerHTML = stateCard('alert', esc(err.message), '', 'error');
  }
}

// ---------- Lookup panel ----------
const canSpeak = 'speechSynthesis' in window;
const speakBtn = word => canSpeak ? `<button class="icon-btn speak" data-say="${esc(word)}" title="${t('speak')}" aria-label="${t('speak')}">${icon('volume')}</button>` : '';
const wordHead = (word, meta = '') => `<header class="result-head"><h2 class="word" dir="auto">${esc(word)}</h2>${speakBtn(word)}${meta}</header>`;
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const markWord = (sentence, word) => esc(sentence).replace(new RegExp(escRe(esc(word)), 'i'), m => `<mark>${m}</mark>`);
const section = (title, body) => `<section><h3 class="label">${title}</h3>${body}</section>`;
const stateCard = (iconName, text, action = '', cls = '') => `<div class="state ${cls}">${icon(iconName)}<p>${text}</p>${action}</div>`;

function sentenceBlock(word, sentence) {
  return section(t('sentence'), `<blockquote class="sentence" dir="auto">${markWord(sentence, word)}</blockquote>`);
}

async function lookup(word, sentence, fresh = false) {
  showTab('lookup');
  const pane = $('#lookup');
  if (!settings.apiKey && settings.provider !== 'openai') {
    lastLookup = { word, sentence };
    pane.innerHTML = wordHead(word) + stateCard('key', t('needKey'), `<button class="btn primary" id="keyBtn">${t('openSettings')}</button>`);
    $('#keyBtn').onclick = openSetup;
    openSetup();
    return;
  }
  const id = ++lookupId;
  lastLookup = { word, sentence };
  const key = settings.lang + '|' + word.toLowerCase() + '|' + sentence;
  // A word looked up before in another sentence: show what we know right away, spending nothing.
  const saved = !fresh && !cache.has(key) && !word.includes(' ') && vocab.find(v => v.word.toLowerCase() === word.toLowerCase() && wordTo(v) === settings.lang);
  if (saved) { renderSaved(word, sentence, saved); return; }
  if (!cache.has(key)) {
    pane.innerHTML = `<article class="result">${wordHead(word)}<div class="skeleton"><span></span><span></span><span class="short"></span></div>${sentenceBlock(word, sentence)}</article>`;
  }
  try {
    const fromCache = cache.has(key);
    const r = cache.get(key) || await askAI(word, sentence);
    if (!fromCache) countUse('words');
    cache.set(key, r);
    store.set('cache', [...cache].slice(-500));
    if (id !== lookupId) return;
    renderResult(word, sentence, r);
    saveWord(word, sentence, r);
  } catch (err) {
    if (id !== lookupId) return;
    pane.innerHTML = `<article class="result">${wordHead(word)}${stateCard('alert', esc(err.message), `<button class="btn" id="retryBtn">${t('retry')}</button>`, 'error')}${sentenceBlock(word, sentence)}</article>`;
    $('#retryBtn').onclick = () => lookup(word, sentence);
  }
}

function renderResult(word, sentence, r) {
  const d = `dir="${LANGS[settings.lang].dir}"`;
  const pos = r.part_of_speech ? `<span class="pos" ${d}>${esc(r.part_of_speech)}</span>` : '';
  const base = r.base_form && r.base_form.toLowerCase() !== word.toLowerCase() ? `<span dir="auto">${esc(r.base_form)}</span>` : '';
  const others = (r.other_meanings || []).map(m => `<span class="chip">${esc(m)}</span>`).join('');
  $('#lookup').innerHTML = `
    <article class="result">
      ${wordHead(word, pos || base ? `<div class="meta">${pos}${base}</div>` : '')}
      <p class="tr" ${d}>${esc(r.translation)}</p>
      <p class="explain" ${d}>${esc(r.explanation)}</p>
      ${sentenceBlock(word, sentence)}
      <button class="link-btn" type="button" data-ask-sentence>${icon('sparkle')}${t('askSentence')}</button>
      ${r.sentence_translation ? section(t(sameLanguage() ? 'sentenceSimple' : 'sentenceTr'), `<p ${d}>${esc(r.sentence_translation)}</p>`) : ''}
      ${others ? section(t('others'), `<div class="chips" ${d}>${others}</div>`) : ''}
    </article>`;
}

function renderSaved(word, sentence, v) {
  const d = `dir="${LANGS[settings.lang].dir}"`;
  $('#lookup').innerHTML = `
    <article class="result">
      ${wordHead(word)}
      <p class="tr" ${d}>${esc(v.translation)}</p>
      <p class="explain" ${d}>${esc(v.explanation || '')}</p>
      <p class="saved-note">${t('savedMeaning')}</p>
      <button class="btn" id="hereBtn">${t('explainHere')}</button>
      ${sentenceBlock(word, sentence)}
    </article>`;
  $('#hereBtn').onclick = () => lookup(word, sentence, true);
}

// ---------- Pronunciation ----------
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const lang = LANGS[bookLang] ? bookLang : /[\u0600-\u06FF]/.test(text) ? 'ar' : null;
  const voice = lang && speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith(lang));
  if (voice) u.voice = voice;
  if (lang) u.lang = voice?.lang || lang;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b) speak(b.dataset.say);
});

// ---------- Vocabulary ----------
// Which language a saved word is from and into. Words saved before this was recorded are guessed from their letters.
const guessLang = text => /[\u0600-\u06FF]/.test(text) ? 'ar' : /[çğıöşüİĞŞ]/.test(text) ? 'tr' : 'en';
const wordTo = v => v.lang || guessLang(v.translation || '');
const wordFrom = v => v.from || guessLang(v.word || '');

function saveWord(word, sentence, r) {
  vocab = vocab.filter(v => !(v.word.toLowerCase() === word.toLowerCase() && v.sentence === sentence && wordTo(v) === settings.lang));
  vocab.unshift({ word, translation: r.translation, explanation: r.explanation, sentence, book: bookName, bookKey, page: clickPage,
    lang: settings.lang, from: LANGS[bookLang] ? bookLang : guessLang(word), date: new Date().toISOString() });
  store.set('vocab', vocab);
  updateVocabCount();
  refreshKnown();
}

const updateVocabCount = () => { $('#vocabCount').textContent = vocab.length || ''; };

// My words, grouped by book (the open one first), each with its sentence, review progress, and an arrow
// back to the page it was looked up on.
let vocabFilter = '', vocabPair = 'all';
const pairOf = v => wordFrom(v) + '>' + wordTo(v);
function renderVocab() {
  updateVocabCount();
  const pane = $('#vocab');
  if (!vocab.length) { pane.innerHTML = stateCard('bookmark', t('vocabEmpty')); return; }
  const q = vocabFilter.toLowerCase();
  // One tab per language pair, "from English to Arabic", when there is more than one.
  const pairs = [...new Set(vocab.map(pairOf))];
  if (!pairs.includes(vocabPair)) vocabPair = 'all';
  const pairName = p => { const [a, b] = p.split('>'); return t('pairLabel')(LANG_NAMES[a] || a, LANG_NAMES[b] || b); };
  const pairTabs = pairs.length > 1 ? `<nav class="v-pairs">${['all', ...pairs].map(p => `<button type="button" data-pair="${p}" class="${p === vocabPair ? 'on' : ''}">${p === 'all' ? t('allWords') : pairName(p)}<span>${p === 'all' ? vocab.length : vocab.filter(v => pairOf(v) === p).length}</span></button>`).join('')}</nav>` : '';
  const shown = vocab.map((v, i) => [v, i]).filter(([v]) => (vocabPair === 'all' || pairOf(v) === vocabPair)
    && (!q || [v.word, v.translation, v.book].some(x => String(x || '').toLowerCase().includes(q))));
  const groups = new Map();
  for (const [v, i] of shown) {
    const key = v.book || '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push([v, i]);
  }
  const isOpen = name => name && name === bookName;
  const ordered = [...groups].sort(([a], [b]) => isOpen(b) - isOpen(a));
  const when = d => { const days = Math.round((Date.parse(d) - Date.now()) / 864e5); return Number.isFinite(days) ? new Intl.RelativeTimeFormat(settings.uiLang, { numeric: 'auto' }).format(days, 'day') : ''; };
  const item = (v, i) => `
    <li data-open="${i}">
      <div class="v-body">
        <div class="v-main"><span class="w" dir="auto">${esc(v.word)}</span><span class="v-tr" dir="auto">${esc(v.translation)}</span></div>
        ${v.sentence ? `<div class="v-sent" dir="auto">${markWord(v.sentence, v.word)}</div>` : ''}
        <div class="v-meta">
          ${v.page ? `<span>${t('pageN')(v.page)}</span>` : ''}
          <span>${when(v.date)}</span>
          <span class="v-dots" title="${t('progress')}">${[1, 2, 3, 4, 5].map(n => `<span class="${(v.box || 0) >= n ? 'on' : ''}"></span>`).join('')}</span>
        </div>
      </div>
      <div class="v-acts">
        ${v.page ? `<button class="icon-btn go" data-go="${i}" title="${t('goToWord')}" aria-label="${t('goToWord')}">${icon('arrow')}</button>` : ''}
        <button class="icon-btn x" data-x="${i}" title="${t('remove')}" aria-label="${t('remove')}">${icon('x')}</button>
      </div>
    </li>`;
  pane.innerHTML = `
    <div class="vocab-head"><span>${t('count')(vocab.length)}</span><span class="btns">
      <button class="btn small primary" id="reviewBtn">${icon('repeat')}${t('review')}<span class="badge">${dueWords().length || ''}</span></button>
      <button class="btn small" id="exportBtn" title="${t('export')}">${icon('download')}</button></span></div>
    ${pairTabs}
    ${vocab.length > 8 ? `<input class="vocab-filter" id="vocabFilter" type="search" dir="auto" placeholder="${t('vocabFilterPh')}" value="${esc(vocabFilter)}">` : ''}
    ${ordered.map(([book, list]) => `<section class="v-group">
      <h3 class="v-group-head${isOpen(book) ? ' open-book' : ''}" dir="auto">${icon('book')}<span>${esc(book.replace(/\.(pdf|epub)$/i, '') || t('noBookName'))}</span><span class="n">${list.length}</span></h3>
      <ul class="vocab-list">${list.map(([v, i]) => item(v, i)).join('')}</ul></section>`).join('') || stateCard('search', t('noMatches'))}`;
  $('#exportBtn').onclick = exportCsv;
  $('#reviewBtn').onclick = startReview;
  const filter = $('#vocabFilter');
  if (filter) filter.oninput = () => { vocabFilter = filter.value; const at = filter.selectionStart; renderVocab(); const f = $('#vocabFilter'); f.focus(); f.setSelectionRange(at, at); };
  pane.onclick = e => {
    const x = e.target.closest('[data-x]'), go = e.target.closest('[data-go]'), open = e.target.closest('[data-open]'), pair = e.target.closest('[data-pair]');
    if (pair) { vocabPair = pair.dataset.pair; renderVocab(); }
    else if (x) { vocab.splice(+x.dataset.x, 1); store.set('vocab', vocab); refreshKnown(); renderVocab(); }
    else if (go) goToWord(vocab[+go.dataset.go]);
    else if (open) { const v = vocab[+open.dataset.open]; lastLookup = { word: v.word, sentence: v.sentence }; showTab('lookup'); renderSaved(v.word, v.sentence, v); }
  };
}

// Back to the page a word was looked up on, with the word flashing there; or say which book to open.
function goToWord(v) {
  const sameBook = pdfDoc && (v.bookKey ? v.bookKey === bookKey : v.book === bookName);
  if (!sameBook) { showToast(t('openBookFirst')(String(v.book || '').replace(/\.(pdf|epub)$/i, ''))); return; }
  backTo = viewer.scrollTop;
  $('#backBtn').hidden = false;
  goToPage(v.page);
  setTimeout(() => {

    const marks = [...(page?.querySelectorAll('mark.known') || [])].filter(m => m.textContent.toLowerCase() === v.word.toLowerCase());
    marks.forEach(m => { m.classList.remove('blink'); void m.offsetWidth; m.classList.add('blink'); });
    marks[0]?.scrollIntoView({ block: 'center', behavior: 'smooth' });

}

function exportCsv() {
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = vocab.map(v => [v.word, `${v.translation} — ${v.explanation}`, v.sentence, v.book].map(q).join(','));
