<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glint</title>
<script src="vendor/pdf.min.js"></script>
<style>
  :root {
    --canvas: #e9e7e2;      /* behind the pages */
    --surface: #ffffff;     /* bars and panel */
    --surface-2: #f5f4f0;   /* inset areas */
    --text: #1c1b19;
    --muted: #77726a;
    --border: #e3dfd7;
    --accent: #2f6f5e;
    --accent-hover: #285f51;
    --accent-soft: #e5efeb;
    --accent-text: #24584a;
    --mark: rgba(242, 201, 76, .45);
    --danger: #b3412f;
    --shadow-page: 0 1px 2px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
    --shadow-pop: 0 10px 40px rgba(0,0,0,.18);
    --radius: 10px;
    --page-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #121211; --surface: #1c1c1a; --surface-2: #252523; --text: #ecebe7; --muted: #9b968d;
      --border: #2f2e2b; --accent: #5fb39b; --accent-hover: #74c2ab; --accent-soft: #1f322c; --accent-text: #8fd1bd;
      --mark: rgba(242, 201, 76, .3); --danger: #e58a76;
      --shadow-page: 0 1px 2px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.4);
      --page-bg: #1b1b1a;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #121211; --surface: #1c1c1a; --surface-2: #252523; --text: #ecebe7; --muted: #9b968d;
    --border: #2f2e2b; --accent: #5fb39b; --accent-hover: #74c2ab; --accent-soft: #1f322c; --accent-text: #8fd1bd;
    --mark: rgba(242, 201, 76, .3); --danger: #e58a76;
    --shadow-page: 0 1px 2px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.4);
    --page-bg: #1b1b1a;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--canvas); color: var(--text);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  .i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.lg { height: 44px; padding: 0 22px; font-size: 15px; font-weight: 600; border-radius: 10px; }
  .btn.small { height: 30px; padding: 0 10px; font-size: 13px; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px;
    border: 0; background: none; color: var(--muted); cursor: pointer; transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Top bar ---------- */
  .bar {
    display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px 0 16px;
    background: var(--surface); border-bottom: 1px solid var(--border); flex: none;
  }
  [dir="rtl"] .bar { padding: 0 16px 0 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .logo { width: 28px; height: 28px; display: block; }
  .book-title {
    flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding-inline-start: 12px; border-inline-start: 1px solid var(--border);
  }
  .tools { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); }
  .tools .icon-btn { width: 28px; height: 28px; }
  .tools .readout { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .tools .divider { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
  .page-jump { display: flex; align-items: center; gap: 4px; padding: 0 6px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .page-jump input {
    width: 44px; height: 26px; text-align: center; border: 1px solid transparent; border-radius: 6px;
    background: var(--surface); color: var(--text); font-variant-numeric: tabular-nums;
  }
  .page-jump input:focus { border-color: var(--accent); outline: none; }
  .langpair {
    display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px 0 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  }
  [dir="rtl"] .langpair { padding: 0 12px 0 4px; }
  .langpair .from { color: var(--muted); white-space: nowrap; }
  .langpair .i { width: 14px; height: 14px; color: var(--muted); }
  .langpair select {
    border: 0; background: var(--accent-soft); color: var(--accent-text); font-weight: 600;
    height: 26px; border-radius: 6px; padding: 0 8px; cursor: pointer;
  }
  .actions { display: flex; align-items: center; gap: 2px; }

  /* ---------- Layout ---------- */
  main { flex: 1; display: flex; min-height: 0; }
  #viewer { flex: 1; overflow: auto; padding: 24px; position: relative; direction: ltr; }

  /* ---------- Welcome ---------- */
  .welcome { min-height: 100%; display: grid; place-items: center; direction: inherit; }
  [dir="rtl"] .welcome { direction: rtl; }
  .welcome-card {
    width: min(460px, 100%); text-align: center; padding: 40px 32px 28px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    transition: border-color .15s, background .15s;
  }
  .welcome.drag .welcome-card { border-color: var(--accent); background: var(--accent-soft); }
  .welcome-icon { display: block; width: 64px; height: 64px; margin: 0 auto 18px; }
  .welcome h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.01em; }
  .welcome p { margin: 0 auto; color: var(--muted); max-width: 340px; }
  .welcome .btn.lg { margin: 24px 0 10px; }
  .welcome .drop-hint { font-size: 13px; }
  .privacy {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 28px !important; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; max-width: none !important;
  }
  .privacy .i { width: 14px; height: 14px; }

  /* ---------- Pages ---------- */
  .page { position: relative; margin: 0 auto 20px; background: var(--page-bg); box-shadow: var(--shadow-page); border-radius: 2px; }
  .page canvas { display: block; border-radius: 2px; }
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; z-index: 2; }
  .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: pointer; transform-origin: 0% 0%; }
  .textLayer ::selection { background: rgba(47, 111, 94, .3); }

  /* ---------- Side panel ---------- */
  .panel { width: 380px; flex: none; background: var(--surface); border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .seg { display: flex; gap: 2px; margin: 12px 12px 4px; padding: 3px; border-radius: 10px; background: var(--surface-2); }
  .seg button {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; font-weight: 500;
  }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-text); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
  .badge:empty { display: none; }
  .pane { flex: 1; overflow: auto; padding: 16px 20px 24px; }

  .state { text-align: center; color: var(--muted); padding: 28px 8px; }
  .state .i { width: 28px; height: 28px; color: var(--muted); opacity: .8; margin-bottom: 10px; }
  .state h3 { margin: 0 0 6px; color: var(--text); font-size: 15px; }
  .state p { margin: 0 auto 14px; max-width: 280px; }
  .state.error .i { color: var(--danger); opacity: 1; }
  .state.error p { color: var(--danger); }

  .result-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 2px; }
  .word { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; text-align: start; }
  .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .pos { padding: 1px 8px; border-radius: 6px; background: var(--surface-2); }
  .tr { margin: 6px 0 6px; font-size: 22px; font-weight: 700; color: var(--accent-text); }
  .explain { margin: 0 0 4px; font-size: 15px; line-height: 1.65; }
  .result section { margin-top: 20px; }
  .label { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .result section p { margin: 0; }
  .sentence {
    margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-2);
    border-inline-start: 3px solid var(--accent); font-size: 14px; line-height: 1.6; text-align: start;
  }
  .sentence mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; }

  .skeleton { display: grid; gap: 10px; margin: 14px 0 6px; }
  .skeleton span { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  .skeleton span:first-child { height: 22px; width: 45%; }
  .skeleton span.short { width: 70%; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .vocab-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; color: var(--muted); }
  .vocab-list { list-style: none; margin: 0; padding: 0; }
  .vocab-list li { position: relative; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .v-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding-inline-end: 34px; }
  .v-main .w { font-weight: 600; }
  .v-main .v-tr { color: var(--accent-text); }
  .v-book { margin-top: 2px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline-end: 34px; }
  .vocab-list .x { position: absolute; inset-inline-end: 0; top: 8px; width: 28px; height: 28px; opacity: 0; }
  .vocab-list li:hover .x, .vocab-list .x:focus-visible { opacity: 1; }
  .vocab-list .x .i { width: 15px; height: 15px; }

  /* ---------- Settings ---------- */
  dialog {
    border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text);
    width: min(440px, calc(100vw - 32px)); padding: 24px; box-shadow: var(--shadow-pop);
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 4px; font-size: 18px; }
  dialog label { display: block; margin-top: 16px; font-size: 13px; font-weight: 500; }
  dialog input, dialog select {
    display: block; width: 100%; height: 38px; padding: 0 10px; margin-top: 6px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text);
  }
  dialog input:focus, dialog select:focus { outline: none; border-color: var(--accent); }
  dialog small { display: block; margin-top: 6px; color: var(--muted); font-weight: 400; line-height: 1.5; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }

  /* ---------- Small screens ---------- */
  @media (max-width: 900px) {
    .book-title { display: none; }
    .brand + .tools { margin-inline-start: auto; }
  }
  @media (max-width: 760px) {
    .bar { flex-wrap: wrap; height: auto; padding: 8px 12px; row-gap: 8px; }
    [dir="rtl"] .bar { padding: 8px 12px; }
    .tools { order: 5; width: 100%; justify-content: center; }
    .langpair { margin-inline-start: auto; }
    main { flex-direction: column-reverse; }
    .panel { width: 100%; height: 45vh; border-inline-end: 0; border-top: 1px solid var(--border); }
    #viewer { padding: 12px; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <img class="logo" src="logo.svg" alt="">
    <span>Glint</span>
  </div>
  <div class="book-title" id="bookTitle"></div>
  <div class="tools" id="tools" hidden>
    <button class="icon-btn" id="zoomOut" data-i18n-title="zoomOut"><i data-icon="minus"></i></button>
    <span class="readout" id="zoomLabel">100%</span>
    <button class="icon-btn" id="zoomIn" data-i18n-title="zoomIn"><i data-icon="plus"></i></button>
    <span class="divider"></span>
    <label class="page-jump"><input id="pageInput" inputmode="numeric" data-i18n-title="page"><span>/</span><span id="pageTotal"></span></label>
  </div>
  <div class="langpair" data-i18n-title="langPair">
    <span class="from" id="bookLang"></span>
    <i data-icon="arrow" class="flip"></i>
    <select id="target">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="tr">Türkçe</option>
    </select>
  </div>
  <div class="actions">
    <label class="icon-btn" data-i18n-title="open"><i data-icon="folder"></i><input class="file-input" type="file" accept="application/pdf" hidden></label>
    <button class="icon-btn" id="themeBtn" data-i18n-title="toggleTheme"></button>
    <button class="icon-btn" id="settingsBtn" data-i18n-title="settings"><i data-icon="sliders"></i></button>
  </div>
</header>

<main>
  <aside class="panel">
    <div class="seg" role="tablist">
      <button class="on" data-tab="lookup" role="tab"><span data-i18n="tabMeaning"></span></button>
      <button data-tab="vocab" role="tab"><span data-i18n="tabWords"></span><span class="badge" id="vocabCount"></span></button>
    </div>
    <div class="pane" id="lookup">
      <div class="state">
        <i data-icon="pointer"></i>
        <h3 data-i18n="panelTitle"></h3>
        <p data-i18n="hint"></p>
      </div>
    </div>
    <div class="pane" id="vocab" hidden></div>
  </aside>
  <div id="viewer">
    <div class="welcome" id="empty">
      <div class="welcome-card">
        <img class="welcome-icon" src="logo.svg" alt="">
        <h2 data-i18n="emptyTitle"></h2>
        <p data-i18n="emptyText"></p>
        <label class="btn primary lg"><i data-icon="folder"></i><span data-i18n="open"></span><input class="file-input" type="file" accept="application/pdf" hidden></label>
        <p class="drop-hint" data-i18n="dropHint"></p>
        <p class="privacy"><i data-icon="lock"></i><span data-i18n="privacy"></span></p>
      </div>
    </div>
  </div>
</main>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h3 data-i18n="settings"></h3>
    <label><span data-i18n="uiLang"></span>
      <select name="uiLang">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select>
    </label>
    <label><span data-i18n="theme"></span>
      <select name="theme">
        <option value="system" data-i18n="themeSystem"></option>
        <option value="light" data-i18n="themeLight"></option>
        <option value="dark" data-i18n="themeDark"></option>
      </select>
    </label>
    <label><span data-i18n="provider"></span>
      <select name="provider">
        <option value="gemini" data-i18n="optGemini"></option>
        <option value="openai" data-i18n="optOpenai"></option>
        <option value="anthropic">Anthropic Claude</option>
      </select>
    </label>
    <label data-for="openai"><span data-i18n="serverUrl"></span>
      <input name="baseUrl" dir="ltr" placeholder="http://localhost:11434/v1">
      <small data-i18n="serverHelp"></small>
    </label>
    <label><span data-i18n="apiKey"></span>
      <input name="apiKey" type="password" dir="ltr" autocomplete="off">
      <small data-i18n="keyHelp"></small>
    </label>
    <label><span data-i18n="model"></span>
      <input name="model" dir="ltr">
    </label>
    <div class="row">
      <button class="btn" value="cancel" formnovalidate data-i18n="cancel"></button>
      <button class="btn primary" value="save" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
const tauri = window.__TAURI__; // set when running as the installed app

const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('glint:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('glint:' + k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Icons (Lucide, ISC license).
const ICONS = {
  folder: '<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
  sliders: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  minus: '<path d="M5 12h14"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  book: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  pointer: '<path d="M14 4.1 12 6"/><path d="m5.1 8-2.9-.8"/><path d="m6 12-1.9 2"/><path d="M7.2 2.2 8 5.1"/><path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  download: '<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
  key: '<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
};
const icon = (name, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
document.querySelectorAll('i[data-icon]').forEach(el => el.outerHTML = icon(el.dataset.icon, el.className));

// Gemini has no fixed default: we pick the newest Flash-Lite the key can use (biggest free quota, fastest).
const DEFAULT_MODELS = { gemini: '', anthropic: 'claude-haiku-5-5', openai: 'llama3.1' };
const LANGS = {
  ar: { english: 'Arabic', dir: 'rtl' },
  en: { english: 'English', dir: 'ltr' },
  tr: { english: 'Turkish', dir: 'ltr' },
};

// Interface text, in the app language chosen in settings (separate from the translation language).
const STRINGS = {
  ar: {
    title: 'Glint — قارئ PDF', open: 'افتح PDF', settings: 'الإعدادات', uiLang: 'لغة التطبيق', theme: 'المظهر', themeSystem: 'حسب الجهاز', themeLight: 'فاتح', themeDark: 'داكن', toggleTheme: 'الوضع الداكن', zoomIn: 'تكبير', zoomOut: 'تصغير', page: 'الصفحة',
    langPair: 'لغة الكتاب ← لغة الترجمة', auto: 'تلقائي',
    tabMeaning: 'المعنى', tabWords: 'كلماتي',

// ---------- PDF ----------
const viewer = $('#viewer');
const observer = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) renderPage(e.target);
}, { root: viewer, rootMargin: '600px 0px' });

async function openPdf(data, name) {
  const doc = await pdfjsLib.getDocument({ data }).promise;
  pdfDoc = doc;
  bookName = name;
  $('#bookTitle').textContent = name.replace(/\.pdf$/i, '');
  $('#bookTitle').title = name;
  viewer.replaceChildren();
  const base = (await doc.getPage(1)).getViewport({ scale: 1 });
  pageSize = { w: base.width, h: base.height };
  fitScale = fitWidthScale();
  zoom = 1;
  scale = fitScale;
  for (let i = 1; i <= doc.numPages; i++) {
    const div = document.createElement('div');
    div.className = 'page';
    div.dataset.page = i;
    div.style.width = pageSize.w * scale + 'px';
    div.style.height = pageSize.h * scale + 'px';
    viewer.appendChild(div);
    observer.observe(div);
  }
  viewer.scrollTop = 0;
  $('#tools').hidden = false;
  $('#pageTotal').textContent = doc.numPages;
  updatePageLabel();
  updateZoomLabel();
  bookLang = null;
  showBookLang();
  const lang = await detectBookLanguage(doc);
  if (pdfDoc === doc) { bookLang = lang; showBookLang(); }
}

const fitWidthScale = () => Math.max(Math.min((viewer.clientWidth - 48) / pageSize.w, 1.8), 0.4);

async function renderPage(div) {
  if (div.dataset.rendered) return;
  div.dataset.rendered = '1';
  const s = scale, doc = pdfDoc;
  const page = await doc.getPage(+div.dataset.page);
  if (s !== scale || doc !== pdfDoc) return; // zoomed or switched book meanwhile
  const vp = page.getViewport({ scale: s });
  const dpr = window.devicePixelRatio || 1;
  div.dataset.w = vp.width / s;
  div.dataset.h = vp.height / s;
  div.style.width = vp.width + 'px';
  div.style.height = vp.height + 'px';

  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(vp.width * dpr);
  canvas.height = Math.floor(vp.height * dpr);
  canvas.style.width = vp.width + 'px';
  canvas.style.height = vp.height + 'px';
  div.appendChild(canvas);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
  if (s !== scale || !canvas.isConnected) return;
  if (isDark()) await darkenPage(canvas, page, vp, dpr);

  const layer = document.createElement('div');
  layer.className = 'textLayer';
  layer.style.setProperty('--scale-factor', s);
  div.appendChild(layer);
  const textContent = await page.getTextContent();
  await pdfjsLib.renderTextLayer({ textContentSource: textContent, container: layer, viewport: vp, textDivs: [] }).promise;
}

// ---------- Dark pages ----------
// Dark mode inverts the page so text is light on dark, then paints the pictures back in their real colours.
async function darkenPage(canvas, page, vp, dpr) {
  const boxes = await imageBoxes(page, vp, dpr);
  const original = document.createElement('canvas');
  original.width = canvas.width;
  original.height = canvas.height;
  original.getContext('2d').drawImage(canvas, 0, 0);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if ('filter' in ctx) {
    ctx.filter = 'invert(.9) hue-rotate(180deg)'; // hue-rotate keeps coloured text roughly its colour
    ctx.drawImage(original, 0, 0);
    ctx.filter = 'none';
  } else {
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height), d = img.data;
    for (let i = 0; i < d.length; i += 4) for (let c = i; c < i + 3; c++) d[c] = 230 - d[c] * 0.9;
    ctx.putImageData(img, 0, 0);
  }
  for (const [x, y, w, h] of boxes) ctx.drawImage(original, x, y, w, h, x, y, w, h);
}

// Where (in canvas pixels) the page paints pictures. Walks the drawing commands, tracking the transform.
async function imageBoxes(page, vp, dpr) {
  const { OPS, Util } = pdfjsLib;
  const IMAGE_OPS = [OPS.paintImageXObject, OPS.paintInlineImageXObject, OPS.paintImageXObjectRepeat];
  const ops = await page.getOperatorList();
  let ctm = Util.transform([dpr, 0, 0, dpr, 0, 0], vp.transform);
  const stack = [], boxes = [];
  ops.fnArray.forEach((fn, i) => {
    const args = ops.argsArray[i];
    if (fn === OPS.save) stack.push(ctm);
    else if (fn === OPS.restore) ctm = stack.pop() || ctm;
    else if (fn === OPS.transform) ctm = Util.transform(ctm, args);
    else if (fn === OPS.paintFormXObjectBegin) { stack.push(ctm); if (args[0]) ctm = Util.transform(ctm, args[0]); }
    else if (fn === OPS.paintFormXObjectEnd) ctm = stack.pop() || ctm;
    else if (IMAGE_OPS.includes(fn)) {
      // Images are drawn into the unit square of the current transform.
      const pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(p => Util.applyTransform(p, ctm));
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const x = Math.floor(Math.min(...xs)), y = Math.floor(Math.min(...ys));
      boxes.push([x, y, Math.ceil(Math.max(...xs)) - x, Math.ceil(Math.max(...ys)) - y]);
    }
  });
  return boxes;
}

// ---------- Page number and zoom ----------
function currentPage() {
  const line = viewer.scrollTop + viewer.clientHeight / 3;
  let n = 1;
  for (const p of viewer.children) {
    if (p.offsetTop > line) break;
    n = +p.dataset.page || n;
  }
  return n;
}

function updatePageLabel() {
  const input = $('#pageInput');
  if (pdfDoc && document.activeElement !== input) input.value = currentPage();
}

function goToPage(n) {
  const page = viewer.querySelector(`.page[data-page="${Math.min(Math.max(1, n | 0), pdfDoc.numPages)}"]`);
  if (page) viewer.scrollTop = page.offsetTop - 24;
}

let scrollQueued = false;
viewer.addEventListener('scroll', () => {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => { scrollQueued = false; updatePageLabel(); });
}, { passive: true });

$('#pageInput').addEventListener('change', e => { goToPage(+e.target.value); e.target.blur(); });

const ZOOM_STEPS = [0.5, 0.67, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
const zoomStep = dir => setZoom(dir > 0 ? ZOOM_STEPS.find(z => z > zoom + 0.001) ?? zoom : [...ZOOM_STEPS].reverse().find(z => z < zoom - 0.001) ?? zoom);

function setZoom(z, keepFit = false) {
  if (!pdfDoc) return;
  const page = currentPage();
  if (!keepFit) zoom = z;
  scale = fitScale * zoom;
  for (const div of viewer.children) {
    div.replaceChildren();
    delete div.dataset.rendered;
    div.style.width = (+div.dataset.w || pageSize.w) * scale + 'px';
    div.style.height = (+div.dataset.h || pageSize.h) * scale + 'px';
    observer.unobserve(div);
    observer.observe(div); // re-observing re-renders the pages in view
  }
  goToPage(page);
  updateZoomLabel();
}

const updateZoomLabel = () => { $('#zoomLabel').textContent = Math.round(zoom * 100) + '%'; };
$('#zoomIn').onclick = () => zoomStep(1);
$('#zoomOut').onclick = () => zoomStep(-1);
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey)) return;
  if (e.key === '=' || e.key === '+') { e.preventDefault(); zoomStep(1); }
  else if (e.key === '-') { e.preventDefault(); zoomStep(-1); }
  else if (e.key === '0') { e.preventDefault(); setZoom(1); }
});

// Keep "100%" meaning "fits the width" when the window is resized.
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!pdfDoc) return;
    const fit = fitWidthScale();
    if (Math.abs(fit - fitScale) > 0.01) { fitScale = fit; setZoom(zoom, true); }
  }, 200);
});

// ---------- Book language ----------
const STOPWORDS = {
  en: ['the', 'and', 'of', 'to', 'in', 'is', 'that', 'was', 'he', 'it', 'with', 'for', 'as', 'his', 'on', 'you', 'her', 'she', 'they', 'but', 'had', 'at', 'not'],
  tr: ['ve', 'bir', 'bu', 'da', 'de', 'için', 'ile', 'ne', 'çok', 'gibi', 'ama', 'daha', 'o', 'ben', 'sen', 'değil', 'olarak', 'kadar', 'şey', 'her'],
};

function detectLanguage(text) {
  const arabic = (text.match(/[؀-ۿ]/g) || []).length;
  const latin = (text.match(/\p{Script=Latin}/gu) || []).length;
  if (arabic + latin < 200) return null; // scanned pages, or too little text to tell
  if (arabic > latin) return 'ar';
  const words = text.toLocaleLowerCase('tr').match(/\p{L}+/gu) || [];
  const share = list => words.filter(w => list.includes(w)).length / words.length;
  const en = share(STOPWORDS.en), tr = share(STOPWORDS.tr);
  const turkishLetters = (text.match(/[ığşİĞŞ]/g) || []).length / latin; // letters English and most others never use
  if (en >= 0.08 && en > tr) return 'en';
  if (tr >= 0.03 && turkishLetters > 0.003) return 'tr';
  return 'other';
}

// Reads the first pages' text; covers, title pages and contents rarely have enough on their own.
async function detectBookLanguage(doc) {
  let text = '';
  for (let i = 1; i <= Math.min(doc.numPages, 15) && text.length < 6000; i++) {
    const content = await (await doc.getPage(i)).getTextContent();
    text += content.items.map(it => it.str).join(' ') + ' ';
  }
  return detectLanguage(text);
}

const showBookLang = () => { $('#bookLang').textContent = bookLang ? t('langs')[bookLang] : t('auto'); };

// ---------- Word picking ----------
const isWordChar = c => /[\p{L}\p{M}\p{N}'’-]/u.test(c);

function caretAt(x, y) {
  if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(x, y);
    return p && { node: p.offsetNode, offset: p.offset };
  }
  if (document.caretRangeFromPoint) {
    const r = document.caretRangeFromPoint(x, y);
    return r && { node: r.startContainer, offset: r.startOffset };
  }
}

// Joins the page's text spans and cuts out the sentence around the clicked spot.
function sentenceAround(span, offset) {
  let text = '', at = 0;
  for (const el of span.parentElement.children) {
    if (el.tagName === 'BR') {
      // "contin-" at a line end + "ue" on the next line → "continue"
      if (/\p{L}-$/u.test(text)) text = text.slice(0, -1); else text += ' ';
      continue;
    }
    if (el === span) at = text.length + offset;
    text += el.textContent;
  }
  let start = at, end = at;
  while (start > 0 && !/[.!?؟]/.test(text[start - 1]) && at - start < 200) start--;
  while (end < text.length && !/[.!?؟]/.test(text[end]) && end - at < 200) end++;
  return text.slice(start, end + 1).replace(/\s+/g, ' ').trim();
}

viewer.addEventListener('click', e => {
  const sel = window.getSelection();
  const selected = sel.toString().replace(/\s+/g, ' ').trim();
  if (selected) {
    const node = sel.anchorNode;
    const span = (node?.nodeType === 3 ? node.parentElement : node)?.closest('.textLayer > span');
    if (span && selected.split(' ').length <= 10) lookup(selected, sentenceAround(span, sel.anchorOffset));
    return;
  }
  const span = e.target.closest('.textLayer > span');
  if (!span) return;
  const pos = caretAt(e.clientX, e.clientY);
  if (!pos || pos.node.nodeType !== 3 || !span.contains(pos.node)) return;
  const text = pos.node.textContent;
  let s = pos.offset, en = pos.offset;
  while (s > 0 && isWordChar(text[s - 1])) s--;
  while (en < text.length && isWordChar(text[en])) en++;
  const word = text.slice(s, en).replace(/^['’-]+|['’-]+$/g, '');
  if (!word || !/\p{L}/u.test(word)) return;
  lookup(word, sentenceAround(span, s));
});

// ---------- AI ----------
// Reading a book in the same language you asked for: explain in simpler words instead of translating.
const sameLanguage = () => bookLang === settings.lang;

function buildPrompt(word, sentence) {
  const lang = LANGS[settings.lang].english;
  const same = sameLanguage();
  return `You help someone understand a word while they read a book.
Word or phrase: "${word}"
The sentence it appears in: "${sentence}"
Language of the book: ${LANGS[bookLang]?.english || 'detect it from the sentence'}
Answer in: ${lang}
${same ? `The reader reads ${lang} but doesn't know this word, so explain it in simpler ${lang} rather than translating it.\n` : ''}
Give the meaning of the word AS USED IN THIS SENTENCE, not just its most common meaning.
Reply with JSON only, no markdown fences, in exactly this shape:
{"translation": "${same ? `a simpler ${lang} word or short phrase that means the same here` : `short translation of the word as used in this sentence, in ${lang}`}",
 "explanation": "one or two sentences in ${lang} explaining what it means here and why",
 "base_form": "dictionary form of the word in its original language",
 "part_of_speech": "part of speech, in ${lang}",
 "other_meanings": ["up to 3 other common meanings, in ${lang}"],
 "sentence_translation": "${same ? `the sentence rephrased in simpler ${lang}` : `translation of the whole sentence into ${lang}`}"}`;
}

const BUSY = [429, 503, 529]; // rate limited, high demand, overloaded

// In the app, requests go through Rust so AI servers needn't allow browser (CORS) calls.
async function requestJson(method, url, headers, body) {
  if (tauri) {
    const r = await tauri.core.invoke('ai_request', { method, url, headers, body: body ?? null });
    return { ok: r.status >= 200 && r.status < 300, status: r.status, json: r.body };
  }
  const res = await fetch(url, { method, headers: { 'content-type': 'application/json', ...headers }, body: body && JSON.stringify(body) });
  return { ok: res.ok, status: res.status, json: await res.json() };
}

// One short retry for busy servers; anything longer defeats the point of a quick lookup.
async function postJson(url, headers, body) {
  let r = await requestJson('POST', url, headers, body);
  if (BUSY.includes(r.status)) {
    await new Promise(res => setTimeout(res, 800));
    r = await requestJson('POST', url, headers, body);
  }
  if (BUSY.includes(r.status)) throw new Error(t('busy'));
  return r;
}

async function listGeminiModels() {
  if (geminiModels) return geminiModels;
  const r = await requestJson('GET', GEMINI + 'models?pageSize=1000', { 'x-goog-api-key': settings.apiKey });
  const version = n => parseFloat(n.match(/gemini-([\d.]+)/)[1]);
  geminiModels = (r.json?.models || [])
    .filter(m => m.supportedGenerationMethods?.includes('generateContent') && /^models\/gemini-[\d.]+-flash(-lite)?$/.test(m.name))
    .map(m => m.name.slice(7))
    .sort((a, b) => b.endsWith('-lite') - a.endsWith('-lite') || version(b) - version(a));
  return geminiModels;
}

async function geminiCall(model, prompt, noThinking) {
  const generationConfig = { responseMimeType: 'application/json', temperature: 0.2 };
  // A word lookup needs no step-by-step reasoning, and skipping it saves seconds.
  if (noThinking) generationConfig.thinkingConfig = /gemini-2\./.test(model) ? { thinkingBudget: 0 } : { thinkingLevel: 'minimal' };
  return requestJson('POST', `${GEMINI}models/${encodeURIComponent(model)}:generateContent`,
    { 'x-goog-api-key': settings.apiKey }, { contents: [{ parts: [{ text: prompt }] }], generationConfig });
}

// People type names like "Gemini Flash Lite": turn that into an id, or match it to a model the key has.
async function resolveGeminiModel(name) {
  const id = name.trim().toLowerCase().replace(/^models\//, '').replace(/\s+/g, '-');
  if (/^gemini-\d[\w.-]*$/.test(id)) return id;
  const words = id.split('-').filter(w => w && w !== 'gemini');
  return (await listGeminiModels()).find(m => words.every(w => m.split('-').includes(w))) || null;
}

async function askGemini(prompt) {
  const chosen = settings.model && await resolveGeminiModel(settings.model);
  const queue = [chosen, geminiWorking].filter(Boolean);
  const tried = new Set();
  let listed = false, lastError = t('busy');
  while (tried.size < 5) {
    const model = queue.find(m => !tried.has(m));
    if (!model) {
      if (listed) break;
      listed = true;
      queue.push(...await listGeminiModels());
      continue;
    }
    tried.add(model);
    let r = await geminiCall(model, prompt, true);
    if (r.status === 400 && /thinking/i.test(r.json?.error?.message || '')) r = await geminiCall(model, prompt, false);
    if (r.ok) {
      // Only remember Flash-Lite: a stand-in Flash model would burn its much smaller daily quota.
      if (model.endsWith('-lite') && geminiWorking !== model) store.set('geminiWorking', geminiWorking = model);
      return (r.json.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    }
    const msg = r.json?.error?.message || String(r.status);
    const suggested = msg.match(/\buse\s+models\/(gemini-[\w.-]*\w)/i)?.[1];
    if (suggested) queue.unshift(suggested);
    // A wrong key is worth stopping for; a model we can't use just means trying the next one.
    else if (!BUSY.includes(r.status) && r.status !== 404 && !/model/i.test(msg)) throw new Error(msg);
    lastError = BUSY.includes(r.status) ? t('busy') : msg;
  }
  throw new Error(lastError);
}

async function askAI(word, sentence) {
  const prompt = buildPrompt(word, sentence);
  const model = settings.model || DEFAULT_MODELS[settings.provider];
  let r, text;
  if (settings.provider === 'gemini') {
    text = await askGemini(prompt);
  } else if (settings.provider === 'anthropic') {
    r = await postJson('https://api.anthropic.com/v1/messages',
      { 'x-api-key': settings.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      { model, max_tokens: 800, messages: [{ role: 'user', content: prompt }] });
    if (!r.ok) throw new Error(r.json?.error?.message || r.status);
    text = (r.json.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  } else {
    const headers = settings.apiKey ? { authorization: 'Bearer ' + settings.apiKey } : {};
    r = await postJson(settings.baseUrl.replace(/\/+$/, '') + '/chat/completions', headers,
      { model, temperature: 0.2, messages: [{ role: 'user', content: prompt }] });
    if (!r.ok) throw new Error(r.json?.error?.message || r.status);
    text = r.json.choices?.[0]?.message?.content || '';
  }
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error(t('badReply'));
  return JSON.parse(m[0]);
}

// ---------- Lookup panel ----------
const wordHead = (word, meta = '') => `<header class="result-head"><h2 class="word" dir="auto">${esc(word)}</h2>${meta}</header>`;
const section = (title, body) => `<section><h3 class="label">${title}</h3>${body}</section>`;
const stateCard = (iconName, text, action = '', cls = '') => `<div class="state ${cls}">${icon(iconName)}<p>${text}</p>${action}</div>`;

function sentenceBlock(word, sentence) {
  const w = esc(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const marked = esc(sentence).replace(new RegExp(w, 'i'), m => `<mark>${m}</mark>`);
  return section(t('sentence'), `<blockquote class="sentence" dir="auto">${marked}</blockquote>`);
}

async function lookup(word, sentence) {
  showTab('lookup');
  const pane = $('#lookup');
  if (!settings.apiKey && settings.provider !== 'openai') {
    pane.innerHTML = wordHead(word) + stateCard('key', t('needKey'), `<button class="btn primary" id="keyBtn">${t('openSettings')}</button>`);
    $('#keyBtn').onclick = openSettings;
    return;
  }
  const id = ++lookupId;
  lastLookup = { word, sentence };
  const key = settings.lang + '|' + word.toLowerCase() + '|' + sentence;
  if (!cache.has(key)) {
    pane.innerHTML = `<article class="result">${wordHead(word)}<div class="skeleton"><span></span><span></span><span class="short"></span></div>${sentenceBlock(word, sentence)}</article>`;
  }
  try {
    const r = cache.get(key) || await askAI(word, sentence);
    cache.set(key, r);
    store.set('cache', [...cache].slice(-500));
    if (id !== lookupId) return;
    renderResult(word, sentence, r);
    saveWord(word, sentence, r);
  } catch (err) {
    if (id !== lookupId) return;
    pane.innerHTML = `<article class="result">${wordHead(word)}${stateCard('alert', esc(err.message), `<button class="btn" id="retryBtn">${t('retry')}</button>`, 'error')}${sentenceBlock(word, sentence)}</article>`;
    $('#retryBtn').onclick = () => lookup(word, sentence);
  }
}

function renderResult(word, sentence, r) {
  const d = `dir="${LANGS[settings.lang].dir}"`;
  const pos = r.part_of_speech ? `<span class="pos" ${d}>${esc(r.part_of_speech)}</span>` : '';
  const base = r.base_form && r.base_form.toLowerCase() !== word.toLowerCase() ? `<span dir="auto">${esc(r.base_form)}</span>` : '';
  const others = (r.other_meanings || []).map(m => `<span class="chip">${esc(m)}</span>`).join('');
  $('#lookup').innerHTML = `
    <article class="result">
      ${wordHead(word, pos || base ? `<div class="meta">${pos}${base}</div>` : '')}
      <p class="tr" ${d}>${esc(r.translation)}</p>
      <p class="explain" ${d}>${esc(r.explanation)}</p>
      ${sentenceBlock(word, sentence)}
      ${r.sentence_translation ? section(t(sameLanguage() ? 'sentenceSimple' : 'sentenceTr'), `<p ${d}>${esc(r.sentence_translation)}</p>`) : ''}
      ${others ? section(t('others'), `<div class="chips" ${d}>${others}</div>`) : ''}
    </article>`;
}

// ---------- Vocabulary ----------
function saveWord(word, sentence, r) {
  vocab = vocab.filter(v => !(v.word.toLowerCase() === word.toLowerCase() && v.sentence === sentence));
  vocab.unshift({ word, translation: r.translation, explanation: r.explanation, sentence, book: bookName, date: new Date().toISOString() });
  store.set('vocab', vocab);
  updateVocabCount();
}

const updateVocabCount = () => { $('#vocabCount').textContent = vocab.length || ''; };

function renderVocab() {
  updateVocabCount();
  const pane = $('#vocab');
  if (!vocab.length) { pane.innerHTML = stateCard('bookmark', t('vocabEmpty')); return; }
  pane.innerHTML = `
    <div class="vocab-head"><span>${t('count')(vocab.length)}</span><button class="btn small" id="exportBtn">${icon('download')}${t('export')}</button></div>
    <ul class="vocab-list">${vocab.map((v, i) => `
      <li>
        <div class="v-main"><span class="w" dir="auto">${esc(v.word)}</span><span class="v-tr" dir="auto">${esc(v.translation)}</span></div>
        <div class="v-book" dir="auto">${esc(v.book.replace(/\.pdf$/i, ''))}</div>
        <button class="icon-btn x" data-i="${i}" title="${t('remove')}" aria-label="${t('remove')}">${icon('x')}</button>
      </li>`).join('')}
    </ul>`;
  $('#exportBtn').onclick = exportCsv;
  pane.querySelectorAll('.x').forEach(b => b.onclick = () => { vocab.splice(+b.dataset.i, 1); store.set('vocab', vocab); renderVocab(); });
}

function exportCsv() {
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = vocab.map(v => [v.word, `${v.translation} — ${v.explanation}`, v.sentence, v.book].map(q).join(','));
  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'glint-vocab.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- UI ----------
function showTab(name) {
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $('#lookup').hidden = name !== 'lookup';
  $('#vocab').hidden = name !== 'vocab';
  if (name === 'vocab') renderVocab();
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

const form = $('#settingsForm');
function syncProviderFields() {
  form.querySelector('[data-for="openai"]').hidden = form.provider.value !== 'openai';
  form.model.placeholder = DEFAULT_MODELS[form.provider.value] || t('autoModel');
}
function openSettings() {
  for (const k of ['uiLang', 'theme', 'provider', 'baseUrl', 'apiKey', 'model']) form[k].value = settings[k] || '';
  syncProviderFields();
  $('#settings').showModal();
}
form.provider.onchange = () => { form.model.value = ''; syncProviderFields(); };
$('#settings').addEventListener('close', () => {
  if ($('#settings').returnValue !== 'save') return;
  const uiChanged = form.uiLang.value !== settings.uiLang;
  for (const k of ['uiLang', 'theme', 'provider', 'baseUrl', 'apiKey', 'model']) settings[k] = form[k].value.trim();
  store.set('settings', settings);
  applyTheme();
  if (uiChanged) {
    applyUiLanguage();
    if (lastLookup) lookup(lastLookup.word, lastLookup.sentence); // redraw the open word's labels
  }
});
$('#settingsBtn').onclick = openSettings;

// ---------- Appearance ----------
const systemDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => settings.theme === 'dark' || (settings.theme === 'system' && systemDark.matches);

let pagesDark = null; // the theme the open book's pages were drawn in
function applyTheme() {
  if (settings.theme === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = settings.theme;
  $('#themeBtn').innerHTML = icon(isDark() ? 'sun' : 'moon');
  if (pagesDark !== null && pagesDark !== isDark()) setZoom(zoom, true); // redraw pages in the new colours
  pagesDark = isDark();
}
// The quick toggle picks the opposite of what's on screen and keeps it, whatever the system does later.
$('#themeBtn').onclick = () => {
  settings.theme = isDark() ? 'light' : 'dark';
  store.set('settings', settings);
  applyTheme();
};
systemDark.addEventListener('change', applyTheme);

function applyUiLanguage() {
  document.documentElement.lang = settings.uiLang;
  document.documentElement.dir = LANGS[settings.uiLang].dir;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);
    el.setAttribute('aria-label', el.title);
  });
  showBookLang();
  if (!$('#vocab').hidden) renderVocab();
}

const target = $('#target');
target.value = settings.lang;
target.onchange = () => {
  settings.lang = target.value;
  store.set('settings', settings);
  if (lastLookup) lookup(lastLookup.word, lastLookup.sentence); // show the open word in the new language
};
applyTheme();
applyUiLanguage();
updateVocabCount();
</script>
</body>
