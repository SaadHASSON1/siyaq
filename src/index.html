<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glint — قارئ PDF</title>
<script src="vendor/pdf.min.js"></script>
<style>
  :root {
    --bg: #f4f2ee; --surface: #ffffff; --text: #1d1b18; --muted: #6b665e;
    --border: #e2ddd4; --accent: #2f6f5e; --accent-soft: #e3efeb; --danger: #b3412f;
    --page-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --surface: #201f1c; --text: #ece8e1; --muted: #a39d93;
      --border: #34312c; --accent: #6fbfa8; --accent-soft: #23352f; --danger: #e07a66;
      --page-shadow: 0 1px 3px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; margin-inline-end: auto; color: var(--accent); }
  header .pick { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  header select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }
  header .file { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
  button, .btn { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary, .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:hover, .btn:hover { filter: brightness(.96); }
  main { flex: 1; display: flex; min-height: 0; }
  #viewer { flex: 1; overflow: auto; padding: 16px; direction: ltr; }
  #empty { max-width: 520px; margin: 10vh auto; text-align: center; color: var(--muted); border: 2px dashed var(--border); border-radius: 16px; padding: 40px 16px; }
  #empty.drag { border-color: var(--accent); background: var(--accent-soft); }
  .page { position: relative; margin: 0 auto 16px; background: #fff; box-shadow: var(--page-shadow); }
  .page canvas { display: block; }
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; z-index: 2; }
  .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: pointer; transform-origin: 0% 0%; }
  .textLayer ::selection { background: rgba(47,111,94,.35); }
  .textLayer .hit { background: rgba(255, 200, 0, .35); border-radius: 2px; }

  aside { width: 360px; max-width: 100%; background: var(--surface); border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tabs button { flex: 1; border: 0; border-radius: 0; padding: 10px; background: none; color: var(--muted); }
  .tabs button.on { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .pane { flex: 1; overflow: auto; padding: 16px; }
  .hint { color: var(--muted); }
  .word { font-size: 24px; font-weight: 700; text-align: start; }
  .tr { font-size: 22px; color: var(--accent); font-weight: 700; margin: 4px 0 12px; }
  .label { font-size: 12px; color: var(--muted); margin-top: 14px; }
  .sentence { text-align: start; background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .sentence mark { background: rgba(255,200,0,.45); color: inherit; border-radius: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .error { color: var(--danger); }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vocab-item { border-bottom: 1px solid var(--border); padding: 8px 0; display: flex; gap: 8px; }
  .vocab-item .w { font-weight: 700; }
  .vocab-item .x { margin-inline-start: auto; border: 0; background: none; color: var(--muted); padding: 0 4px; }
  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); width: min(460px, calc(100vw - 32px)); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog label { display: block; margin-top: 12px; font-size: 13px; color: var(--muted); }
  dialog input, dialog select { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); margin-top: 4px; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-start; margin-top: 18px; }
  dialog small { color: var(--muted); display: block; margin-top: 4px; }

  @media (max-width: 760px) {
    main { flex-direction: column-reverse; }
    aside { width: 100%; height: 42vh; border-inline-end: 0; border-top: 1px solid var(--border); }
    #viewer { padding: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>Glint</h1>
  <label class="btn primary"><span data-i18n="open"></span><input id="file" type="file" accept="application/pdf" hidden></label>
  <label class="pick"><span data-i18n="translateTo"></span>
    <select id="target">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="tr">Türkçe</option>
    </select>
  </label>
  <span class="chip" id="bookLang" hidden></span>
  <button id="settingsBtn" data-i18n="settings"></button>
  <span class="file" id="fileName"></span>
</header>

<main>
  <aside>
    <div class="tabs">
      <button class="on" data-tab="lookup" data-i18n="tabMeaning"></button>
      <button data-tab="vocab" data-i18n="tabWords"></button>
    </div>
    <div class="pane" id="lookup">
      <p class="hint" data-i18n="hint"></p>
    </div>
    <div class="pane" id="vocab" hidden></div>
  </aside>
  <div id="viewer">
    <div id="empty">
      <p style="font-size:18px;color:var(--text)" data-i18n="dropTitle"></p>
      <p data-i18n="dropText"></p>
    </div>
  </div>
</main>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h3 style="margin-top:0" data-i18n="settings"></h3>
    <label><span data-i18n="provider"></span>
      <select name="provider">
        <option value="gemini" data-i18n="optGemini"></option>
        <option value="openai" data-i18n="optOpenai"></option>
        <option value="anthropic">Anthropic Claude</option>
      </select>
    </label>
    <label data-for="openai"><span data-i18n="serverUrl"></span>
      <input name="baseUrl" dir="ltr" placeholder="http://localhost:11434/v1">
      <small data-i18n="serverHelp"></small>
    </label>
    <label><span data-i18n="apiKey"></span>
      <input name="apiKey" type="password" dir="ltr" autocomplete="off">
      <small data-i18n="keyHelp"></small>
    </label>
    <label><span data-i18n="model"></span>
      <input name="model" dir="ltr">
    </label>
    <div class="row">
      <button class="primary" value="save" data-i18n="save"></button>
      <button value="cancel" formnovalidate data-i18n="cancel"></button>
    </div>
  </form>
</dialog>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
const tauri = window.__TAURI__; // set when running as the installed app

const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('glint:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('glint:' + k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Gemini has no fixed default: we pick the newest Flash-Lite the key can use (biggest free quota, fastest).
const DEFAULT_MODELS = { gemini: '', anthropic: 'claude-haiku-5-5', openai: 'llama3.1' };
const LANGS = {
  ar: { english: 'Arabic', dir: 'rtl' },
  en: { english: 'English', dir: 'ltr' },
  tr: { english: 'Turkish', dir: 'ltr' },
};

// Interface text. The interface follows the "translate to" language: that's the reader's own language.
const STRINGS = {
  ar: {
    title: 'Glint — قارئ PDF', open: 'افتح PDF', translateTo: 'ترجم إلى', settings: 'الإعدادات',
    tabMeaning: 'المعنى', tabWords: 'كلماتي',
    hint: 'افتح ملف PDF واضغط على أي كلمة لتعرف معناها <b>حسب الجملة</b> اللي هي فيها. لعبارة كاملة، ظلّلها بالماوس.',
    dropTitle: 'اسحب ملف PDF إلى هنا',
    dropText: 'أو استخدم زر «افتح PDF». الملف ما بيطلع من جهازك، فقط الجملة اللي بتسأل عنها بتنبعت لنموذج الذكاء الاصطناعي اللي اخترته.',
    provider: 'مزوّد الذكاء الاصطناعي', optGemini: 'Google Gemini (فيه خطة مجانية)', optOpenai: 'Ollama / متوافق مع OpenAI (محلي ومجاني)',
    serverUrl: 'عنوان الخادم', serverHelp: 'لـ Ollama على جهازك، أو أي خدمة متوافقة مع OpenAI (OpenRouter، Groq، OpenAI…).',
    apiKey: 'مفتاح API', keyHelp: 'بيتخزن على جهازك فقط. لـ Gemini خذ مفتاح مجاني من aistudio.google.com. لـ Ollama اتركه فاضي.',
    model: 'اسم النموذج (اختياري)', autoModel: 'تلقائي (Flash-Lite)', save: 'حفظ', cancel: 'إلغاء',
    bookLang: 'لغة الكتاب: ', langs: { ar: 'العربية', en: 'الإنجليزية', tr: 'التركية', other: 'لغة أخرى' },
    needKey: 'لازم تضيف مفتاح API أولاً.', openSettings: 'افتح الإعدادات', failed: 'ما زبط الطلب: ',
    busy: 'خدمة الذكاء الاصطناعي مشغولة هلق. جرّب كمان شوي.', badReply: 'النموذج رجّع رد مش مفهوم',
    sentence: 'الجملة', meaningHere: 'المعنى هون', sentenceTr: 'ترجمة الجملة', sentenceSimple: 'الجملة بكلمات أبسط', others: 'معاني تانية للكلمة',
    vocabEmpty: 'الكلمات اللي بتبحث عنها بتنحفظ هون تلقائياً.', export: 'تصدير CSV (لـ Anki)', count: n => `${n} كلمة`, remove: 'احذف',
  },
  en: {
    title: 'Glint — PDF reader', open: 'Open PDF', translateTo: 'Translate to', settings: 'Settings',
    tabMeaning: 'Meaning', tabWords: 'My words',
    hint: 'Open a PDF and click any word to see what it means <b>in its sentence</b>. For a whole phrase, select it.',
    dropTitle: 'Drop a PDF here',
    dropText: 'Or use “Open PDF”. Your file never leaves your device; only the sentence you ask about is sent to the AI you chose.',
    provider: 'AI provider', optGemini: 'Google Gemini (free plan available)', optOpenai: 'Ollama / OpenAI-compatible (local, free)',
    serverUrl: 'Server URL', serverHelp: 'For Ollama on your computer, or any OpenAI-compatible service (OpenRouter, Groq, OpenAI…).',
    apiKey: 'API key', keyHelp: 'Stored on your device only. Get a free Gemini key at aistudio.google.com. Leave empty for Ollama.',
    model: 'Model name (optional)', autoModel: 'Automatic (Flash-Lite)', save: 'Save', cancel: 'Cancel',
    bookLang: 'Book language: ', langs: { ar: 'Arabic', en: 'English', tr: 'Turkish', other: 'Other' },
    needKey: 'Add an API key first.', openSettings: 'Open settings', failed: 'Lookup failed: ',
    busy: 'The AI service is busy right now. Try again in a moment.', badReply: 'The model sent back an answer we couldn’t read',
    sentence: 'Sentence', meaningHere: 'Meaning here', sentenceTr: 'Sentence translation', sentenceSimple: 'In simpler words', others: 'Other meanings',
    vocabEmpty: 'Words you look up are saved here automatically.', export: 'Export CSV (for Anki)', count: n => `${n} ${n === 1 ? 'word' : 'words'}`, remove: 'Delete',
  },
  tr: {
    title: 'Glint — PDF okuyucu', open: 'PDF aç', translateTo: 'Çeviri dili', settings: 'Ayarlar',
    tabMeaning: 'Anlam', tabWords: 'Kelimelerim',
    hint: 'Bir PDF açın ve herhangi bir kelimeye tıklayarak <b>cümledeki</b> anlamını görün. Bir ifadenin tamamı için onu seçin.',
    dropTitle: 'PDF dosyasını buraya bırakın',
    dropText: 'Ya da “PDF aç” düğmesini kullanın. Dosyanız cihazınızdan çıkmaz; yalnızca sorduğunuz cümle seçtiğiniz yapay zekâya gönderilir.',
    provider: 'Yapay zekâ sağlayıcısı', optGemini: 'Google Gemini (ücretsiz plan var)', optOpenai: 'Ollama / OpenAI uyumlu (yerel, ücretsiz)',
    serverUrl: 'Sunucu adresi', serverHelp: 'Bilgisayarınızdaki Ollama ya da OpenAI uyumlu herhangi bir hizmet için (OpenRouter, Groq, OpenAI…).',
    apiKey: 'API anahtarı', keyHelp: 'Yalnızca cihazınızda saklanır. Ücretsiz Gemini anahtarını aistudio.google.com adresinden alın. Ollama için boş bırakın.',
    model: 'Model adı (isteğe bağlı)', autoModel: 'Otomatik (Flash-Lite)', save: 'Kaydet', cancel: 'İptal',
    bookLang: 'Kitap dili: ', langs: { ar: 'Arapça', en: 'İngilizce', tr: 'Türkçe', other: 'Diğer' },
    needKey: 'Önce bir API anahtarı ekleyin.', openSettings: 'Ayarları aç', failed: 'İstek başarısız: ',
    busy: 'Yapay zekâ hizmeti şu anda yoğun. Biraz sonra tekrar deneyin.', badReply: 'Model okunamayan bir yanıt verdi',
    sentence: 'Cümle', meaningHere: 'Buradaki anlamı', sentenceTr: 'Cümlenin çevirisi', sentenceSimple: 'Daha basit sözcüklerle', others: 'Diğer anlamları',
    vocabEmpty: 'Aradığınız kelimeler burada otomatik olarak saklanır.', export: 'CSV dışa aktar (Anki için)', count: n => `${n} kelime`, remove: 'Sil',
  },
};

const systemLang = ['ar', 'tr', 'en'].find(l => (navigator.language || '').toLowerCase().startsWith(l)) || 'en';
let settings = Object.assign({ provider: 'gemini', apiKey: '', model: '', baseUrl: 'http://localhost:11434/v1', lang: systemLang }, store.get('settings', {}));
if (!LANGS[settings.lang]) settings.lang = 'ar'; // earlier versions stored free text here, always Arabic
const t = key => STRINGS[settings.lang][key] ?? STRINGS.en[key];
// Earlier versions saved these as the model; they have tiny free quotas, so go back to automatic.
if (/^gemini-(2\.5|3\.8)-flash$/.test(settings.model)) { settings.model = ''; store.set('settings', settings); }
let vocab = store.get('vocab', []);
let pdfDoc = null, scale = 1, bookName = '';
let bookLang = null; // 'ar' | 'en' | 'tr' | 'other', or null when the PDF has too little text
let lastLookup = null;
const cache = new Map(store.get('cache', [])); // word|sentence → answer, kept between sessions
let lookupId = 0;

// ---------- PDF ----------
const viewer = $('#viewer');
const observer = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) renderPage(e.target);
}, { root: viewer, rootMargin: '600px 0px' });

async function openPdf(data, name) {
  pdfDoc = await pdfjsLib.getDocument({ data }).promise;
  bookName = name;
  $('#fileName').textContent = name;
  viewer.innerHTML = '';
  const first = await pdfDoc.getPage(1);
  const base = first.getViewport({ scale: 1 });
  scale = Math.max(Math.min((viewer.clientWidth - 32) / base.width, 1.8), 0.5);
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    const div = document.createElement('div');
    div.className = 'page';
    div.dataset.page = i;
    div.style.width = base.width * scale + 'px';
    div.style.height = base.height * scale + 'px';
    viewer.appendChild(div);
    observer.observe(div);
  }
  bookLang = null;
  showBookLang();
  const lang = await detectBookLanguage(pdfDoc);
  if (pdfDoc.numPages && bookName === name) { bookLang = lang; showBookLang(); }
}

// ---------- Book language ----------
const STOPWORDS = {
  en: ['the', 'and', 'of', 'to', 'in', 'is', 'that', 'was', 'he', 'it', 'with', 'for', 'as', 'his', 'on', 'you', 'her', 'she', 'they', 'but', 'had', 'at', 'not'],
  tr: ['ve', 'bir', 'bu', 'da', 'de', 'için', 'ile', 'ne', 'çok', 'gibi', 'ama', 'daha', 'o', 'ben', 'sen', 'değil', 'olarak', 'kadar', 'şey', 'her'],
};

function detectLanguage(text) {
  const arabic = (text.match(/[\u0600-\u06FF]/g) || []).length;
  const latin = (text.match(/\p{Script=Latin}/gu) || []).length;
  if (arabic + latin < 200) return null; // scanned pages, or too little text to tell
  if (arabic > latin) return 'ar';
  const words = text.toLocaleLowerCase('tr').match(/\p{L}+/gu) || [];
  const share = list => words.filter(w => list.includes(w)).length / words.length;
  const en = share(STOPWORDS.en), tr = share(STOPWORDS.tr);
  const turkishLetters = (text.match(/[ığşİĞŞ]/g) || []).length / latin; // letters English and most others never use
  if (en >= 0.08 && en > tr) return 'en';
  if (tr >= 0.03 && turkishLetters > 0.003) return 'tr';
  return 'other';
}

// Reads the first pages' text; covers, title pages and contents rarely have enough on their own.
async function detectBookLanguage(doc) {
  let text = '';
  for (let i = 1; i <= Math.min(doc.numPages, 15) && text.length < 6000; i++) {
    const content = await (await doc.getPage(i)).getTextContent();
    text += content.items.map(it => it.str).join(' ') + ' ';
  }
  return detectLanguage(text);
}

function showBookLang() {
  const chip = $('#bookLang');
  chip.hidden = !bookLang;
  chip.textContent = t('bookLang') + t('langs')[bookLang];
}

async function renderPage(div) {
  if (div.dataset.rendered) return;
  div.dataset.rendered = '1';
  const page = await pdfDoc.getPage(+div.dataset.page);
  const vp = page.getViewport({ scale });
  const dpr = window.devicePixelRatio || 1;
  div.style.width = vp.width + 'px';
  div.style.height = vp.height + 'px';

  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(vp.width * dpr);
  canvas.height = Math.floor(vp.height * dpr);
  canvas.style.width = vp.width + 'px';
  canvas.style.height = vp.height + 'px';
  div.appendChild(canvas);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;

  const layer = document.createElement('div');
  layer.className = 'textLayer';
  layer.style.setProperty('--scale-factor', scale);
  div.appendChild(layer);
  const textContent = await page.getTextContent();
  await pdfjsLib.renderTextLayer({ textContentSource: textContent, container: layer, viewport: vp, textDivs: [] }).promise;
}

$('#file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f) openPdf(new Uint8Array(await f.arrayBuffer()), f.name);
});
// PDFs double-clicked in Finder / Explorer, or opened with "Open with Glint".
async function openFromOS(path) {
  if (!path) return;
  const bytes = await tauri.core.invoke('read_pdf', { path });
  openPdf(new Uint8Array(bytes), path.split(/[\\/]/).pop());
}
if (tauri) {
  tauri.event.listen('open-file', () => tauri.core.invoke('take_pending_file').then(openFromOS));
  tauri.core.invoke('take_pending_file').then(openFromOS);
}

viewer.addEventListener('dragover', e => { e.preventDefault(); $('#empty')?.classList.add('drag'); });
viewer.addEventListener('dragleave', () => $('#empty')?.classList.remove('drag'));
viewer.addEventListener('drop', async e => {
  e.preventDefault();
  const f = [...e.dataTransfer.files].find(f => f.type === 'application/pdf' || f.name.endsWith('.pdf'));
  if (f) openPdf(new Uint8Array(await f.arrayBuffer()), f.name);
});

// ---------- Word picking ----------
const isWordChar = c => /[\p{L}\p{M}\p{N}'’-]/u.test(c);

function caretAt(x, y) {
  if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(x, y);
    return p && { node: p.offsetNode, offset: p.offset };
  }
  if (document.caretRangeFromPoint) {
    const r = document.caretRangeFromPoint(x, y);
    return r && { node: r.startContainer, offset: r.startOffset };
  }
}

// Joins the page's text spans and cuts out the sentence around the clicked spot.
function sentenceAround(span, offset) {
  let text = '', at = 0;
  for (const el of span.parentElement.children) {
    if (el.tagName === 'BR') {
      // "contin-" at a line end + "ue" on the next line → "continue"
      if (/\p{L}-$/u.test(text)) text = text.slice(0, -1); else text += ' ';
      continue;
    }
    if (el === span) at = text.length + offset;
    text += el.textContent;
  }
  let start = at, end = at;
  while (start > 0 && !/[.!?؟]/.test(text[start - 1]) && at - start < 200) start--;
  while (end < text.length && !/[.!?؟]/.test(text[end]) && end - at < 200) end++;
  return text.slice(start, end + 1).replace(/\s+/g, ' ').trim();
}

viewer.addEventListener('click', e => {
  const sel = window.getSelection();
  const selected = sel.toString().replace(/\s+/g, ' ').trim();
  if (selected) {
    const node = sel.anchorNode;
    const span = (node?.nodeType === 3 ? node.parentElement : node)?.closest('.textLayer > span');
    if (span && selected.split(' ').length <= 10) lookup(selected, sentenceAround(span, sel.anchorOffset));
    return;
  }
  const span = e.target.closest('.textLayer > span');
  if (!span) return;
  const pos = caretAt(e.clientX, e.clientY);
  if (!pos || pos.node.nodeType !== 3 || !span.contains(pos.node)) return;
  const text = pos.node.textContent;
  let s = pos.offset, en = pos.offset;
  while (s > 0 && isWordChar(text[s - 1])) s--;
  while (en < text.length && isWordChar(text[en])) en++;
  const word = text.slice(s, en).replace(/^['’-]+|['’-]+$/g, '');
  if (!word || !/\p{L}/u.test(word)) return;
  lookup(word, sentenceAround(span, s));
});

// ---------- AI ----------
// Reading a book in the same language you asked for: explain in simpler words instead of translating.
const sameLanguage = () => bookLang === settings.lang;

function buildPrompt(word, sentence) {
  const lang = LANGS[settings.lang].english;
  const same = sameLanguage();
  return `You help someone understand a word while they read a book.
Word or phrase: "${word}"
The sentence it appears in: "${sentence}"
Language of the book: ${LANGS[bookLang]?.english || 'detect it from the sentence'}
Answer in: ${lang}
${same ? `The reader reads ${lang} but doesn't know this word, so explain it in simpler ${lang} rather than translating it.\n` : ''}
Give the meaning of the word AS USED IN THIS SENTENCE, not just its most common meaning.
Reply with JSON only, no markdown fences, in exactly this shape:
{"translation": "${same ? `a simpler ${lang} word or short phrase that means the same here` : `short translation of the word as used in this sentence, in ${lang}`}",
 "explanation": "one or two sentences in ${lang} explaining what it means here and why",
 "base_form": "dictionary form of the word in its original language",
 "part_of_speech": "part of speech, in ${lang}",
 "other_meanings": ["up to 3 other common meanings, in ${lang}"],
 "sentence_translation": "${same ? `the sentence rephrased in simpler ${lang}` : `translation of the whole sentence into ${lang}`}"}`;
}

const BUSY = [429, 503, 529]; // rate limited, high demand, overloaded

// In the app, requests go through Rust so AI servers needn't allow browser (CORS) calls.
async function requestJson(method, url, headers, body) {
  if (tauri) {
    const r = await tauri.core.invoke('ai_request', { method, url, headers, body: body ?? null });
    return { ok: r.status >= 200 && r.status < 300, status: r.status, json: r.body };
  }
  const res = await fetch(url, { method, headers: { 'content-type': 'application/json', ...headers }, body: body && JSON.stringify(body) });
  return { ok: res.ok, status: res.status, json: await res.json() };
}

// One short retry for busy servers; anything longer defeats the point of a quick lookup.
async function postJson(url, headers, body) {
  let r = await requestJson('POST', url, headers, body);
  if (BUSY.includes(r.status)) {
    await new Promise(res => setTimeout(res, 800));
    r = await requestJson('POST', url, headers, body);
  }
  if (BUSY.includes(r.status)) throw new Error(t('busy'));
  return r;
}

// ----- Gemini: when one model is busy or retired, move straight on to another -----
const GEMINI = 'https://generativelanguage.googleapis.com/v1beta/';
let geminiModels = null; // Flash models this key can use, newest first
let geminiWorking = store.get('geminiWorking', null); // the Flash-Lite model that answered last, tried first

async function listGeminiModels() {
  if (geminiModels) return geminiModels;
  const r = await requestJson('GET', GEMINI + 'models?pageSize=1000', { 'x-goog-api-key': settings.apiKey });
  const version = n => parseFloat(n.match(/gemini-([\d.]+)/)[1]);
  geminiModels = (r.json?.models || [])
    .filter(m => m.supportedGenerationMethods?.includes('generateContent') && /^models\/gemini-[\d.]+-flash(-lite)?$/.test(m.name))
    .map(m => m.name.slice(7))
    .sort((a, b) => b.endsWith('-lite') - a.endsWith('-lite') || version(b) - version(a));
  return geminiModels;
}

async function geminiCall(model, prompt, noThinking) {
  const generationConfig = { responseMimeType: 'application/json', temperature: 0.2 };
  // A word lookup needs no step-by-step reasoning, and skipping it saves seconds.
  if (noThinking) generationConfig.thinkingConfig = /gemini-2\./.test(model) ? { thinkingBudget: 0 } : { thinkingLevel: 'minimal' };
  return requestJson('POST', `${GEMINI}models/${encodeURIComponent(model)}:generateContent`,
    { 'x-goog-api-key': settings.apiKey }, { contents: [{ parts: [{ text: prompt }] }], generationConfig });
}

async function askGemini(prompt) {
  const queue = [settings.model, geminiWorking].filter(Boolean);
  const tried = new Set();
  let listed = false, lastError = t('busy');
  while (tried.size < 5) {
    const model = queue.find(m => !tried.has(m));
    if (!model) {
      if (listed) break;
      listed = true;
      queue.push(...await listGeminiModels());
      continue;
    }
    tried.add(model);
    let r = await geminiCall(model, prompt, true);
    if (r.status === 400 && /thinking/i.test(r.json?.error?.message || '')) r = await geminiCall(model, prompt, false);
    if (r.ok) {
      // Only remember Flash-Lite: a stand-in Flash model would burn its much smaller daily quota.
      if (model.endsWith('-lite') && geminiWorking !== model) store.set('geminiWorking', geminiWorking = model);
      return (r.json.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    }
    const msg = r.json?.error?.message || String(r.status);
    const suggested = msg.match(/\buse\s+models\/(gemini-[\w.-]*\w)/i)?.[1];
    if (suggested) queue.unshift(suggested);
    else if (!BUSY.includes(r.status) && r.status !== 404) throw new Error(msg); // e.g. a wrong API key
    lastError = BUSY.includes(r.status) ? t('busy') : msg;
  }
  throw new Error(lastError);
}

async function askAI(word, sentence) {
  const prompt = buildPrompt(word, sentence);
  const model = settings.model || DEFAULT_MODELS[settings.provider];
  let r, text;
  if (settings.provider === 'gemini') {
    text = await askGemini(prompt);
  } else if (settings.provider === 'anthropic') {
    r = await postJson('https://api.anthropic.com/v1/messages',
      { 'x-api-key': settings.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      { model, max_tokens: 800, messages: [{ role: 'user', content: prompt }] });
    if (!r.ok) throw new Error(r.json?.error?.message || r.status);
    text = (r.json.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  } else {
    const headers = settings.apiKey ? { authorization: 'Bearer ' + settings.apiKey } : {};
    r = await postJson(settings.baseUrl.replace(/\/+$/, '') + '/chat/completions', headers,
      { model, temperature: 0.2, messages: [{ role: 'user', content: prompt }] });
    if (!r.ok) throw new Error(r.json?.error?.message || r.status);
    text = r.json.choices?.[0]?.message?.content || '';
  }
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error(t('badReply'));
  return JSON.parse(m[0]);
}

async function lookup(word, sentence) {
  showTab('lookup');
  const pane = $('#lookup');
  if (!settings.apiKey && settings.provider !== 'openai') {
    pane.innerHTML = `<div class="word" dir="auto">${esc(word)}</div><p>${t('needKey')}</p><button class="primary" onclick="openSettings()">${t('openSettings')}</button>`;
    return;
  }
  const id = ++lookupId;
  lastLookup = { word, sentence };
  pane.innerHTML = `<div class="word" dir="auto">${esc(word)}</div><div style="margin:16px 0"><div class="spinner"></div></div>${sentenceHtml(word, sentence)}`;
  const key = settings.lang + '|' + word.toLowerCase() + '|' + sentence;
  try {
    const r = cache.get(key) || await askAI(word, sentence);
    cache.set(key, r);
    store.set('cache', [...cache].slice(-500));
    if (id !== lookupId) return;
    renderResult(word, sentence, r);
    saveWord(word, sentence, r);
  } catch (err) {
    if (id !== lookupId) return;
    pane.innerHTML = `<div class="word" dir="auto">${esc(word)}</div><p class="error">${t('failed')}${esc(err.message)}</p>${sentenceHtml(word, sentence)}`;
  }
}

function sentenceHtml(word, sentence) {
  const safe = esc(sentence);
  const w = esc(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return `<div class="label">${t('sentence')}</div><div class="sentence" dir="auto">${safe.replace(new RegExp(w, 'i'), m => `<mark>${m}</mark>`)}</div>`;
}

function renderResult(word, sentence, r) {
  const d = `dir="${LANGS[settings.lang].dir}" style="text-align:start"`;
  const others = (r.other_meanings || []).map(m => `<span class="chip">${esc(m)}</span>`).join('');
  $('#lookup').innerHTML = `
    <div class="word" dir="auto">${esc(word)}</div>
    ${r.base_form && r.base_form.toLowerCase() !== word.toLowerCase() ? `<div class="hint" dir="auto" style="text-align:start">${esc(r.base_form)}</div>` : ''}
    <div class="tr" ${d}>${esc(r.translation)}</div>
    ${r.part_of_speech ? `<span class="chip">${esc(r.part_of_speech)}</span>` : ''}
    <div class="label">${t('meaningHere')}</div><div ${d}>${esc(r.explanation)}</div>
    ${sentenceHtml(word, sentence)}
    ${r.sentence_translation ? `<div class="label">${t(sameLanguage() ? 'sentenceSimple' : 'sentenceTr')}</div><div ${d}>${esc(r.sentence_translation)}</div>` : ''}
    ${others ? `<div class="label">${t('others')}</div><div class="chips" ${d}>${others}</div>` : ''}`;
}

// ---------- Vocabulary ----------
function saveWord(word, sentence, r) {
  vocab = vocab.filter(v => !(v.word.toLowerCase() === word.toLowerCase() && v.sentence === sentence));
  vocab.unshift({ word, translation: r.translation, explanation: r.explanation, sentence, book: bookName, date: new Date().toISOString() });
  store.set('vocab', vocab);
}

function renderVocab() {
  const pane = $('#vocab');
  if (!vocab.length) { pane.innerHTML = `<p class="hint">${t('vocabEmpty')}</p>`; return; }
  pane.innerHTML = `<div style="display:flex;gap:8px;margin-bottom:8px"><button id="exportBtn">${t('export')}</button><span class="hint" style="align-self:center">${t('count')(vocab.length)}</span></div>` +
    vocab.map((v, i) => `<div class="vocab-item"><div><div class="w" dir="auto">${esc(v.word)}</div><div dir="auto">${esc(v.translation)}</div><div class="hint" style="font-size:12px">${esc(v.book)}</div></div><button class="x" data-i="${i}" title="${t('remove')}">✕</button></div>`).join('');
  $('#exportBtn').onclick = exportCsv;
  pane.querySelectorAll('.x').forEach(b => b.onclick = () => { vocab.splice(+b.dataset.i, 1); store.set('vocab', vocab); renderVocab(); });
}

function exportCsv() {
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = vocab.map(v => [v.word, `${v.translation} — ${v.explanation}`, v.sentence, v.book].map(q).join(','));
  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'glint-vocab.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- UI ----------
function showTab(name) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $('#lookup').hidden = name !== 'lookup';
  $('#vocab').hidden = name !== 'vocab';
  if (name === 'vocab') renderVocab();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

const form = $('#settingsForm');
function syncProviderFields() {
  form.querySelector('[data-for="openai"]').hidden = form.provider.value !== 'openai';
  form.model.placeholder = DEFAULT_MODELS[form.provider.value] || t('autoModel');
}
function openSettings() {
  for (const k of ['provider', 'baseUrl', 'apiKey', 'model']) form[k].value = settings[k] || '';
  syncProviderFields();
  $('#settings').showModal();
}
form.provider.onchange = () => { form.model.value = ''; syncProviderFields(); };
$('#settings').addEventListener('close', () => {
  if ($('#settings').returnValue !== 'save') return;
  for (const k of ['provider', 'baseUrl', 'apiKey', 'model']) settings[k] = form[k].value.trim();
  store.set('settings', settings);
});
$('#settingsBtn').onclick = openSettings;

function applyUiLanguage() {
  document.documentElement.lang = settings.lang;
  document.documentElement.dir = LANGS[settings.lang].dir;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = t(el.dataset.i18n));
  showBookLang();
  if (!$('#vocab').hidden) renderVocab();
}

const target = $('#target');
target.value = settings.lang;
target.onchange = () => {
  settings.lang = target.value;
  store.set('settings', settings);
  applyUiLanguage();
  if (lastLookup) lookup(lastLookup.word, lastLookup.sentence); // show the open word in the new language
};
applyUiLanguage();
</script>
