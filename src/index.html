}

// ---------- EPUB ----------
// An EPUB is a zip of XHTML chapters. Each chapter becomes one long "page" of real text, and a small
// adapter makes the book look like a PDF.js document to the rest of the app (pages, text, outline).
const EPUB_BLOCKS = 'p,li,h1,h2,h3,h4,h5,h6,blockquote,td,th,dd,dt,figcaption,pre,div,section';
const IMAGE_TYPES = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' };
// Books are untrusted: only plain reading elements survive, never scripts, styles, forms or embeds.
const EPUB_ALLOWED = new Set(('p br hr h1 h2 h3 h4 h5 h6 blockquote ul ol li dl dt dd em i strong b u s sub sup small span a img '
  + 'figure figcaption table thead tbody tfoot tr td th pre code div section article aside header footer cite q abbr ruby rt rp').split(' '));
const EPUB_DROP = new Set(['script', 'style', 'iframe', 'object', 'embed', 'form', 'input', 'button', 'select', 'textarea', 'link',
  'meta', 'title', 'head', 'audio', 'video', 'canvas', 'math', 'template', 'noscript']);
let epubUrls = []; // picture URLs, freed when another book opens

// 'OEBPS/text/ch1.xhtml' + '../images/a.png' → 'OEBPS/images/a.png'
function resolvePath(base, rel) {
  const parts = base.split('/').slice(0, -1);
  for (const seg of rel.split('/')) {
    if (seg === '..') parts.pop();
    else if (seg && seg !== '.') parts.push(seg);
  }
  return parts.join('/');
}

const epubTarget = (base, href) => {
  const [path, frag] = href.split('#');
  return (path ? resolvePath(base, decodeURIComponent(path)) : base) + (frag ? '#' + frag : '');
};

function parseMarkup(text, type) {
  const doc = new DOMParser().parseFromString(text, type);
  // Some books ship slightly broken XHTML; the forgiving HTML parser still reads them.
  return doc.querySelector('parsererror') ? new DOMParser().parseFromString(text, 'text/html') : doc;
}

async function openEpub(data, name) {
  const files = fflate.unzipSync(data);
  const read = path => files[path] ? new TextDecoder().decode(files[path]) : '';
  const opfPath = parseMarkup(read('META-INF/container.xml'), 'application/xml').querySelector('rootfile').getAttribute('full-path');
  const opf = parseMarkup(read(opfPath), 'application/xml');
  const manifest = {};
  for (const item of opf.querySelectorAll('manifest > item')) {
    manifest[item.getAttribute('id')] = {
      href: resolvePath(opfPath, decodeURIComponent(item.getAttribute('href'))),
      type: item.getAttribute('media-type') || '',
      props: item.getAttribute('properties') || '',
    };
  }
  const spine = [...opf.querySelectorAll('spine > itemref')].map(r => manifest[r.getAttribute('idref')]).filter(m => m && /html/.test(m.type));

  epubUrls.forEach(URL.revokeObjectURL);
  epubUrls = [];
  const urls = {};
  const urlFor = path => {
    if (!urls[path] && files[path]) {
      const type = IMAGE_TYPES[path.split('.').pop().toLowerCase()] || 'application/octet-stream';
      epubUrls.push(urls[path] = URL.createObjectURL(new Blob([files[path]], { type })));
    }
    return urls[path] || '';
  };

  const chapters = spine.map((item, i) => {
    const doc = parseMarkup(read(item.href), item.type === 'text/html' ? 'text/html' : 'application/xhtml+xml');
    const section = document.createElement('section');
    section.className = 'page epub-chapter';
    section.dataset.page = i + 1;
    section.dataset.path = item.href;
    section.dir = 'auto';
    const lang = doc.documentElement.getAttribute('lang') || doc.documentElement.getAttribute('xml:lang');
    if (lang) section.lang = lang;
    cleanInto(doc.body || doc.documentElement, section, item.href, urlFor);
    return section;
  });

  const doc = {
    numPages: chapters.length,
    getPage: async n => ({ getTextContent: async () => ({ items: [{ str: chapters[n - 1].textContent }] }) }),
    getOutline: async () => epubOutline(read, manifest, opf),
  };
  pdfDoc = doc;
  bookType = 'epub';
  bookName = name;
  const title = opf.getElementsByTagNameNS('*', 'title')[0]?.textContent.trim();
  $('#bookTitle').textContent = title || name.replace(/\.epub$/i, '');
  $('#bookTitle').title = name;
  zoom = 1;
  viewer.style.setProperty('--epub-zoom', 1);
  viewer.replaceChildren(...chapters);
  chapters.forEach(markKnownInEpub);
  await finishOpening(doc, name);
}

// Copies only safe reading elements and attributes. Pictures become local blob URLs; links become
// in-book jumps (data-href) or web links (data-url) that the click handler decides what to do with.
function cleanInto(src, dest, base, urlFor) {
  for (const node of src.childNodes) {
    if (node.nodeType === Node.TEXT_NODE) { dest.append(node.textContent); continue; }
    if (node.nodeType !== Node.ELEMENT_NODE) continue;
    const tag = node.localName.toLowerCase();
    if (EPUB_DROP.has(tag)) continue;
    if (tag === 'svg') {
      // Covers are often an <image> inside an <svg>: keep just the picture.
      const image = node.querySelector('image');
      const href = image && (image.getAttribute('href') || image.getAttributeNS('http://www.w3.org/1999/xlink', 'href'));
      if (href && !/^[a-z]+:/i.test(href)) {
        const img = document.createElement('img');
        img.src = urlFor(resolvePath(base, decodeURIComponent(href)));
        dest.append(img);
      }
      continue;
    }
    if (!EPUB_ALLOWED.has(tag)) { cleanInto(node, dest, base, urlFor); continue; } // unknown wrapper: keep its text
    const el = document.createElement(tag);
    if (node.getAttribute('id')) el.id = 'e-' + node.getAttribute('id'); // prefixed so a book can't clash with the app's own ids
    for (const a of ['lang', 'dir', 'colspan', 'rowspan', 'alt', 'title']) {
      if (node.getAttribute(a)) el.setAttribute(a, node.getAttribute(a));
    }
    if (tag === 'img') {
      const imgSrc = node.getAttribute('src');
      if (!imgSrc || /^[a-z]+:/i.test(imgSrc)) continue; // nothing loads from the internet
      el.src = urlFor(resolvePath(base, decodeURIComponent(imgSrc)));
    }
    if (tag === 'a') {
      const href = node.getAttribute('href') || '';
      if (/^https?:\/\//i.test(href)) el.dataset.url = href;
      else if (href && !/^[a-z]+:/i.test(href)) el.dataset.href = epubTarget(base, href);
    }
    cleanInto(node, el, base, urlFor);
    dest.append(el);
  }
}

// The book's contents: the EPUB 3 navigation document, or the older EPUB 2 NCX file.
function epubOutline(read, manifest, opf) {
  const kids = (el, name) => [...el.children].filter(c => c.localName === name);
  const label = el => el.textContent.trim().replace(/\s+/g, ' ');
  const nav = Object.values(manifest).find(m => m.props.split(/\s+/).includes('nav'));
  if (nav) {
    const doc = parseMarkup(read(nav.href), 'application/xhtml+xml');
    const navs = [...doc.getElementsByTagName('nav')];
    const toc = navs.find(n => /toc/.test(n.getAttribute('epub:type') || n.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || '')) || navs[0];
    const walk = ol => kids(ol, 'li').map(li => {
      const a = kids(li, 'a')[0] || kids(li, 'span')[0];
      const href = a?.getAttribute('href');
      const sub = kids(li, 'ol')[0];
      return { title: a ? label(a) : '', dest: href ? { epub: epubTarget(nav.href, href) } : null, items: sub ? walk(sub) : [] };
    });
    const list = toc && kids(toc, 'ol')[0];
    if (list) return walk(list);
  }
  const ncxId = opf.querySelector('spine')?.getAttribute('toc');
  const ncx = (ncxId && manifest[ncxId]) || Object.values(manifest).find(m => m.type === 'application/x-dtbncx+xml');
  if (ncx) {
    const doc = parseMarkup(read(ncx.href), 'application/xml');
    const walk = parent => kids(parent, 'navPoint').map(np => {
      const src = kids(np, 'content')[0]?.getAttribute('src');
      return { title: label(kids(np, 'navLabel')[0] || np), dest: src ? { epub: epubTarget(ncx.href, src) } : null, items: walk(np) };
    });
    const map = doc.getElementsByTagName('navMap')[0];
    if (map) return walk(map);
  }
  return [];
}

function epubGoTo(target, remember = true) {
  const [path, frag] = target.split('#');
  const section = [...viewer.children].find(c => c.dataset.path === path);
  if (!section) return;
  const el = (frag && section.querySelector(`[id="e-${CSS.escape(frag)}"]`)) || section;
  if (remember) {
    backTo = viewer.scrollTop;
    $('#backBtn').hidden = false;
  }
  viewer.scrollTop += el.getBoundingClientRect().top - viewer.getBoundingClientRect().top - 24;
}

function zoomEpub(z) {
  const n = currentPage(), div = viewer.querySelector(`.page[data-page="${n}"]`);
  const frac = (viewer.scrollTop + 24 - div.offsetTop) / div.offsetHeight;
  zoom = z;
  viewer.style.setProperty('--epub-zoom', zoom);
  viewer.scrollTop = div.offsetTop - 24 + frac * div.offsetHeight; // stay at the same place in the chapter
  updateZoomLabel();
}

// Same rules as on PDF pages: links are followed, a selection is translated, a click translates the word.
function clickEpub(e, sel, selected) {
  if (selected) {
    const node = sel.anchorNode, block = (node?.nodeType === 3 ? node.parentElement : node)?.closest(EPUB_BLOCKS);
    if (block && askMode) openAsk(selected);
    return; // the selection bar offers meaning, ask, highlight and note
  }
  const a = e.target.closest('a[data-href], a[data-url]');
  if (a) {
    if (a.dataset.href) epubGoTo(a.dataset.href);
    else openLink(a.dataset.url);
    return;
  }
  const pos = caretAt(e.clientX, e.clientY);
  if (!pos || pos.node.nodeType !== 3) return;
  const block = pos.node.parentElement.closest(EPUB_BLOCKS);
  if (!block) return;
  const text = block.textContent, at = offsetIn(block, pos.node, pos.offset);
  let start = at, end = at;
  while (start > 0 && isWordChar(text[start - 1])) start--;
  while (end < text.length && isWordChar(text[end])) end++;
  const word = text.slice(start, end).replace(/^['’-]+|['’-]+$/g, '');
  if (word && /\p{L}/u.test(word)) askMode ? openAsk(cutSentence(text, start)) : lookup(word, cutSentence(text, start));
}

function markKnownInEpub(section) {
  for (const m of section.querySelectorAll('mark.known')) m.replaceWith(m.textContent);
  section.normalize();
  if (!knownRe) return;
  const walker = document.createTreeWalker(section, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.textContent, matches = knownMatches(text);
    if (!matches.length) continue;
    const parts = [];
    let last = 0;
    for (const m of matches) {
      parts.push(text.slice(last, m.index));
      const mark = document.createElement('mark');
      mark.className = 'known';
      mark.textContent = m.word;
      parts.push(mark);
      last = m.index + m.word.length;
    }
    parts.push(text.slice(last));
    node.replaceWith(...parts);
  }
}

function highlightEpub(section) {
  for (const b of section.querySelectorAll('.hit')) b.classList.remove('hit');
  if (!search.query) return;
  for (const b of section.querySelectorAll('p,li,h1,h2,h3,h4,h5,h6,blockquote,td,dd,pre,figcaption')) {
    if (normText(b.textContent).includes(search.query)) b.classList.add('hit');
  }
}

// ---------- Contents ----------
// The contents as a tree: levels, the page each entry starts on, and where the reader is now.
let tocItems = []; // { title, dest, depth, parent, page } in reading order

async function loadToc(doc) {
  const pane = $('#toc');
  tocItems = [];
  const outline = await doc.getOutline();
  if (pdfDoc !== doc) return;
  if (!outline?.length) { pane.innerHTML = stateCard('list', t('noToc')); return; }
  const items = [];
  const collect = (list, depth, parent) => list.forEach(it => {
    items.push({ title: it.title, dest: it.dest, depth, parent, page: null });
    if (it.items?.length && depth < 3) collect(it.items, depth + 1, items.length - 1);
  });
  collect(outline, 0, -1);
  await Promise.all(items.map(async x => { x.page = await destPage(doc, x.dest); }));
  if (pdfDoc !== doc) return;
  tocItems = items;
  const kids = i => items.flatMap((x, j) => x.parent === i ? [j] : []);
  const many = items.length > 25; // long contents start folded, except around the reader
  const showPages = bookType !== 'epub'; // EPUB "pages" are chapters, not page numbers
  const build = parent => kids(parent).map(i => {
    const x = items[i], sub = kids(i);
    return `<li data-i="${i}" class="${sub.length && many ? 'closed' : ''}">
      <div class="toc-row">
        <button class="toc-fold${sub.length ? '' : ' none'}" data-fold="${i}" tabindex="${sub.length ? 0 : -1}" aria-label="${esc(x.title)}">${icon('chevDown')}</button>
        <button class="toc-go" data-toc="${i}"><span class="t">${esc(x.title)}</span>${showPages && x.page ? `<span class="p">${x.page}</span>` : ''}</button>
      </div>${sub.length ? `<ul>${build(i)}</ul>` : ''}</li>`;
  }).join('');
  // Lay it out in the direction of the book's own headings.
  const rtlChars = (items.map(x => x.title).join('').match(/[\u0590-\u08FF]/g) || []).length;
  const dir = rtlChars * 2 > items.map(x => x.title).join('').replace(/\s/g, '').length ? 'rtl' : 'ltr';
  pane.innerHTML = `<header class="toc-head" dir="auto"><b>${esc(bookName.replace(/\.(pdf|epub)$/i, ''))}</b><small dir="${LANGS[settings.uiLang].dir}">${t('tocCount')(kids(-1).length)}</small></header>
    <ul class="toc" dir="${dir}">${build(-1)}</ul>`;
  pane.onclick = e => {
    const fold = e.target.closest('[data-fold]');
    if (fold) { fold.closest('li').classList.toggle('closed'); return; }
    const b = e.target.closest('[data-toc]');
    if (b && items[+b.dataset.toc].dest) goToDest(items[+b.dataset.toc].dest, false);
  };
  markTocCurrent(true);
}

// Highlights the entry the reader is in (the last one starting at or before this page) and opens its branch.
let tocCurrent = -1;
function markTocCurrent(scroll = false) {
  if (!tocItems.length) return;
  const page = currentPage();
  let at = -1;
  tocItems.forEach((x, i) => { if (x.page && x.page <= page && (at < 0 || x.page >= tocItems[at].page)) at = i; });
  if (at === tocCurrent && !scroll) return;
  tocCurrent = at;
  const pane = $('#toc');
  pane.querySelectorAll('li.current').forEach(li => li.classList.remove('current'));
  const li = pane.querySelector(`li[data-i="${at}"]`);
  if (!li) return;
  li.classList.add('current');
  for (let p = li.parentElement.closest('li'); p; p = p.parentElement.closest('li')) p.classList.remove('closed');
  if (scroll && !pane.hidden) li.scrollIntoView({ block: 'center' });
}

// ---------- Search ----------
const search = { query: '', pages: [], shown: 0, token: 0 };
const pageTexts = new Map(); // page number → lower-cased text
const normText = s => s.toLocaleLowerCase().replace(/\s+/g, ' ');

async function pageText(doc, n) {
  if (!pageTexts.has(n)) {
    const ocr = ocrCache.get(n);
    const text = ocr ? ocr.flat().map(w => w.text).join(' ')
      : (await (await doc.getPage(n)).getTextContent()).items.map(it => it.str).join(' ');
    pageTexts.set(n, normText(text));
  }
  return pageTexts.get(n);
}

function openSearch() {
  $('#searchBar').hidden = false;
  $('#searchInput').focus();
  $('#searchInput').select();
}

function closeSearch() {
  $('#searchBar').hidden = true;
  $('#searchInput').value = '';
  search.token++;
  search.query = '';
  search.pages = [];
  viewer.querySelectorAll('.page').forEach(highlightSearch);
  $('#searchCount').textContent = '';
}

// Searches every page, starting from the one on screen; the first hit is shown as soon as it's found.
async function runSearch(q) {
  const token = ++search.token, doc = pdfDoc;
  search.query = normText(q.trim());
  search.pages = [];
  search.shown = 0;
  viewer.querySelectorAll('.page').forEach(highlightSearch);
  if (!search.query || !doc) { updateSearchCount(false); return; }
  updateSearchCount(true);
  const start = currentPage();
  for (let i = 0; i < doc.numPages; i++) {
    const n = (start - 1 + i) % doc.numPages + 1;
    const text = await pageText(doc, n);
    if (token !== search.token) return;
    if (!text.includes(search.query)) continue;
    search.pages.splice(search.pages.findIndex(p => p > n) >>> 0, 0, n); // keep in page order
    if (!search.shown) showSearchResult(n);
    updateSearchCount(true);
  }
  updateSearchCount(false);
}

function showSearchResult(n) {
  search.shown = n;
  goToPage(n);
  viewer.querySelectorAll('.page').forEach(highlightSearch);
  // A chapter is long: bring the first matching paragraph into view.
  const hit = bookType === 'epub' && viewer.querySelector(`.page[data-page="${n}"] .hit`);
  if (hit) viewer.scrollTop += hit.getBoundingClientRect().top - viewer.getBoundingClientRect().top - 80;
}

function stepSearch(dir) {
  if (!search.pages.length) return;
  const i = search.pages.indexOf(search.shown);
  showSearchResult(search.pages[(i + dir + search.pages.length) % search.pages.length]);
  updateSearchCount(false);
}

function updateSearchCount(busy) {
  const n = search.pages.length;
  $('#searchCount').textContent = !search.query ? '' : n ? `${search.pages.indexOf(search.shown) + 1} / ${n}${busy ? '…' : ''}` : busy ? t('searching') : t('searchNone');
}

function highlightSearch(div) {
  if (div.classList.contains('epub-chapter')) { highlightEpub(div); return; }
  for (const span of div.querySelectorAll('.textLayer > span')) {
    span.classList.toggle('hit', !!search.query && normText(span.textContent).includes(search.query));
  }
}

let searchTimer;
$('#searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(e.target.value), 300);
});
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); stepSearch(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') closeSearch();
});
$('#searchBtn').onclick = openSearch;
$('#searchPrev').onclick = () => stepSearch(-1);
$('#searchNext').onclick = () => stepSearch(1);
$('#searchClose').onclick = closeSearch;

// ---------- Words looked up before, underlined in the book ----------
let knownRe = null;
// Older Safari engines (macOS before 13.3) cannot read look-behind, so the letter before a word is captured instead.
const knownMatches = text => [...text.matchAll(knownRe)].map(m => ({ index: m.index + m[1].length, word: m[2] }));
function refreshKnown() {
  const words = [...new Set(vocab.map(v => v.word.toLowerCase()).filter(w => /^[\p{L}\p{M}'’-]+$/u.test(w)))];
  knownRe = words.length
    ? new RegExp(`(^|[^\\p{L}\\p{M}])(${words.sort((a, b) => b.length - a.length).map(escRe).join('|')})(?![\\p{L}\\p{M}])`, 'giu')
    : null;
  viewer.querySelectorAll('.textLayer').forEach(markKnownWords);
  viewer.querySelectorAll('.epub-chapter').forEach(markKnownInEpub);
}

function markKnownWords(layer) {
  for (const span of layer.querySelectorAll(':scope > span')) {
    if (span.querySelector('mark')) span.textContent = span.textContent; // back to plain text first
    if (!knownRe) continue;
    const text = span.textContent, matches = knownMatches(text);
    if (!matches.length) continue;
    const parts = [];
    let last = 0;
    for (const m of matches) {
      parts.push(text.slice(last, m.index));
      const mark = document.createElement('mark');
      mark.className = 'known';
      mark.textContent = m.word;
      parts.push(mark);
      last = m.index + m.word.length;
    }
    parts.push(text.slice(last));
    span.replaceChildren(...parts);
  }
}

// ---------- Flashcards ----------
// Spaced repetition: each time you know a word it comes back later (1, 3, 7, 16, then 35 days).
const DAY = 864e5, INTERVALS = [0, 1, 3, 7, 16, 35];
const dueWords = () => vocab.filter(v => (v.due || 0) <= Date.now());
let reviewQueue = null;

function startReview() {
  reviewQueue = dueWords().filter(v => vocabPair === 'all' || pairOf(v) === vocabPair).sort((a, b) => (a.due || 0) - (b.due || 0));
  showCard(false);
}

function showCard(revealed) {
  const pane = $('#vocab');
  if (!reviewQueue.length) {
    pane.innerHTML = stateCard('check', t(vocab.some(v => v.box) ? 'reviewDone' : 'nothingDue'), `<button class="btn" id="listBtn">${t('backToList')}</button>`);
    $('#listBtn').onclick = endReview;
    return;
  }
  const v = reviewQueue[0], d = `dir="${LANGS[settings.lang].dir}"`;
  pane.innerHTML = `
    <div class="review">
      <div class="review-top"><span>${t('left')(reviewQueue.length)}</span><button class="btn small" id="listBtn">${t('backToList')}</button></div>
      <div class="rcard${revealed ? ' on' : ''}" id="rcard">
        <div class="rcard-in">
          <div class="card face">
            ${wordHead(v.word)}
            ${v.sentence ? `<blockquote class="sentence" dir="auto">${markWord(v.sentence, v.word)}</blockquote>` : ''}
          </div>
          <div class="card face back">
            ${wordHead(v.word)}
            <div class="answer"><p class="tr" ${d}>${esc(v.translation)}</p><p class="explain" ${d}>${esc(v.explanation || '')}</p></div>
          </div>
        </div>
      </div>
      <div id="reviewBtns"></div>
    </div>`;
  $('#listBtn').onclick = endReview;
  // The answer is on the back of the card: revealing turns it over.
  const showButtons = on => {
    $('#reviewBtns').innerHTML = on
      ? `<div class="review-actions"><button class="btn again" id="againBtn">${t('again')}</button><button class="btn primary" id="goodBtn">${t('good')}</button></div>`
      : `<button class="btn primary lg" id="revealBtn">${t('reveal')}</button>`;
    if (on) { $('#againBtn').onclick = () => grade(false); $('#goodBtn').onclick = () => grade(true); }
    else $('#revealBtn').onclick = reveal;
  };
  const reveal = () => { $('#rcard').classList.add('on'); showButtons(true); };
  $('#rcard').onclick = e => { if (!e.target.closest('[data-say]') && !$('#rcard').classList.contains('on')) reveal(); };
  showButtons(revealed);
}

function grade(knew) {
  const v = reviewQueue.shift();
  v.box = knew ? Math.min((v.box || 0) + 1, INTERVALS.length - 1) : 0;
  v.due = Date.now() + INTERVALS[v.box] * DAY;
  if (!knew) reviewQueue.push(v); // comes back later in this session
  store.set('vocab', vocab);
  showCard(false);
}

function endReview() {
  reviewQueue = null;
  renderVocab();
}

// ---------- Scanned pages (OCR) ----------
const ocrCache = new Map(); // page number → lines of words, positioned in page units (scale 1)
let ocrWorker = null, ocrChain = Promise.resolve();

function ocrWorkerReady() {
  ocrWorker ??= Tesseract.createWorker(['eng', 'ara', 'tur'], 1, {
    workerPath: 'vendor/tesseract/worker.min.js',
    corePath: 'vendor/tesseract/core',
    langPath: 'vendor/tesseract/lang',
    gzip: true,
    cacheMethod: 'none',
    workerBlobURL: false,
  });
  return ocrWorker;
}

async function imageCoverage(page) {
  const vp = page.getViewport({ scale: 1 });
  const area = (await imageBoxes(page, vp, 1)).reduce((sum, [, , w, h]) => sum + w * h, 0);
  return area / (vp.width * vp.height);
}

// Pages are read one at a time, in the order they come into view.
function queueOcr(div, canvas, layer) {
  const n = +div.dataset.page;
  if (ocrCache.has(n)) { buildOcrLayer(layer, ocrCache.get(n), scale); return; }
  const badge = document.createElement('div');
  badge.className = 'ocr-badge';
  badge.textContent = t('ocrRunning');
  div.appendChild(badge);
  ocrChain = ocrChain.then(async () => {
    try {
      if (!canvas.isConnected) return; // zoomed or scrolled away: read again when it's drawn again
      const worker = await ocrWorkerReady();
      const { data } = await worker.recognize(canvas, {}, { blocks: true, text: true });
      const k = canvas.width / +div.dataset.w; // canvas pixels per page unit
      const lines = [];
      for (const block of data.blocks || []) for (const para of block.paragraphs) for (const line of para.lines) {
        const words = line.words
          // Unsure guesses are usually bits of pictures; the engine also adds invisible direction marks.
          .filter(w => w.confidence > 55)
          .map(w => ({ ...w, text: w.text.replace(/[\u200e\u200f\u202a-\u202e]/g, '').trim() }))
          .filter(w => /[\p{L}\p{N}]/u.test(w.text))
          .map(w => ({ text: w.text, x: w.bbox.x0 / k, y: w.bbox.y0 / k, w: (w.bbox.x1 - w.bbox.x0) / k, h: (w.bbox.y1 - w.bbox.y0) / k }));
        // Reading order: right to left for Arabic lines.
        const rtl = /[؀-ۿ]/.test(words.map(w => w.text).join(''));
        words.sort((a, b) => rtl ? b.x - a.x : a.x - b.x);
        if (words.length) lines.push(words);
      }
      ocrCache.set(n, lines);
      queueBookShare(8000);
      pageTexts.delete(n);
      if (!bookLang) {
        bookLang = detectLanguage(lines.flat().map(w => w.text).join(' '));
        showBookLang();
      }
      if (layer.isConnected) buildOcrLayer(layer, lines, scale);
    } catch (err) {
      console.error('OCR failed', err);
    } finally {
      badge.remove();
    }
  });
}

// Invisible, clickable words placed over the picture, like the text layer of a normal page.
function buildOcrLayer(layer, lines, s) {
  layer.replaceChildren();
  const placed = [];
  for (const words of lines) {
    words.forEach((w, i) => {
      const span = document.createElement('span');
      span.textContent = w.text + (i < words.length - 1 ? ' ' : '');
      Object.assign(span.style, { left: w.x * s + 'px', top: w.y * s + 'px', fontSize: w.h * s * 0.9 + 'px', fontFamily: 'sans-serif' });
      layer.appendChild(span);
      placed.push([span, w.w * s]);
    });
    layer.appendChild(document.createElement('br'));
  }
  for (const [span, width] of placed) {
    const natural = span.getBoundingClientRect().width;
    if (natural) span.style.transform = `scaleX(${width / natural})`;
  }
  markKnownWords(layer);
  highlightSearch(layer.parentElement);
}

// ---------- Toast ----------

// ---------- AI apps (MCP) ----------
// With "Connect to AI apps" on, Claude Desktop and similar apps can read the open page and My words
// through `siyaq --mcp` (src-tauri/src/mcp.rs), and add words. Nothing is shared while it is off.
let shareTimer = null;
function queueShare() {
  if (!tauri || !settings.mcp) return;
  clearTimeout(shareTimer);
  shareTimer = setTimeout(shareState, 800);
}

// A page's text as it reads: scanned pages from OCR, broken lines and hyphenated words joined.
async function readablePageText(doc, n) {
  const ocr = ocrCache.get(n);
  if (ocr) return ocr.map(line => line.map(w => w.text).join(' ')).join(' ');
  try {
    const items = (await (await doc.getPage(n)).getTextContent()).items;
    return itemsToText(items).replace(/-\n(?=\p{Ll})/gu, '').replace(/\s*\n\s*/g, ' ').replace(/ {2,}/g, ' ').trim();
  } catch { return ''; }
}

// The whole open book for AI apps, so they can read any chapter, search it, or summarise it.
let bookShare = { token: 0, timer: null };
function queueBookShare(delay = 1500) {
  if (!tauri || !settings.mcp) return;
  clearTimeout(bookShare.timer);
  bookShare.timer = setTimeout(shareBook, delay);
}

async function shareBook() {
  const doc = pdfDoc, token = ++bookShare.token;
  if (!doc) return;
  const text = [];
  for (let n = 1; n <= doc.numPages; n++) {
    text.push(await readablePageText(doc, n));
    if (n % 20 === 0) {
      await new Promise(res => setTimeout(res)); // stay responsive on long books
      if (token !== bookShare.token || pdfDoc !== doc) return;
    }
  }
  const book = { title: bookName.replace(/\.(pdf|epub)$/i, ''), format: bookType, language: LANGS[bookLang]?.english || null,
    pages: doc.numPages, contents: await bookContents(doc), text };
  if (token === bookShare.token && pdfDoc === doc) tauri.core.invoke('mcp_share_book', { book }).catch(() => {});
}

// The table of contents, flattened, with the page each entry starts on.
async function bookContents(doc) {
  const out = [];
  const walk = async (list, depth) => {
    for (const it of list) {
      out.push({ title: it.title, depth, page: await destPage(doc, it.dest) });
      if (it.items?.length && depth < 3) await walk(it.items, depth + 1);
    }
  };
  await walk((await doc.getOutline().catch(() => null)) || [], 0);
  return out;
}

async function destPage(doc, dest) {
  try {
    if (dest?.epub) {
      const section = [...viewer.children].find(c => c.dataset.path === dest.epub.split('#')[0]);
      return section ? +section.dataset.page : null;
    }
    const explicit = typeof dest === 'string' ? await doc.getDestination(dest) : dest;
    if (!Array.isArray(explicit)) return null;
    return (typeof explicit[0] === 'object' ? await doc.getPageIndex(explicit[0]) : explicit[0]) + 1;
  } catch { return null; }
}

async function shareState() {
  let book = null;
  if (pdfDoc) {
    const page = currentPage(), text = [];
    for (let n = page; n <= Math.min(page + 2, pdfDoc.numPages); n++) text.push({ page: n, text: await readablePageText(pdfDoc, n) });
    book = { title: bookName.replace(/\.(pdf|epub)$/i, ''), format: bookType, page, pages: pdfDoc.numPages, language: LANGS[bookLang]?.english || null, text };
  }
  const words = vocab.map(v => ({ word: v.word, translation: v.translation, explanation: v.explanation, sentence: v.sentence,
    book: v.book, date: v.date, saved: Date.parse(v.date) || 0, box: v.box || 0, due: v.due || 0 }));
  tauri.core.invoke('mcp_share', { state: { lang: LANGS[settings.lang].english, book, words } }).catch(() => {});
}

function setSharing(on) {

}

// Kept per book. On a PDF a highlight is a set of boxes in page fractions, so it survives zooming; on an EPUB,
// whose text reflows, it is a stretch of a chapter's text by character positions.
let highlights = store.get('highlights', {}); // bookKey → [{ id, color, note, text, date, parts: [{ page, rects }] | chapter, start, end }]
const bookHighlights = () => highlights[bookKey] || [];
function saveHighlights(list) {
  highlights[bookKey] = list;
  if (!list.length) delete highlights[bookKey];

// The selection bar: meaning, ask, highlight, note.
let barSelection = null; // { text, range } of the selection the bar is for
function selectionInBook() {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0), node = range.commonAncestorContainer;
  const el = node.nodeType === 3 ? node.parentElement : node;
  if (!el?.closest('#viewer') || !el.closest('.page, .textLayer, .epub-chapter') && !el.matches('#viewer')) return null;
  const text = el.closest('.epub-chapter') ? sel.toString().replace(/\s+/g, ' ').trim() : selectedText(sel);
  return text ? { text, range: range.cloneRange() } : null;
}
function showSelBar() {
  const s = selectionInBook(), bar = $('#selBar');
  if (!s || askMode) { bar.hidden = true; barSelection = null; return; }
  barSelection = s;
  const r = s.range.getBoundingClientRect();
  bar.hidden = false;
  const w = bar.offsetWidth, h = bar.offsetHeight;
  bar.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  bar.style.top = (r.top - h - 10 > 60 ? r.top - h - 10 : r.bottom + 10) + 'px';
}
viewer.addEventListener('mouseup', () => setTimeout(showSelBar, 0));
viewer.addEventListener('scroll', () => { $('#selBar').hidden = true; }, { passive: true });
document.addEventListener('mousedown', e => { if (!e.target.closest('#selBar')) $('#selBar').hidden = true; });

$('#selBar').addEventListener('mousedown', e => e.preventDefault()); // keep the selection while clicking the bar
$('#selBar').onclick = e => {
  const b = e.target.closest('[data-act]');
  if (!b || !barSelection) return;
  const { text, range } = barSelection;
  $('#selBar').hidden = true;
  if (b.dataset.act === 'meaning') lookup(text, sentenceForRange(range) || text);
  else if (b.dataset.act === 'ask') openAsk(text);
  else {
    const h = addHighlight(range, text, b.dataset.color || 'yellow');
    if (h && b.dataset.act === 'note') openHighlight(h.id);
  }
  window.getSelection().removeAllRanges();
};

// The sentence around the start of a selection, as for a clicked word.
function sentenceForRange(range) {
  const node = range.startContainer, el = node.nodeType === 3 ? node.parentElement : node;
  const span = el?.closest('.textLayer > span');
  if (span) return sentenceAround(span, node.nodeType === 3 ? offsetIn(span, node, range.startOffset) : 0);
  const block = el?.closest(EPUB_BLOCKS);
  return block ? cutSentence(block.textContent, node.nodeType === 3 ? offsetIn(block, node, range.startOffset) : 0) : '';
}

function addHighlight(range, text, color) {
  const h = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), color, note: '', text, date: new Date().toISOString() };
  const startEl = range.startContainer.nodeType === 3 ? range.startContainer.parentElement : range.startContainer;
  const chapter = startEl.closest('.epub-chapter');
  if (chapter) {
    h.chapter = +chapter.dataset.page;
    h.start = offsetIn(chapter, range.startContainer, range.startOffset);
    h.end = chapter.contains(range.endContainer) ? offsetIn(chapter, range.endContainer, range.endOffset) : chapter.textContent.length;
  } else {
    const byPage = new Map();
    for (const rect of range.getClientRects()) {
      if (rect.width < 1 || rect.height < 1) continue;
      const page = document.elementsFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2).map(el => el.closest('.page')).find(Boolean);
      if (!page) continue;
      const pr = page.getBoundingClientRect(), n = +page.dataset.page;
      if (!byPage.has(n)) byPage.set(n, []);
      byPage.get(n).push([(rect.left - pr.left) / pr.width, (rect.top - pr.top) / pr.height, rect.width / pr.width, rect.height / pr.height].map(v => +v.toFixed(5)));
    }
    h.parts = [...byPage].map(([page, rects]) => ({ page, rects: mergeRects(rects) }));
    if (!h.parts.length) return null;
  }
  saveHighlights([...bookHighlights(), h]);
  drawHighlights();
  return h;
}

// Text layers give a box per piece of text; join neighbours on the same line into one.
function mergeRects(rects) {
  rects.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  const out = [];
  for (const r of rects) {
    const last = out[out.length - 1];
    if (last && Math.abs(last[1] - r[1]) < last[3] * 0.5 && r[0] <= last[0] + last[2] + 0.01) {
      const right = Math.max(last[0] + last[2], r[0] + r[2]);
      last[0] = Math.min(last[0], r[0]); last[2] = right - last[0]; last[3] = Math.max(last[3], r[3]);
    } else out.push([...r]);
  }
  return out;
}

const pin = h => `<button class="hl-pin c-${h.color}" data-hl="${h.id}" title="${esc(h.note || t('addNote'))}">${h.note ? icon('note') : ''}</button>`;

// Draws the open book's highlights: on PDF pages that are drawn, and in EPUB chapters.
function drawHighlights() {
  if (!pdfDoc) return;
  const list = bookHighlights();
  if (bookType === 'epub') {
    viewer.querySelectorAll('.epub-chapter mark.hl').forEach(m => m.replaceWith(...m.childNodes));
    viewer.querySelectorAll('.epub-chapter .hl-pin').forEach(p => p.remove());
    viewer.querySelectorAll('.epub-chapter').forEach(ch => ch.normalize());
    for (const h of list) markEpubHighlight(h);
    return;
  }
  viewer.querySelectorAll('.page[data-rendered]').forEach(div => drawPageHighlights(div, list));
}

function drawPageHighlights(div, list = bookHighlights()) {
  div.querySelector('.hl-layer')?.remove();
  const n = +div.dataset.page, here = list.flatMap(h => (h.parts || []).filter(p => p.page === n).map(p => [h, p]));
  if (!here.length) return;
  const layer = document.createElement('div');
  layer.className = 'hl-layer';
  const pct = v => (v * 100).toFixed(3) + '%';
  layer.innerHTML = here.map(([h, p]) => p.rects.map(([x, y, w, ht]) => `<div class="hl-box hl-${h.color}" style="left:${pct(x)};top:${pct(y)};width:${pct(w)};height:${pct(ht)}"></div>`).join('')
    + (h.parts[0] === p ? (() => { const [x, y, w] = p.rects[p.rects.length - 1]; return pin(h).replace('<button', `<button style="left:${pct(Math.min(x + w, 0.985))};top:${pct(y)}"`); })() : '')).join('');
  div.appendChild(layer);
}

// Wraps a chapter's text from `start` to `end` in marks (one per text node it crosses), with a pin at the end.
function markEpubHighlight(h) {
  const chapter = viewer.querySelector(`.epub-chapter[data-page="${h.chapter}"]`);
  if (!chapter) return;
  const walker = document.createTreeWalker(chapter, NodeFilter.SHOW_TEXT), nodes = [];
  let pos = 0;
  while (walker.nextNode()) {
    const node = walker.currentNode, len = node.textContent.length;
    const a = Math.max(h.start, pos), b = Math.min(h.end, pos + len);
    if (a < b) nodes.push([node, a - pos, b - pos]);
    pos += len;
  }
  let last = null;
  for (const [node, a, b] of nodes) {
    const range = document.createRange();
    range.setStart(node, a); range.setEnd(node, b);
    const mark = document.createElement('mark');
    mark.className = `hl hl-${h.color}`;
    range.surroundContents(mark);
    last = mark;
  }
  last?.insertAdjacentHTML('afterend', pin(h));
}

// The editor for one highlight: colour, note, delete.
let openHl = null;
function openHighlight(id, anchor) {
  const h = bookHighlights().find(x => x.id === id);

  pop.style.top = Math.max(8, Math.min(innerHeight - pop.offsetHeight - 8, r.bottom + 8)) + 'px';
  $('#hlNote').focus();
}
function updateHighlight(id, change) {
  saveHighlights(bookHighlights().map(h => h.id === id ? { ...h, ...change } : h));
  drawHighlights();
}
$('#hlPop').onclick = e => {

};

document.addEventListener('mousedown', e => { if (!$('#hlPop').hidden && !e.target.closest('#hlPop, [data-hl]')) closeHighlight(); });

// The Notes tab: this book's highlights and notes in page order.
function renderNotes() {
  const pane = $('#notes'), list = bookHighlights();
  $('#notesCount').textContent = list.length || '';
  if (!pdfDoc) { pane.innerHTML = stateCard('note', t('notesNoBook')); return; }
  if (!list.length) { pane.innerHTML = stateCard('note', t('notesEmpty')); return; }
  const where = h => h.parts ? h.parts[0].page : h.chapter;

    <ul class="note-list">${sorted.map(h => `<li class="note-item" data-goto="${h.id}">
      <div class="q c-${h.color}" dir="auto">${esc(h.text)}</div>

      <div class="m">${bookType === 'epub' ? t('chapterN')(h.chapter) : t('pageN')(where(h))}</div></li>`).join('')}</ul>`;

// ---------- Backup ----------
// One file with My words (and their review progress), reading positions, recent books and settings.
// The API key is left out on purpose: it is a secret, and easy to paste again.
async function saveText(name, text, type) {
  if (desktopApp) return tauri.core.invoke('save_file', { name, contents: text });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  return name;
}
const backupMessage = (text, error = false) => { const el = $('#backupMsg'); el.textContent = text; el.classList.toggle('error', error); el.hidden = false; };

$('#backupSave').onclick = async () => {
  const { apiKey, ...safeSettings } = settings;
  const data = { app: 'siyaq', format: 1, version: await appVersion(), exported: new Date().toISOString(),
    settings: safeSettings, vocab, positions: store.get('positions', {}), library: library(), highlights };
  try {
    const where = await saveText(`siyaq-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 1), 'application/json');
    if (where) backupMessage(t('backupSaved')(vocab.length));
  } catch (err) { backupMessage(String(err), true); }
};

function restoreBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch { data = null; }
  if (data?.app !== 'siyaq' || !Array.isArray(data.vocab)) { backupMessage(t('backupBad'), true); return; }
  // Words: keep both sides; for the same word in the same sentence, keep the one further along in review.
  const key = v => v.word.toLowerCase() + '|' + v.sentence;
  const merged = new Map(vocab.map(v => [key(v), v]));
  let added = 0;
  for (const v of data.vocab.filter(v => v?.word)) {
    const had = merged.get(key(v));
    if (!had) added++;
    if (!had || (v.box || 0) > (had.box || 0)) merged.set(key(v), v);
  }
  vocab = [...merged.values()].sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
  store.set('vocab', vocab);
  const positions = store.get('positions', {});
  for (const [k, p] of Object.entries(data.positions || {})) if (!positions[k] || p.at > positions[k].at) positions[k] = p;
  store.set('positions', positions);
  for (const [k, list] of Object.entries(data.highlights || {})) {
    const ids = new Set((highlights[k] || []).map(h => h.id));
    highlights[k] = [...(highlights[k] || []), ...list.filter(h => !ids.has(h.id))];
  }
  store.set('highlights', highlights);
  const paths = new Set(library().map(b => b.path));
  store.set('library', [...library(), ...(data.library || []).filter(b => !paths.has(b.path))].slice(0, 12));
  const { apiKey, ...restored } = data.settings || {};
  Object.assign(settings, restored);
  store.set('settings', settings);
  for (const k of ['uiLang', 'theme']) form[k].value = settings[k];
  applyTheme();
  applyUiLanguage();
  target.value = settings.lang;
  updateVocabCount();
  refreshKnown();
  renderRecent();
  backupMessage(t('backupRestored')(added));
}

$('#backupLoad').onclick = async () => {
  if (!desktopApp) { $('#backupFile').click(); return; }
  const path = await tauri.core.invoke('pick_file', { label: t('backupTitle'), extensions: ['json'] }).catch(() => null);
  if (!path) return;
  try { restoreBackup(new TextDecoder().decode(new Uint8Array(await tauri.core.invoke('read_book', { path })))); }
  catch (err) { backupMessage(String(err), true); }
};
$('#backupFile').onchange = async e => {

  e.target.value = '';

};

  const forward = (e.key === 'ArrowRight') !== (document.dir === 'rtl');
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') showSlide(slide + (forward ? 1 : -1), !forward);
});
$('#setup').addEventListener('close', () => store.set('toured', true));
$('#setup').querySelector('.file-input').addEventListener('change', () => $('#setup').close());

async function openLink(url) {
  if (tauri) await tauri.core.invoke('open_link', { url });
  else window.open(url, '_blank', 'noopener');
}

$('#setupOpen').onclick = () => openLink(AI_STUDIO);
$('#setupLater').onclick = () => { store.set('setupSkipped', true); $('#setup').close(); };
$('#setupOther').onclick = () => { $('#setup').close(); openSettings('ai'); };
$('#setupKey').addEventListener('keydown', e => { if (e.key === 'Enter') $('#setupSave').click(); });
$('#setupSave').onclick = async () => {
  const key = $('#setupKey').value.trim(), msg = $('#setupMsg');
  if (!key) { $('#setupKey').focus(); return; }
  msg.className = 'msg';
  msg.textContent = t('setupChecking');
  try {
    const r = await requestJson('GET', GEMINI + 'models?pageSize=1', { 'x-goog-api-key': key });
    if (!r.ok) throw new Error(r.json?.error?.message || r.status);
    Object.assign(settings, { provider: 'gemini', apiKey: key });
    store.set('settings', settings);
    geminiModels = null;
    msg.className = 'msg ok';
    msg.textContent = t('setupOk');
    setTimeout(() => {
      if (tourFull) { showSlide(SLIDES.indexOf('done')); return; }
      $('#setup').close();
      if (lastLookup) lookup(lastLookup.word, lastLookup.sentence);
    }, 900);
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = t('setupBad') + err.message;
  }
};

// ---------- Version and updates ----------
appVersion().then(v => {
  if (!v || v === 'web') return;
  document.querySelectorAll('[data-version]').forEach(el => el.dataset.v = v);
  showVersion();
});

function offerUpdate(version) {
  showToast(t('updateAvail')(version), {
    label: t('updateNow'),
    run: async () => {
      showToast(t('updating'));
      try { await tauri.core.invoke('install_update'); } catch (err) { showToast(t('updateFailed') + err); }
    },
  });
}

// On its own a few seconds after starting (installed app only), and from Settings whenever asked.
if (tauri) setTimeout(async () => {
  try {
    const version = await tauri.core.invoke('check_update');
    if (version) offerUpdate(version);
  } catch {} // offline, or no releases yet
}, 3000);

$('#updateCheck').onclick = async () => {
  const msg = $('#updateMsg'), say = (text, cls = '') => { msg.textContent = text; msg.className = 'update-msg ' + cls; msg.hidden = false; };
  // Phones update from their app store; the web version is always the latest.
  if (!tauri || /Android|iPhone|iPad/.test(navigator.userAgent)) { say(t('updateNone'), 'ok'); return; }
  say(t('updateChecking'));
  try {
    const version = await tauri.core.invoke('check_update');
    if (!version) { say(t('updateNone'), 'ok'); return; }
    say(t('updateAvail')(version), 'ok');
    $('#settings').close('cancel');
    offerUpdate(version);
  } catch (err) {
    say(t('updateCheckFailed') + err, 'error');
  }
};

// ---------- UI ----------
function showTab(name) {
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $('#lookup').hidden = name !== 'lookup';
  $('#vocab').hidden = name !== 'vocab';
  $('#toc').hidden = name !== 'toc';
  $('#notes').hidden = name !== 'notes';
  if (name === 'toc') markTocCurrent(true);
  if (name === 'notes') renderNotes();
  if (name === 'vocab' && !reviewQueue) renderVocab();
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

const form = $('#settingsForm');
function syncProviderFields() {
  form.querySelector('[data-for="openai"]').hidden = form.provider.value !== 'openai';
  form.querySelectorAll('[data-for="gemini"]').forEach(el => el.hidden = form.provider.value !== 'gemini');
  form.model.placeholder = DEFAULT_MODELS[form.provider.value] || t('autoModel');
}
function showSettingsPane(name) {
  document.querySelectorAll('#settings .set-tabs button').forEach(b => { b.classList.toggle('on', b.dataset.pane === name); b.setAttribute('aria-selected', b.dataset.pane === name); });
  document.querySelectorAll('#settings .set-pane').forEach(p => p.hidden = p.dataset.pane !== name);
}
document.querySelectorAll('#settings .set-tabs button').forEach(b => b.onclick = () => showSettingsPane(b.dataset.pane));

function openSettings(pane = 'general') {
  showSettingsPane(pane);
  for (const k of ['uiLang', 'theme', 'provider', 'baseUrl', 'apiKey', 'model']) form[k].value = settings[k] || '';
  form.mcp.checked = !!settings.mcp;
  showUsage();
  $('#backupMsg').hidden = true;
  $('#mcpBox').hidden = $('#connectTab').hidden = !tauri || /Android|iPhone|iPad/.test(navigator.userAgent); // AI desktop apps only
  $('#mcpMsg').hidden = true;
  syncProviderFields();
  $('#settings').showModal();
}
form.provider.onchange = () => { form.model.value = ''; syncProviderFields(); };
$('#settings').addEventListener('close', () => {
  if ($('#settings').returnValue !== 'save') return;
  const uiChanged = form.uiLang.value !== settings.uiLang;
  for (const k of ['uiLang', 'theme', 'provider', 'baseUrl', 'apiKey', 'model']) settings[k] = form[k].value.trim();
  setSharing(form.mcp.checked);
  store.set('settings', settings);
  applyTheme();
  if (uiChanged) {
    applyUiLanguage();
    if (lastLookup) lookup(lastLookup.word, lastLookup.sentence); // redraw the open word's labels
  }
});
$('#settingsBtn').onclick = () => openSettings();
$('#tourAgain').onclick = () => { $('#settings').close('cancel'); openSetup(true); };
$('#setupFromSettings').onclick = () => { $('#settings').close('cancel'); openSetup(); };

// ---------- Appearance ----------
const systemDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => settings.theme === 'dark' || (settings.theme === 'system' && systemDark.matches);

let pagesDark = null; // the theme the open book's pages were drawn in
function applyTheme() {
  if (settings.theme === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = settings.theme;
  $('#themeBtn').innerHTML = icon(isDark() ? 'sun' : 'moon');
  if (pagesDark !== null && pagesDark !== isDark()) setZoom(zoom, true); // redraw pages in the new colours
  pagesDark = isDark();
}
// The quick toggle picks the opposite of what's on screen and keeps it, whatever the system does later.
$('#themeBtn').onclick = () => {
  settings.theme = isDark() ? 'light' : 'dark';
  store.set('settings', settings);
  applyTheme();
};
systemDark.addEventListener('change', applyTheme);

function applyUiLanguage() {
  document.documentElement.lang = settings.uiLang;
  document.documentElement.dir = LANGS[settings.uiLang].dir;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);
    el.setAttribute('aria-label', el.title);
  });
  showBookLang();
  if (!$('#vocab').hidden && !reviewQueue) renderVocab();
  if (!pdfDoc) $('#toc').innerHTML = stateCard('list', t('noBook'));
  $('#searchInput').placeholder = t('searchPh');
  renderLangPicks();
  showVersion();
  renderRecent();
}

function showVersion() {
  document.querySelectorAll('[data-version]').forEach(el => { if (el.dataset.v) el.textContent = t('versionLabel')(el.dataset.v); });
}

// The same choice as App language in Settings, one click away on the first screens.
const LANG_NAMES = { ar: 'العربية', en: 'English', tr: 'Türkçe' };
function renderLangPicks() {
  document.querySelectorAll('[data-lang-pick]').forEach(el => {
    el.innerHTML = icon('globe') + Object.keys(LANG_NAMES).map(l =>
      `<button type="button" lang="${l}" dir="${LANGS[l].dir}" data-l="${l}" class="${l === settings.uiLang ? 'on' : ''}" aria-pressed="${l === settings.uiLang}">${LANG_NAMES[l]}</button>`).join('');
    el.setAttribute('aria-label', t('uiLang'));
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-lang-pick] button');
  if (!b || b.dataset.l === settings.uiLang) return;
  settings.uiLang = b.dataset.l;
  store.set('settings', settings);
  applyUiLanguage();
  if (lastLookup) lookup(lastLookup.word, lastLookup.sentence);
});

const target = $('#target');
target.value = settings.lang;
target.onchange = () => {
  settings.lang = target.value;
  store.set('settings', settings);
  if (lastLookup) lookup(lastLookup.word, lastLookup.sentence); // show the open word in the new language
};
applyTheme();
applyUiLanguage();
updateVocabCount();
refreshKnown();
// New readers get the tour once; people who already have a key, or chose Later before, don't.
if (!settings.apiKey && settings.provider === 'gemini' && !store.get('setupSkipped', false)) openSetup(!store.get('toured', false));
</script>
</body>
</html>
