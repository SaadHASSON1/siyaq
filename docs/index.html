<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سياق · Siyaq — اقرأ بأي لغة دون أن تغادر الصفحة</title>
<meta name="description" content="قارئ PDF وEPUB مجاني ومفتوح المصدر: اضغط على أي كلمة ويظهر معناها حسب الجملة التي وردت فيها. عربي، إنجليزي، تركي.">
<meta property="og:title" content="سياق · Siyaq">
<meta property="og:description" content="Click any word in a PDF or EPUB and see what it means in that sentence. Free and open source.">
<meta property="og:image" content="https://saadhasson1.github.io/siyaq/screenshot-en-dark.png">
<meta name="theme-color" content="#0c1e33">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Literata:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfaf7; --bg-2: #f3f1ec; --surface: #ffffff; --text: #0f1b2d; --muted: #5d6573;
    --border: #e6e2da; --navy: #0c1e33; --green: #1fb08c; --green-dark: #17786c; --gold: #c9a45a;
    --accent-soft: #e4f3ee; --mark: rgba(242, 201, 76, .55); --shadow: 0 24px 60px -24px rgba(12, 30, 51, .28);
    --logo: url("logo.svg");
    --hl: rgba(242, 201, 76, .55); --gold-glow: rgba(201, 164, 90, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1320; --bg-2: #101a2a; --surface: #142033; --text: #eef1f6; --muted: #9aa5b5;
      --border: #22304a; --accent-soft: #123a35; --mark: rgba(242, 201, 76, .35); --shadow: 0 24px 60px -24px rgba(0, 0, 0, .7);
      --logo: url("logo-dark.svg");
      --hl: rgba(31, 176, 140, .34); --gold-glow: rgba(201, 164, 90, .12);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.65 "IBM Plex Sans Arabic", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  :lang(en) body, :lang(tr) body { font-family: "Inter", system-ui, sans-serif; }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  .wrap { width: min(1120px, 100% - 40px); margin-inline: auto; }
  .logo { width: 44px; height: 30px; background: var(--logo) center / contain no-repeat; flex: none; }

  /* ---------- Nav ---------- */
  .nav { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px); background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid transparent; transition: border-color .2s; }
  .nav.scrolled { border-bottom-color: var(--border); }
  .nav .wrap { display: flex; align-items: center; gap: 24px; height: 68px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; text-decoration: none; }
  .nav-links { display: flex; gap: 22px; margin-inline-start: auto; font-size: 15px; }
  .nav-links a { text-decoration: none; color: var(--muted); transition: color .15s; }
  .nav-links a:hover { color: var(--text); }
  .langs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; }
  .langs button { border: 0; background: none; color: var(--muted); font: 600 13px "Inter", sans-serif; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
  .langs button.on { background: var(--text); color: var(--bg); }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 14px; font-weight: 600; font-size: 16px; text-decoration: none; transition: transform .15s, box-shadow .15s, background .15s; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.primary { background: var(--navy); color: #fff; box-shadow: 0 10px 30px -10px rgba(12, 30, 51, .6); }
  @media (prefers-color-scheme: dark) { .btn.primary { background: var(--green); color: #06231c; box-shadow: 0 10px 30px -10px rgba(31, 176, 140, .5); } }
  .btn.primary:hover { transform: translateY(-2px); }
  .btn.ghost { border: 1px solid var(--border); background: var(--surface); }
  .btn.ghost:hover { background: var(--bg-2); }

  /* ---------- Hero ---------- */
  .hero { position: relative; }
  .hero-stage { position: relative; overflow: hidden; padding: 72px 0 96px; isolation: isolate; }
  /* Soft glows are plain radial gradients: blur filters this large get cut into visible lines by the GPU. */
  .glow { position: absolute; z-index: -1; border-radius: 50%; pointer-events: none; will-change: transform; }
  .glow.green { width: 1000px; height: 1000px; top: -260px; inset-inline-end: -420px; background: radial-gradient(closest-side, rgba(31, 176, 140, .34), rgba(31, 176, 140, 0)); }
  .glow.gold { width: 820px; height: 820px; bottom: -460px; inset-inline-start: -340px; background: radial-gradient(closest-side, var(--gold-glow), transparent); }

  /* On wide screens the hero stays pinned while you scroll, and scrolling plays the demo. */
  .hero.scrub { height: 320vh; }
  .hero.scrub .hero-stage { position: sticky; top: 68px; height: calc(100vh - 68px); min-height: 640px; display: flex; flex-direction: column; justify-content: center; padding: 0; }
  .hero.scrub .cursor, .hero.scrub .card, .hero.scrub .sentence .w, .hero.scrub .page { transition: none; }
  .hero.scrub .sentence .w.target { transition: background .2s; }
  .hero-text, .page { will-change: transform; }
  .page { transform-origin: 50% 70%; }
  .dots { display: none; gap: 8px; justify-content: center; margin-top: 40px; }
  .hero.scrub .dots { display: flex; }
  .dots i { position: relative; width: 34px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .dots i b { position: absolute; inset: 0; background: var(--green); transform-origin: left; transform: scaleX(0); }
  [dir="rtl"] .dots { direction: ltr; }
  .scroll-cue { display: none; position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; transition: opacity .3s; }
  .hero.scrub .scroll-cue { display: flex; }
  .scroll-cue svg { width: 20px; height: 20px; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(6px); } }
  .hero .wrap { display: grid; grid-template-columns: 1fr 1.05fr; gap: 56px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--accent-soft); color: var(--green-dark); font-size: 14px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .pill { color: #7fe0c4; } }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(31, 176, 140, .2); }
  h1 { font-size: clamp(38px, 5.2vw, 62px); line-height: 1.12; margin: 20px 0 18px; letter-spacing: -.02em; }
  h1 .hl { background: linear-gradient(transparent 68%, var(--hl) 68%); padding: 0 4px; }
  .lead { font-size: 19px; color: var(--muted); max-width: 520px; margin: 0 0 32px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .cta-note { width: 100%; margin-top: 10px; font-size: 14px; color: var(--muted); }

  /* The demo: a book page where a cursor clicks a word and the meaning appears. */
  .demo { position: relative; direction: ltr; }
  .page { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px 40px 46px; box-shadow: var(--shadow); min-height: 360px; }
  .page .chapter { font: 500 12px "Inter", sans-serif; letter-spacing: .2em; color: var(--muted); margin-bottom: 18px; }
  .lines span.bar { display: block; height: 11px; border-radius: 6px; background: var(--bg-2); margin: 13px 0; }
  .sentence { font: 25px/1.5 "Literata", Georgia, serif; margin: 22px 0; min-height: 76px; }
  .sentence .w { display: inline-block; opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; }
  .sentence.in .w { opacity: 1; transform: none; }
  .sentence .w.target { position: relative; border-radius: 6px; transition: opacity .35s, transform .35s, background .3s; padding: 0 2px; margin: 0 -2px; }
  .sentence .w.target.lit { background: var(--mark); }
  .cursor { position: absolute; top: 0; left: 0; width: 26px; height: 26px; z-index: 3; pointer-events: none; transition: transform .9s cubic-bezier(.65, 0, .35, 1), opacity .3s; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .25)); }
  .ripple { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; border: 2px solid var(--green); opacity: 0; pointer-events: none; z-index: 2; }
  .ripple.go { animation: ripple .6s ease-out; }
  @keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .card {
    position: absolute; z-index: 4; width: 290px; padding: 18px 20px 16px; border-radius: 16px; background: var(--surface);
    border: 1px solid var(--border); box-shadow: 0 18px 50px -12px rgba(12, 30, 51, .35); text-align: start;
    opacity: 0; transform: translateY(10px) scale(.97); transition: opacity .3s, transform .35s cubic-bezier(.2, .9, .3, 1.2); pointer-events: none;
  }
  .card.show { opacity: 1; transform: none; }
  .card .head { display: flex; align-items: baseline; gap: 10px; direction: ltr; }
  .card .word { font: 700 22px "Inter", sans-serif; }
  .card .pos { font-size: 12px; color: var(--muted); background: var(--bg-2); padding: 1px 8px; border-radius: 6px; }
  .card .meaning { font-size: 22px; font-weight: 700; color: var(--green-dark); margin: 6px 0 4px; }
  @media (prefers-color-scheme: dark) { .card .meaning { color: #6fdcbc; } }
  .card .note { font-size: 14px; color: var(--muted); line-height: 1.55; }
  .card .spark { position: absolute; top: -12px; inset-inline-end: 14px; width: 26px; height: 26px; color: var(--gold); opacity: 0; transform: scale(.4) rotate(-20deg); transition: opacity .3s .15s, transform .45s .15s cubic-bezier(.2, 1.4, .4, 1); }
  .card.show .spark { opacity: 1; transform: none; }
  .demo .tag { position: absolute; bottom: -16px; inset-inline-start: 28px; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--navy); color: #fff; font: 600 13px "Inter", sans-serif; box-shadow: var(--shadow); }
  .demo .tag b { color: var(--gold); font-weight: 600; }

  /* ---------- Sections ---------- */
  section.block { padding: 96px 0; }
  section.alt { background: var(--bg-2); }
  .eyebrow { color: var(--green-dark); font-weight: 700; font-size: 14px; letter-spacing: .04em; }
  @media (prefers-color-scheme: dark) { .eyebrow { color: #6fdcbc; } }
  h2 { font-size: clamp(30px, 3.6vw, 42px); line-height: 1.2; margin: 8px 0 14px; letter-spacing: -.015em; }
  .sub { color: var(--muted); max-width: 620px; margin: 0 0 48px; font-size: 18px; }
  .center { text-align: center; }
  .center .sub { margin-inline: auto; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; counter-reset: step; }
  .step { position: relative; padding: 28px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); }
  .step::before { counter-increment: step; content: counter(step); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--navy); color: #fff; font: 700 17px "Inter", sans-serif; margin-bottom: 16px; }
  @media (prefers-color-scheme: dark) { .step::before { background: var(--green); color: #06231c; } }
  .step h3 { margin: 0 0 6px; font-size: 19px; }
  .step p { margin: 0; color: var(--muted); font-size: 15.5px; }

  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .feature { padding: 24px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); transition: transform .2s, box-shadow .2s; }
  .feature:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .feature .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--green-dark); margin-bottom: 14px; }
  @media (prefers-color-scheme: dark) { .feature .ico { color: #6fdcbc; } }
  .feature .ico svg { width: 22px; height: 22px; }
  .feature h3 { margin: 0 0 4px; font-size: 17px; }
  .feature p { margin: 0; color: var(--muted); font-size: 15px; }

  .shots { position: relative; }
  .shot-tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 24px; }
  .shot-tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; padding: 7px 18px; border-radius: 999px; cursor: pointer; }
  .shot-tabs button.on { background: var(--navy); color: #fff; }
  .frame { border-radius: 18px; overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); background: var(--surface); }
  .frame .chrome { display: flex; gap: 7px; padding: 12px 16px; border-bottom: 1px solid var(--border); direction: ltr; }
  .frame .chrome i { width: 11px; height: 11px; border-radius: 50%; background: var(--border); }
  .frame img { width: 100%; }

  .privacy { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .privacy ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
  .privacy li { display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
  .privacy li svg { width: 22px; height: 22px; flex: none; color: var(--green); margin-top: 2px; }
  .privacy li b { display: block; }
  .privacy li span { color: var(--muted); font-size: 15px; }

  .download { position: relative; overflow: hidden; border-radius: 28px; padding: 64px 48px; background: var(--navy); color: #fff; text-align: center; }
  .download::before { content: ""; position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(closest-side, rgba(31, 176, 140, .38), rgba(31, 176, 140, 0)); top: -460px; inset-inline-start: -320px; }
  .download > * { position: relative; }
  .download h2 { color: #fff; }
  .download .sub { color: #b9c4d6; }
  .download .btn.primary { background: #fff; color: var(--navy); box-shadow: none; }
  .download .others { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .download .others a { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .18); color: #dfe6f1; text-decoration: none; font-size: 15px; }
  .download .others a:hover { background: rgba(255, 255, 255, .08); }
  .download .others svg { width: 18px; height: 18px; }
  .download .fine { margin: 26px auto 0; max-width: 560px; font-size: 14px; color: #9fb0c8; }
  .version { font: 500 13px "Inter", sans-serif; color: #9fb0c8; margin-top: 12px; }

  footer { padding: 40px 0 56px; color: var(--muted); font-size: 14px; }
  footer .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  footer .brand { font-size: 16px; color: var(--text); }
  footer nav { margin-inline-start: auto; display: flex; gap: 18px; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--text); }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s, transform .7s; }
  .reveal.seen { opacity: 1; transform: none; }

  @media (max-width: 960px) {
    .hero .wrap, .privacy { grid-template-columns: 1fr; }
    .hero-stage { padding-top: 40px; }
    .features { grid-template-columns: 1fr 1fr; }
    .steps { grid-template-columns: 1fr; }
    .nav-links { display: none; }
    .langs { margin-inline-start: auto; }
  }
  @media (max-width: 620px) {
    body { font-size: 16px; }
    .features { grid-template-columns: 1fr; }
    .page { padding: 28px 24px 36px; min-height: 330px; }
    .sentence { font-size: 21px; }
    .card { width: 250px; }
    .download { padding: 48px 22px; border-radius: 22px; }
    section.block { padding: 72px 0; }
    .btn { height: 50px; padding: 0 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="brand" href="#"><span class="logo" role="img" aria-label="Siyaq"></span><span data-t="brand"></span></a>
    <nav class="nav-links">
      <a href="#how" data-t="navHow"></a>
      <a href="#features" data-t="navFeatures"></a>
      <a href="#download" data-t="navDownload"></a>
      <a href="https://github.com/SaadHASSON1/siyaq">GitHub</a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="ar">ع</button><button data-lang="en">EN</button><button data-lang="tr">TR</button>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="hero-stage">
    <span class="glow green" id="glowGreen"></span><span class="glow gold" id="glowGold"></span>
    <div class="wrap">
      <div class="hero-text" id="heroText">
        <span class="pill"><i></i><span data-t="pill"></span></span>
        <h1 data-t="heroTitle"></h1>
        <p class="lead" data-t="heroLead"></p>
        <div class="cta">
          <a class="btn primary" data-dl href="https://github.com/SaadHASSON1/siyaq/releases/latest"><span data-os-icon></span><span data-dl-label></span></a>
          <a class="btn ghost" href="https://github.com/SaadHASSON1/siyaq"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg><span data-t="source"></span></a>
          <div class="cta-note" data-t="ctaNote"></div>
        </div>
      </div>

      <div class="demo" id="demo" aria-hidden="true">
        <div class="page" id="demoPage">
          <div class="chapter">CHAPTER ONE</div>
          <div class="lines"><span class="bar" style="width:92%"></span><span class="bar" style="width:84%"></span></div>
          <div class="sentence" id="sentence"></div>
          <div class="lines"><span class="bar" style="width:96%"></span><span class="bar" style="width:88%"></span><span class="bar" style="width:62%"></span></div>
          <div class="ripple" id="ripple"></div>
          <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M5 3l14 7.5-6.2 1.7L10 18.5z" fill="#fff" stroke="#0c1e33" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <div class="card" id="card">
            <svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c.9 5.6 2.4 7.1 11 8.5-8.6 1.4-10.1 2.9-11 13.5C11.1 12.4 9.6 10.9 1 9.5 9.6 8.1 11.1 6.6 12 1z"/></svg>
            <div class="head"><span class="word" id="cardWord"></span><span class="pos" id="cardPos"></span></div>
            <div class="meaning" id="cardMeaning"></div>
            <div class="note" id="cardNote"></div>
          </div>
        </div>
        <div class="tag">English <span>→</span> <b id="demoTarget"></b></div>
        <div class="dots" id="dots"><i><b></b></i><i><b></b></i><i><b></b></i></div>
      </div>
    </div>
    <div class="scroll-cue" id="scrollCue"><span data-t="scrollCue"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
    </div>
  </section>

  <section class="block alt" id="how">
    <div class="wrap">
      <div class="center reveal">
        <div class="eyebrow" data-t="howEyebrow"></div>
        <h2 data-t="howTitle"></h2>
        <p class="sub" data-t="howSub"></p>
      </div>
      <div class="steps">
        <div class="step reveal"><h3 data-t="s1t"></h3><p data-t="s1p"></p></div>
        <div class="step reveal"><h3 data-t="s2t"></h3><p data-t="s2p"></p></div>
        <div class="step reveal"><h3 data-t="s3t"></h3><p data-t="s3p"></p></div>
      </div>
    </div>
  </section>

  <section class="block" id="features">
    <div class="wrap">
      <div class="reveal">
        <div class="eyebrow" data-t="featEyebrow"></div>
        <h2 data-t="featTitle"></h2>
        <p class="sub" data-t="featSub"></p>
      </div>
      <div class="features" id="featureGrid"></div>
    </div>
  </section>

  <section class="block alt">
    <div class="wrap center shots">
      <div class="reveal">
        <div class="eyebrow" data-t="shotEyebrow"></div>
        <h2 data-t="shotTitle"></h2>
      </div>
      <div class="shot-tabs reveal" role="tablist">
        <button class="on" data-shot="screenshot-ar-light.png" data-t="shotLight"></button>

const page = $('#demoPage'), sentence = $('#sentence'), cursor = $('#cursor'), card = $('#card'), ripple = $('#ripple');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;

// Puts example i on the page and works out where the cursor and the card go (page coordinates).
function prepareExample(i) {
  const ex = EXAMPLES[i], to = demoLang(i);
  sentence.innerHTML = ex.words.map((w, k) => `<span class="w${k === ex.at ? ' target' : ''}" style="transition-delay:${k * 45}ms">${w}</span> `).join('');
  $('#cardWord').textContent = ex.words[ex.at];
  $('#demoTarget').textContent = LANG_NAMES[to];
  $('#cardPos').textContent = ex.pos[to];
  $('#cardMeaning').textContent = ex.meaning[to];
  $('#cardNote').textContent = ex.note[to];
  card.dir = to === 'ar' ? 'rtl' : 'ltr';
  const target = sentence.querySelector('.target');
  return {
    target,
    x: target.offsetLeft + target.offsetWidth * .55,
    y: target.offsetTop + target.offsetHeight * .6,
    cardLeft: clamp(target.offsetLeft - 40, 16, page.clientWidth - card.offsetWidth - 16),
    cardTop: Math.max(target.offsetTop + target.offsetHeight, sentence.offsetTop + sentence.offsetHeight) + 10, // below the whole sentence, even when it wraps
  };
}

function playRipple(pos) {
  ripple.style.left = pos.x + 'px';
  ripple.style.top = pos.y + 'px';
  ripple.classList.remove('go');
  void ripple.offsetWidth;
  ripple.classList.add('go');
}

// Phones and reduced motion: the demo plays by itself.
let playToken = 0;
async function autoplay() {
  const token = ++playToken;
  for (let i = 0; token === playToken; i = (i + 1) % EXAMPLES.length) {
    sentence.classList.remove('in');
    const pos = prepareExample(i);
    card.style.left = pos.cardLeft + 'px';
    card.style.top = pos.cardTop + 'px';
    await sleep(60);
    sentence.classList.add('in');
    if (!reduced) {
      cursor.style.opacity = 1;
      cursor.style.transform = `translate(${page.clientWidth - 70}px, ${page.clientHeight - 60}px)`;
    }
    await sleep(reduced ? 0 : 900);
    cursor.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
    await sleep(reduced ? 0 : 1000);
    if (token !== playToken) return;
    playRipple(pos);
    pos.target.classList.add('lit');
    await sleep(reduced ? 0 : 250);
    card.classList.add('show');
    if (reduced) return;
    await sleep(3600);
    card.classList.remove('show');
    pos.target.classList.remove('lit');
    await sleep(500);
  }
}

// Wide screens: scrolling through the pinned hero tilts the page into place, then plays the three
// examples one after another; scrolling back plays them backwards.
let shown = -1, rippled = -1, pos = null;
function scrubFrame() {
  const hero = $('#hero');
  const p = clamp((scrollY - hero.offsetTop) / (hero.offsetHeight - innerHeight));
  const side = document.documentElement.dir === 'rtl' ? 1 : -1;
  const k = ease(clamp(p / .12));
  page.style.transform = `perspective(1400px) rotateX(${(1 - k) * 16}deg) rotateY(${(1 - k) * 12 * side}deg) translateY(${(1 - k) * 40}px) scale(${.92 + .08 * k})`;
  $('#heroText').style.transform = `translateY(${-p * 50}px)`;
  $('#glowGreen').style.transform = `translate(${-p * 140 * side}px, ${p * 220}px)`;
  $('#glowGold').style.transform = `translate(${p * 120 * side}px, ${-p * 180}px)`;
  $('#scrollCue').style.opacity = p > .02 ? 0 : 1;

  const n = EXAMPLES.length, q = clamp((p - .12) / .88) * n;
  const i = Math.min(Math.floor(q), n - 1), f = q - i;
  if (i !== shown) {
    pos = prepareExample(i);
    sentence.classList.add('in');
    card.style.left = pos.cardLeft + 'px';
    card.style.top = pos.cardTop + 'px';
    shown = i;
  }
  document.querySelectorAll('#dots b').forEach((b, j) => { b.style.transform = `scaleX(${j < i ? 1 : j === i ? f : 0})`; });

  const m = ease(clamp(f / .35));
  cursor.style.opacity = clamp(p / .1);
  cursor.style.transform = `translate(${lerp(page.clientWidth - 70, pos.x, m)}px, ${lerp(page.clientHeight - 60, pos.y, m)}px)`;
  const clicked = f >= .36, last = i === n - 1;
  if (clicked && rippled !== i) { playRipple(pos); rippled = i; }
  if (!clicked && rippled === i) rippled = -1;
  const inK = clamp((f - .4) / .1), outK = last ? 0 : clamp((f - .9) / .08);
  pos.target.classList.toggle('lit', clicked && outK < .5);
  card.style.opacity = inK * (1 - outK);
  card.style.transform = `translateY(${(1 - inK) * 14 - outK * 8}px) scale(${.96 + .04 * inK})`;
  card.classList.toggle('show', inK > .5 && outK < .5);
}

const wide = matchMedia('(min-width: 961px)');
let frameQueued = false;
const onScroll = () => {
  if (frameQueued) return;
  frameQueued = true;
  requestAnimationFrame(() => { frameQueued = false; scrubFrame(); });
};
function setDemoMode() {
  const scrub = wide.matches && !reduced;
  $('#hero').classList.toggle('scrub', scrub);
  for (const el of [page, cursor, card, $('#heroText'), $('#glowGreen'), $('#glowGold')]) el.removeAttribute('style');
  card.classList.remove('show');
  removeEventListener('scroll', onScroll);
  shown = rippled = -1;
  if (scrub) {
    playToken++; // stop the autoplay loop
    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', onScroll);
    scrubFrame();
  } else {
    autoplay();
  }
}
wide.addEventListener('change', setDemoMode);

// ---------- Small touches ----------
const nav = $('#nav');
addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 8), { passive: true });
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

applyLang();
setDemoMode();
</script>
</body>
</html>
